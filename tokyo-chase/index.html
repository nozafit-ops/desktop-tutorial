            ${dets.slice(0, 4).map((src, i) => `<img class="rs-det d${i}" src="${src}" alt="">`).join("")}
            <img class="rs-thief" src="${thief().img}" alt="">
            <svg class="rs-cuffs" viewBox="0 0 80 40" aria-hidden="true"><circle cx="18" cy="20" r="13" fill="none" stroke="#C9CDD4" stroke-width="6"/><circle cx="62" cy="20" r="13" fill="none" stroke="#C9CDD4" stroke-width="6"/><path d="M31 20 h18" stroke="#C9CDD4" stroke-width="5" stroke-dasharray="5 3"/></svg>
            </div>`;
      // 完成画像（art/results/scene-<種類>-<怪盗番号>.webp）があれば、合成の代わりにそれを表示
      const kind = xWin ? (G.reason === "meet" ? "meet" : "escape") : "caught";
      const full = `<img class="rs-full" src="art/results/scene-${kind}-${(A.thief || 0) + 1}.webp" alt="" onload="this.parentNode.classList.add('full')" onerror="this.remove()">`;
      sc.innerHTML = `<div class="card result-card">${scene.replace(/(<div class="rs-scene[^>]*>)/, "$1" + full)}
        <div class="rs-stamp-row"><span class="rs-stamp ${xWin ? "gold" : "red"}">${title}</span></div>
        <h2>${you === null ? (xWin ? "怪盗Xの逃走成功" : "怪盗X、逮捕！") : you ? "あなたの勝ち！" : "あなたの負け…"}</h2>
        <p class="c">${G.xLog.length}手目で決着。${reason}</p>
        <div class="row"><button class="btn" data-act="again">もう一度</button><button class="btn ghost" data-act="title">タイトルへ</button></div>
        <button class="btn ghost wide" data-act="closeResult">盤面と逃走経路を見る</button></div>`;
      return;
    }
    if (G && A.pendingCard && A.pendingCard.stage === "reveal" && !(A.role === "pass" && (A.cover === "x" || A.cover === "d"))) {
      const pc = A.pendingCard, c = CARD[pc.card];
      sc.hidden = false;
      sc.classList.add("dim");
      sc.innerHTML = `<div class="card">
        <div class="label-c">${pc.side === "x" ? "怪盗Xのカード" : "刑事チームのカード"}・${G.xLog.length + (pc.side === "x" ? 1 : 0)}手目</div>
        <div class="gcard ${pc.card === "miss" ? "miss" : pc.side}">
          <div class="gc-kind">${pc.card === "miss" ? "MISS" : pc.side === "x" ? "THIEF CARD" : "DETECTIVE CARD"}</div>
          <img class="gc-art" src="${pxHandArt(pc.card)}" alt="">
          <div class="gc-name">${c.name}</div>
          <div class="gc-desc">${c.desc}</div>
        </div>
        <button class="btn wide" data-act="cardOk">${pc.card === "miss" ? "残念… 閉じる" : "OK"}</button></div>`;
      return;
    }
    if (G && A.role === "pass" && !G.over && (A.cover === "x" || A.cover === "d")) {
      sc.hidden = false;
      sc.classList.add("cover");
      const toX = A.cover === "x";
      sc.innerHTML = `<div class="card"><div class="faces">${toX ? portrait("x", 0, "lg") : G.det.map((_, k) => portrait("d", k, "lg")).join("")}</div>
        <h2>${toX ? "怪盗Xの番です" : "刑事の番です"}</h2>
        <p class="c">${toX ? "刑事のみなさんは画面を見ないでください。<br>怪盗X役の人に端末を渡してください。" : "怪盗Xは移動しました。<br>刑事のみなさんに端末を渡してください。"}</p>
        <button class="btn wide" data-act="${toX ? "openX" : "openD"}">${toX ? "怪盗Xです。表示する" : "刑事です。はじめる"}</button></div>`;
      return;
    }
    sc.hidden = true;
  }

  function skylineSVG() {
    return `<svg class="skyline" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path d="M0,400 V300 H60 V270 H90 V300 H140 V250 H170 V300 H230 V280 H260 V220 L275,120 L290,220 V300 H320 V285 H380 V300 H420
        V180 H424 V170 L432,150 L440,170 V180 H444 V300 H470 V260 A40,40 0 0 1 550,260 V300 H600 V280 H640 V300
        H700 V200 L716,180 L732,200 V300 H760 V210 L776,190 L792,210 V300 H830 V290 H880 V240 H900 V300 H960 V270 H990 V300 H1040 V230 L1060,140 L1080,230 V300 H1120 V280 H1200 V400 Z" fill="#0A0D14"/>
      <path d="M700,236 H792" stroke="#0A0D14" stroke-width="8"/>
      <circle cx="432" cy="195" r="7" fill="#E3B341" opacity="0.8"/>
      ${Array.from({ length: 26 }, (_, i) => `<rect x="${40 + i * 44}" y="${320 + (i % 3) * 18}" width="6" height="9" fill="#E3B341" opacity="${0.25 + (i % 4) * 0.12}"/>`).join("")}
    </svg>`;
  }

  // 盤面の背景画像（路線・駅なし）を書き出す
  async function exportBackground(fmt) {
    const svg = backgroundSVG();
    let blob;
    try {
      if (fmt === "svg") blob = new Blob([svg], { type: "image/svg+xml" });
      else {
        toast("背景画像を書き出しています…");
        const im = new Image();
        im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
        await im.decode();
        const k = 1.5;
        const c = document.createElement("canvas");
        c.width = W * k; c.height = H * k;
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        blob = await new Promise(r => c.toBlob(r, "image/png"));
      }
    } catch (e) { toast("画像を作れませんでした"); return; }
    const filename = `tokyo-chase-background.${fmt}`;
    let dl = null;
    try { dl = await window.claude?.use?.("downloads"); } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename, data: blob }); toast(`${filename} を保存しました`); }
      catch (e) { if (e?.code !== "declined") toast("保存できませんでした"); }
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }
  window.tokyoChaseBackgroundSVG = () => backgroundSVG();

  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    $("toastHost").replaceChildren(t);
    setTimeout(() => { if (t.parentNode) t.remove(); }, 2500);
  }

  // ======================================================================
  // イベント
  // ======================================================================
  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    const { w, h } = vpSize();
    switch (act) {
      case "start": return startGame(b.dataset.role);
      case "resume": { const s = loadSave(); if (s) resume(s); return; }
      case "again": return startGame(A.role);
      case "title": clearTimeout(timer); A.screen = "title"; A.sel = null; renderScreen(); renderSheet(); return;
      case "toggleHud": {
        const hidden = document.body.classList.toggle("hud-hidden");
        try { localStorage.setItem("tokyo-chase-hud-hidden", hidden ? "1" : "0"); } catch (e) {}
        b.setAttribute("aria-expanded", String(!hidden));
        b.setAttribute("aria-label", hidden ? "上部の表示を出す" : "上部の表示を隠す");
        setTimeout(() => { clampView(); applyView(); layoutEdge(); }, 330);
        return;
      }
      case "menu": clearTimeout(timer); save(); A.screen = "title"; A.sel = null; renderScreen(); renderSheet(); return;
      case "rules": A.screen = "rules"; renderScreen(); return;
      case "exportBg": exportBackground(b.dataset.fmt); return;
      case "dets": A.detCount = Number(b.dataset.n); renderScreen(); return;
      case "detPick": A.detPick = Number(b.dataset.i); try { localStorage.setItem(DET_KEY, String(A.detPick)); } catch (e) {} renderScreen(); return;
      case "thief": A.thief = Number(b.dataset.i); try { localStorage.setItem(THIEF_KEY, String(A.thief)); } catch (e) {} renderScreen(); return;
      case "result": A.screen = "result"; renderScreen(); return;
      case "closeResult": A.screen = "game"; renderScreen(); fitView(); return;
      case "openX": A.cover = "x-open"; step(); focusTurn(); return;
      case "openD": A.cover = null; render(); step(); return;
      case "zoomIn": if (LOCK) return; return zoomAt(1.5, w / 2, h / 2);
      case "zoomOut": if (LOCK) return; return zoomAt(1 / 1.5, w / 2, h / 2);
      case "tapStation": return onStationTap(Number(b.dataset.pos));
      case "fit": return fitView();
      case "focusTurn": return focusTurn();
      case "focusX": if (LOCK) return;
      { const G = A.G; if (!G) return; if (xVisible()) centerOn(A.sec.pos); else if (G.lastSeen) centerOn(G.lastSeen.pos); else toast("怪盗Xはまだ姿を見せていません"); return; }
      case "focusD": if (LOCK) return; return A.G && centerOn(A.G.det[Number(b.dataset.k)].pos);
      case "focusPos": if (LOCK) { const p = Number(b.dataset.pos); toast(`${NO(p)} ${NAME(p)}`); return; } return centerOn(Number(b.dataset.pos));
      case "cardOk": {
        const pc = A.pendingCard;
        if (!pc || pc.stage !== "reveal") return;
        A.pendingCard = null;
        return step();
      }
      case "cardCancel": if (A.pendingCard && A.pendingCard.stage === "target") { A.pendingCard = null; render(); } return;
      case "hand": if (!handViewSide()) return; A.handSheet = true; A.sel = null; renderSheet(); return;
      case "handClose": A.handSheet = false; renderSheet(); return;
      case "useCard": {
        if (!canUseHand()) return;
        const side = handSide(), i = Number(b.dataset.i), card = handOf(A.G, side)[i];
        A.handSheet = false;
        if (needsTargetCard(card)) {
          const opts = cardTargets(A.G, A.sec, card) || [];
          if (!opts.length) { toast("いまは使える場所がありません"); renderSheet(); return; }
          A.pendingCard = { side, card, stage: "target", opts, handIndex: i };
          render();
          if (card === "destroy") fitStations([A.sec.pos, ...opts]); else fitView();
          return;
        }
        let tgt = null;
        if (card === "checkpoint") {
          if (A.G.turn === "x") return;
          tgt = A.G.det[A.G.turn].pos;
        }
        if (card === "dash") {
          if (A.G.turn === "x" || A.G.dash != null) return;
          tgt = A.G.turn;
        }
        handOf(A.G, side).splice(i, 1);
        useCardNow(side, card, tgt);
        save(); render();
        return;
      }
      case "order": A.orderSheet = Number(b.dataset.k); A.sel = null; renderSheet(); return;
      case "orderPick": A.pendingOrder = A.orderSheet; A.orderSheet = null; renderSheet(); render(); toast(`${dName(A.pendingOrder)} の行き先の駅をタップ`); return;
      case "orderClear": { const k = A.orderSheet; if (A.G.orders) delete A.G.orders[k]; A.orderSheet = null; toast(`${dName(k)} はおまかせで動きます`); save(); render(); return; }
      case "orderClose": A.orderSheet = null; renderSheet(); return;
      case "pinSend": {
        const k = Number(b.dataset.k), st = A.pinSheet, G = A.G;
        G.pin = st; G.orders = { ...(G.orders || {}), [k]: st };
        A.pinSheet = null;
        toast(`${dName(k)}：${NAME(st)} へ向かいます`);
        pushFeed(G.xLog.length, `作戦ピン：${dName(k)} は ${NO(st)} ${NAME(st)} へ`);
        save(); render(); return;
      }
      case "pinSurround": {
        const st = A.pinSheet, G = A.G;
        G.pin = st; surround(st);
        A.pinSheet = null;
        toast(`${NAME(st)} を包囲せよ！`);
        pushFeed(G.xLog.length, `作戦ピン：全員で ${NO(st)} ${NAME(st)} を包囲`, true);
        save(); render(); return;
      }
      case "pinClear": A.G.pin = null; A.G.orders = {}; A.pinSheet = null; toast("作戦ピンと指示を外しました"); save(); render(); return;
      case "pinClose": A.pinSheet = null; renderSheet(); return;
      case "hint": A.hints = !A.hints; render(); return;
      case "overview": {
        if (!A.G) return;
        A.overview = !A.overview;
        if (A.overview) {
          // 盤面全体を、上の表示の下に収める
          const top = hudTop(), s = Math.min(w / W, (h - top - 16) / H);
          animateView(s, (w - W * s) / 2, top + (h - top - H * s) / 2, 420);
          toast("全体地図：もう一度押すと自分の視点に戻ります");
        } else lockView();
        render();
        return;
      }
      case "log": $("drawer").hidden = !$("drawer").hidden; renderHandbar(); return;
      case "cancel": A.sel = null; A.useDouble = false; render(); return;
      case "double": A.useDouble = !A.useDouble; renderSheet(); return;
      case "passTurn": {
        if (!humanTurn()) return;
        const G = A.G;
        A.sel = null; A.useDouble = false;
        if (G.turn === "x") {
          if (G.doubling || !xMoves(G, A.sec).length) return;
          commitX(A.sec.pos, "pass");
        } else {
          const k = G.turn;
          pushFeed(G.xLog.length, `${dName(k)} はパス（その場にとどまった）`);
          apply(() => skipD(G, k));
          step();
        }
        return;
      }
      case "heli": {
        if (!humanTurn()) return;
        const G = A.G, moves = G.turn === "x" ? xMoves(G, A.sec) : detMoves(G, G.turn);
        if (!moves.some(m => m.type === "heli")) return;
        A.sel = -1; A.useDouble = false; render(); return;
      }
      case "ticket": {
        const G = A.G, to = A.sel, type = b.dataset.type;
        if (to === null || !humanTurn()) return;
        if (G.turn === "x") commitX(to, type); else commitD(G.turn, to, type);
        return;
      }
    }
  });
  $("sheet").addEventListener("click", e => { if (e.target === $("sheet")) { A.sel = null; A.useDouble = false; A.orderSheet = null; A.pinSheet = null; A.handSheet = false; render(); } });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && A.sel !== null) { A.sel = null; render(); }
    if (A.screen !== "game") return;
    const { w, h } = vpSize();
    if (e.key === "+" || e.key === "=") zoomAt(1.4, w / 2, h / 2);
    if (e.key === "-") zoomAt(1 / 1.4, w / 2, h / 2);
  });

  // ======================================================================
  // 起動
  // ======================================================================
  function boot(data) {
    renderBackground();
    buildBoard();
    fitView(false);
    if (data && data.A && data.A.G) {
      Object.assign(A, data.A, { busy: false });
      buildTokens();
      if (A.screen === "game" && !A.G.over) step(); else render();
    } else {
      renderScreen();
    }
  }
  try { window.claude?.hot?.snapshot?.(() => ({ A })); } catch (e) {}
  if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
  else boot(window.claude?.hot?.data ?? {});
})();
</script>
