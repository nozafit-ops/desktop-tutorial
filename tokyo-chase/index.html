<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ARTIFACT-START -->
<title>ロンドン・チェイス</title>
<link rel="icon" type="image/png" href="art/icons/favicon-64.png">
<link rel="apple-touch-icon" href="art/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Zen+Old+Mincho:wght@700;900&display=swap">
<style>
  /* ボードゲームアプリ風の単一テーマ：夜のテーブルに広げた古地図 */
  :root {
    color-scheme: dark;
    --ground: #120E0A;
    --hud: rgba(22, 17, 12, 0.86);
    --hud-solid: #1C1610;
    --hud-2: #2A2118;
    --ink: #F4EAD6;
    --muted: #B9A98E;
    --rule: rgba(227, 179, 65, 0.28);
    --gold: #E3B341;
    --gold-deep: #A87A18;
    --map-ink: #3B2C1E;
    --paper: #FBF5E4;
    --taxi: #F2B51D;
    --bus: #16935B;
    --tube: #D2362C;
    --ferry: #2F7FB0;
    --heli: #7C3AED;
    --black: #0B0906;
    --xrim: #C0271F;
    --good: #5FBF7A;
    --r: 14px;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  button:disabled { cursor: not-allowed; opacity: 0.4; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  #app { position: relative; height: 100%; overflow: hidden; }

  /* ---------------- 盤面 ---------------- */
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: #2A2016; cursor: grab; }
  #map.dragging { cursor: grabbing; }
  .edge { fill: none; stroke-linecap: round; }
  .edge.taxi { stroke: var(--taxi); stroke-width: 6; }
  .edge.taxi.casing { stroke: #7A5A0E; stroke-width: 9; opacity: 0.55; }
  .edge.bus { stroke: var(--bus); stroke-width: 10; }
  .edge.bus.casing { stroke: #0B4F31; stroke-width: 13; opacity: 0.5; }
  .edge.tube { stroke: var(--tube); stroke-width: 13; }
  .edge.tube.casing { stroke: #6E1510; stroke-width: 16; opacity: 0.55; }
  .edge.tube.dash { stroke: #FFE9E3; stroke-width: 3.5; stroke-dasharray: 12 12; stroke-linecap: butt; }
  .edge.boat { stroke: var(--ferry); stroke-width: 7; stroke-dasharray: 18 10; }
  .edge.boat.casing { stroke: #FBF5E4; stroke-width: 11; stroke-dasharray: none; opacity: 0.8; }
  .wedge.boat { fill: var(--ferry); }
  .helipad { fill: rgba(124, 58, 237, 0.16); stroke: var(--heli); stroke-width: 4; stroke-dasharray: 10 6; }
  .heli-h { font-family: Georgia, serif; font-weight: 700; font-size: 26px; fill: #fff; paint-order: stroke; stroke: var(--heli); stroke-width: 9px; stroke-linejoin: round; text-anchor: middle; pointer-events: none; }
  .bridge-pt { fill: #CDB98C; stroke: #3B2C1E; stroke-width: 3; }
  .dud-x { stroke: #E5484D; stroke-width: 7; stroke-linecap: round; }
  .dud-label { font-weight: 900; font-size: 19px; fill: #fff; paint-order: stroke; stroke: #E5484D; stroke-width: 7px; stroke-linejoin: round; text-anchor: middle; }
  .pawn-num { font-weight: 900; font-size: 15px; fill: #fff; text-anchor: middle; paint-order: stroke; stroke: rgba(0,0,0,0.55); stroke-width: 3px; }
  .tok .ring { fill: none; stroke: #FFF6D8; stroke-width: 5; }
  .stn-base { fill: var(--paper); }
  .stn-rim { fill: none; stroke: var(--map-ink); stroke-width: 3; }
  .wedge.taxi { fill: var(--taxi); }
  .wedge.bus { fill: var(--bus); }
  .wedge.tube { fill: var(--tube); }
  .stn-num { font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 900; font-size: 15px; fill: var(--map-ink); text-anchor: middle; pointer-events: none; }
  .stn-label {
    font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 900; font-size: 17px; fill: var(--map-ink);
    paint-order: stroke; stroke: var(--paper); stroke-width: 6px; stroke-linejoin: round;
    text-anchor: middle; pointer-events: none;
  }
  #map.z0 .stn-label { display: none; }
  #map.z1 .stn-label:not(.hot) { display: none; }
  #map.z0 .stn-label.hot { display: inline; font-size: 24px; stroke-width: 8px; }
  .dest { fill: rgba(255, 244, 200, 0.35); stroke: #FFF6D8; stroke-width: 5; }
  .dest-outer { fill: none; stroke: var(--map-ink); stroke-width: 3; }
  .dest.pulse, .dest-outer.pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .sel { fill: none; stroke: var(--xrim); stroke-width: 6; }
  .poss { fill: var(--xrim); opacity: 0.28; }
  .lastseen { fill: none; stroke: var(--xrim); stroke-width: 4; stroke-dasharray: 8 6; }
  .lastseen-label { font-weight: 900; font-size: 20px; fill: var(--xrim); paint-order: stroke; stroke: var(--paper); stroke-width: 6px; text-anchor: middle; }
  .trail { fill: none; stroke: var(--xrim); stroke-width: 6; stroke-dasharray: 14 9; opacity: 0.9; }
  .tok { transition: transform 0.55s cubic-bezier(.3,.7,.2,1); pointer-events: none; }

  @media (prefers-reduced-motion: reduce) { .tok { transition: none; } .dest.pulse, .dest-outer.pulse { animation: none; } }

  /* ---------------- HUD ---------------- */
  .hud { position: absolute; z-index: 5; }
  .panel {
    background: var(--hud);
    border: 1px solid var(--rule);
    border-radius: var(--r);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
  }
  .top { top: 10px; left: 10px; right: 10px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; transition: transform .3s ease; }
  /* 携帯：画面上部のUIをプルタブで隠せる */
  .pulltab { display: none; }
  @media (max-width: 760px) {
    .pulltab { display: flex; align-items: center; gap: 6px; position: absolute; left: 50%; bottom: -30px; transform: translateX(-50%); pointer-events: auto;
      height: 26px; padding: 0 14px; border-radius: 0 0 12px 12px; border: 1px solid var(--rule); border-top: none; background: var(--hud-solid); color: #F4ECDC; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 14px rgba(0,0,0,.35); }
    .pt-arrow { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 7px solid currentColor; }
    .pt-t { display: none; max-width: 52vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    body.hud-hidden .top { transform: translateY(calc(-100% - 12px)); }
    body.hud-hidden .pt-arrow { border-bottom: none; border-top: 7px solid currentColor; }
    body.hud-hidden .pt-t { display: inline; }
    body.hud-hidden .pulltab { bottom: -34px; height: 30px; }
  }
  @media (prefers-reduced-motion: reduce) { .top { transition: none; } }
  .toprow { display: flex; gap: 8px; align-items: stretch; }
  .toprow > * { pointer-events: auto; }
  .toprow.second .xlog { flex: 1; min-width: 0; }
  .iconbtn {
    width: 46px; min-height: 46px; display: grid; place-items: center; border-radius: 12px;
  }
  .iconbtn svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .xcard { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; min-width: 0; }
  .xcard .who { display: flex; flex-direction: column; min-width: 0; }
  .xcard b { font-size: 15px; line-height: 1.2; }
  .xcard small { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .expo { display: inline-flex; align-items: center; gap: 5px; margin-top: 3px; padding: 2px 8px 2px 6px; border-radius: 999px; font-size: 11px; font-weight: 900; white-space: nowrap; }
  .expo i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .expo.found { background: rgba(229, 72, 77, 0.2); color: #FF6B6B; animation: blink 1s ease-in-out infinite; }
  .expo.near { background: rgba(242, 153, 58, 0.2); color: #F5A524; }
  .expo.lost { background: rgba(95, 191, 122, 0.18); color: #6FD08C; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .bubble { pointer-events: none; transform-box: fill-box; transform-origin: 50% 100%; }
  .bubble.pop { animation: pop 0.35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .bubble .bb { stroke: #3B2C1E; stroke-width: 2.5; }
  .bubble.q .bb { fill: #FBF5E4; }
  .bubble.ex .bb { fill: #E5484D; }
  .bubble text { font-family: Georgia, serif; font-weight: 900; font-size: 30px; text-anchor: middle; }
  .bubble.q text { fill: #3B2C1E; }
  .bubble.ex text { fill: #fff; }
  @media (prefers-reduced-motion: reduce) { .bubble.pop, .expo.found { animation: none; } }
  .xcard .chipsx { display: flex; gap: 4px; margin-top: 2px; }
  .portrait { width: 46px; height: 46px; border-radius: 50%; flex: none; display: block; overflow: visible; }
  .portrait.sm { width: 36px; height: 36px; }
  .portrait.lg { width: 84px; height: 84px; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; background: rgba(192,39,31,0.28); }
  .portrait.p-d img { background: rgba(255,255,255,0.12); }
  .thief-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .thief-pick button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: inherit; font: inherit; cursor: pointer; }
  .thief-pick button[aria-pressed="true"] { border-color: #E3B341; background: rgba(227,179,65,0.16); }
  .thief-pick img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: rgba(192,39,31,0.28); }
  .thief-pick b { font-size: 14px; }
  .thief-pick.det-pick { grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .det-pick img { width: 52px; height: 52px; background: rgba(255,255,255,0.12); }
  .det-pick b { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .thief-pick button { min-width: 0; }
  @media (max-width: 520px) { .det-pick b { font-size: 10px; letter-spacing: -.02em; } .det-pick img { width: 44px; height: 44px; } }
  .det-pick span { font-size: 9.5px; }
  .fl-sub { display: block; font-size: 10px; opacity: .7; font-weight: 400; }
  .thief-pick span { font-size: 10.5px; opacity: .75; line-height: 1.3; text-align: center; }
  .dets { display: flex; gap: 6px; padding: 6px; overflow-x: auto; scrollbar-width: none; margin-left: auto; }
  .dets::-webkit-scrollbar { display: none; }
  .det {
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 4px 3px; border-radius: 10px;
    border: 2px solid transparent; min-width: 58px;
  }
  .det.active { border-color: var(--gold); background: rgba(227,179,65,0.12); }
  .det .tks { display: flex; gap: 2px; }
  .det { position: relative; }
  .me-tag { position: absolute; top: -2px; right: -2px; font-size: 9px; font-weight: 900; padding: 1px 5px; border-radius: 999px; background: var(--gold); color: #1A140C; }
  .tk { font-size: 10px; font-weight: 900; min-width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; padding: 0 3px; color: #1A140C; font-variant-numeric: tabular-nums; }
  .tk.taxi { background: var(--taxi); }
  .tk.bus { background: var(--bus); color: #fff; }
  .tk.tube { background: var(--tube); color: #fff; }
  .tk.boat { background: var(--ferry); color: #fff; }
  .tk.heli { background: var(--heli); color: #fff; }
  .tk.inf { background: #E8E0CC; color: #1A140C; padding: 0 5px; }
  .tk.black { background: var(--black); color: #fff; border: 1px solid #8A7A60; }
  .tk.double { background: var(--paper); color: #1A140C; }
  .tk.zero { opacity: 0.3; }

  .side { right: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; padding: 6px; }
  .side .iconbtn:active, .top .iconbtn:active { background: rgba(255,255,255,0.08); }
  .side .iconbtn[aria-pressed="true"] { background: var(--gold); }
  .side .iconbtn[aria-pressed="true"] svg { stroke: #1A140C; }

  .bottom { left: 10px; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .bottom > * { pointer-events: auto; }
  .prompt { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; flex: none; max-width: 46%; }
  .prompt .txt { flex: 1; min-width: 0; }
  .prompt .t1 { font-weight: 900; font-size: 15px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prompt .t2 { color: var(--muted); font-size: 12px; line-height: 1.4; }
  .pill { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--hud-2); color: var(--muted); white-space: nowrap; }
  .pill.gold { background: var(--gold); color: #1A140C; }
  .btn.heli-btn { background: var(--heli); color: #fff; }
  .btn {
    min-height: 44px; padding: 0 16px; border-radius: 12px; font-weight: 900; font-size: 15px;
    background: var(--gold); color: #1A140C; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn.ghost { background: var(--hud-2); color: var(--ink); border: 1px solid var(--rule); }
  .btn.wide { width: 100%; }

  .xlog { display: flex; gap: 4px; padding: 6px; overflow-x: auto; scroll-behavior: smooth; scrollbar-width: none; }
  .xlog::-webkit-scrollbar { display: none; }
  .slot {
    position: relative; flex: none; width: 44px; height: 50px; border-radius: 8px;
    background: var(--hud-2); border: 1px solid rgba(255,255,255,0.06);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 900; font-size: 13px;
  }
  .slot .n { position: absolute; top: 2px; left: 5px; font-size: 9px; color: var(--muted); font-weight: 700; }
  .slot.reveal { border: 2px solid var(--xrim); }
  .slot.reveal::after { content: ""; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--xrim); }
  .slot.now { box-shadow: 0 0 0 2px var(--gold); }
  .slot.taxi { background: var(--taxi); color: #1A140C; }
  .slot.bus { background: var(--bus); }
  .slot.tube { background: var(--tube); }
  .slot.black { background: var(--black); }
  .slot.boat { background: var(--ferry); }
  .slot.heli { background: var(--heli); }
  .slot.taxi .n { color: rgba(0,0,0,0.55); }
  .slot.bus .n, .slot.tube .n, .slot.black .n, .slot.boat .n, .slot.heli .n { color: rgba(255,255,255,0.7); }
  .slot .st { font-size: 10px; line-height: 1; margin-top: 2px; }
  .slot .dbl { position: absolute; bottom: 2px; right: 3px; font-size: 8px; }

  /* 切符を選ぶシート */
  .sheet-wrap { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,0.35); }
  .sheet {
    width: min(560px, calc(100% - 20px)); margin-bottom: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
    background: var(--hud-solid); border: 1px solid var(--rule); border-radius: 20px; box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
    animation: up 0.2s ease-out;
  }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet h3 { margin: 0; font-size: 18px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
  .sheet h3 .no { background: var(--paper); color: var(--map-ink); border-radius: 999px; padding: 1px 10px; font-size: 14px; }
  .tickets { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .ticket {
    position: relative; min-height: 92px; border-radius: 12px; padding: 10px 12px; text-align: left;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25), 0 4px 0 rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .ticket::before { content: ""; position: absolute; left: -8px; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: var(--hud-solid); transform: translateY(-50%); }
  .ticket::after { content: ""; position: absolute; right: -8px; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: var(--hud-solid); transform: translateY(-50%); }
  .ticket .en { font-family: "IM Fell English SC", Georgia, serif; font-size: 20px; letter-spacing: 0.06em; line-height: 1; }
  .ticket .ja { font-size: 12px; font-weight: 700; opacity: 0.85; }
  .ticket .cnt { position: absolute; right: 12px; bottom: 8px; font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .ticket.taxi { background: var(--taxi); color: #1A140C; }
  .ticket.bus { background: var(--bus); color: #fff; }
  .ticket.tube { background: var(--tube); color: #fff; }
  .ticket.boat { background: var(--ferry); color: #fff; }
  .ticket.heli { background: var(--heli); color: #fff; }
  .ticket.black { background: var(--black); color: #fff; box-shadow: inset 0 0 0 2px #8A7A60, 0 4px 0 rgba(0,0,0,0.35); }
  .ticket:active:not(:disabled) { transform: translateY(2px); }
  .opt-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--hud-2); border-radius: 12px; padding: 8px 12px; }
  .switch { width: 52px; height: 32px; border-radius: 999px; background: #4A3D2E; position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: left 0.15s; }
  .switch[aria-checked="true"] { background: var(--gold); }
  .switch[aria-checked="true"]::after { left: 23px; }

  /* 全面スクリーン（タイトル・受け渡し・結果） */
  .screen { position: absolute; inset: 0; z-index: 30; overflow-y: auto; display: flex; align-items: center; justify-content: center; padding: 20px 16px; }
  .screen.title { background: linear-gradient(rgba(10,13,20,.35), rgba(10,13,20,.55)), url("art/title/title-bg.webp") center / cover no-repeat, #141B29; }
  .logo .logo-img { width: min(360px, 82%); height: auto; filter: drop-shadow(0 4px 10px rgba(0,0,0,.6)); margin: 2px 0 -2px; }
  .logo h1.sub { font-size: clamp(18px, 5vw, 24px); letter-spacing: .2em; }
  .screen.cover { background: rgba(10, 8, 6, 0.96); }
  .screen.dim { background: rgba(10, 8, 6, 0.72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .skyline { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 42%; pointer-events: none; }
  .fog { position: absolute; inset: 0; background: radial-gradient(60% 30% at 30% 80%, rgba(200,210,230,0.12), transparent), radial-gradient(50% 25% at 75% 70%, rgba(200,210,230,0.1), transparent); pointer-events: none; }
  .card {
    position: relative; width: min(520px, 100%); padding: 22px 20px; display: flex; flex-direction: column; gap: 14px;
    background: rgba(20, 16, 12, 0.88); border: 1px solid var(--rule); border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .logo { text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .logo .en { font-family: "IM Fell English SC", Georgia, serif; letter-spacing: 0.35em; color: var(--gold); font-size: 13px; }
  .logo h1 { margin: 0; font-family: "Zen Old Mincho", serif; font-weight: 900; font-size: clamp(30px, 8vw, 44px); letter-spacing: 0.06em; line-height: 1.15; }
  .logo p { margin: 0; color: var(--muted); font-size: 13px; }
  .faces { display: flex; justify-content: center; }
  .faces .portrait { width: 56px; height: 56px; border: 3px solid var(--hud-solid); }
  .faces .portrait + .portrait { margin-left: -12px; }
  .menu { display: flex; flex-direction: column; gap: 10px; }
  .menu .btn { min-height: 54px; font-size: 16px; justify-content: flex-start; padding: 0 14px; }
  .menu .btn .portrait { width: 36px; height: 36px; }
  .menu .btn span.s { font-weight: 400; font-size: 12px; opacity: 0.8; margin-left: auto; }
  .seg { display: flex; background: var(--hud-2); border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; min-height: 38px; border-radius: 9px; font-weight: 700; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--gold); color: #1A140C; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    padding: 8px 14px; border-radius: 999px; background: var(--hud-solid); border: 1px solid var(--rule);
    font-weight: 700; font-size: 13px; white-space: nowrap; pointer-events: none; animation: fade 2.4s forwards;
  }
  @keyframes fade { 0% { opacity: 0; transform: translate(-50%, -6px); } 10%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
  .drawer { position: absolute; z-index: 22; left: 10px; bottom: 10px; width: min(380px, calc(100% - 20px)); max-height: 60%; display: flex; flex-direction: column; padding: 12px; gap: 8px; }
  .drawer ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 13px; user-select: text; -webkit-user-select: text; }
  .drawer li { display: flex; gap: 8px; }
  .drawer li .r { color: var(--muted); min-width: 34px; font-variant-numeric: tabular-nums; }
  .drawer li.hot { color: var(--gold); font-weight: 700; }

  @media (max-width: 640px) {
    .toprow.first { flex-wrap: wrap; }
    .toprow.first .xcard { flex: 1; }
    .dets { order: 3; width: 100%; margin-left: 0; justify-content: space-between; padding: 4px; }
    .det { min-width: 0; flex: 1; padding: 3px 2px; }
    .tk { min-width: 14px; font-size: 9px; padding: 0 2px; }
    .side { top: auto; bottom: 16px; transform: none; padding: 4px; gap: 2px; }
    .side .iconbtn { width: 40px; min-height: 40px; }
    .menu .btn span.s { display: none; }
    .portrait { width: 40px; height: 40px; }
    .portrait.sm { width: 30px; height: 30px; }
    .prompt { max-width: 44%; padding: 4px 8px 4px 4px; }
    .prompt .t1 { font-size: 13px; }
    .prompt .btn { min-height: 34px; padding: 0 10px; font-size: 13px; }
    .slot { width: 32px; height: 40px; font-size: 12px; }
    .xlog { padding: 4px; }
  }

  // ---------------- カード（5・10・17手目に両陣営が1枚引く。ハズレなし） ----------------
  const CARD_TURNS = [5, 10, 17];
  const CARD_LAST = 20;   // 手札のカードは20手目まで好きな時に使える
  const CARD = {
    bridge:    { side: "d", name: "橋封鎖", desc: "橋を1つ選んで封鎖する。4手のあいだ怪盗Xは通れない。" },
    rcheck:    { side: "d", name: "ランダム検問", desc: "引いたその場で発動。ヘリポート以外のどこかの駅に検問所が敷かれ、6手のあいだ怪盗Xはその駅を通れない。" },

    dash:      { side: "d", name: "ダッシュ", desc: "使った刑事は、この番に2回続けて動ける（1駅進んだあと、もう1駅）。" },
    heliban:   { side: "d", name: "ヘリ封鎖", desc: "引いたその場で発動。すべてのヘリポートを5手のあいだ閉鎖し、誰もヘリで飛べない。" },
    reinforce: { side: "d", name: "応援要請", desc: "刑事全員にヘリの切符が1枚ずつ追加される。" },
    trap:      { side: "x", name: "罠", desc: "いまいる駅に罠を仕掛ける。踏んだ刑事は1回休み。刑事には見えない。" },
    vanish:    { side: "x", name: "雲隠れ", desc: "次の目撃情報を1回だけ無効にする。" },
    destroy:   { side: "x", name: "駅破壊", desc: "2手以内の駅を1つ壊す。壊れた駅は最後まで誰も通れない（怪盗Xも）。" },

  const DECK = {
    d: [["bridge", 22], ["checkpoint", 33], ["dash", 10], ["heliban", 18], ["rcheck", 17]],

  // ヘリ封鎖は1ゲームに1回だけ（一度引いたら山札から外す）
  function drawCard(side, G = null) {
    const deck = DECK[side].filter(([c]) => !(c === "heliban" && G && G.helibanDrawn));
    let r = Math.random() * deck.reduce((s, c) => s + c[1], 0);
    for (const [c, w] of deck) if ((r -= w) < 0) return c;

  function cardTargets(G, sec, card) {
    if (card === "bridge") return BRIDGE_ST.filter(b => !isClosed(G.closedX, b, G));

    const dmin = Math.min(...G.det.map(d => D[sec.pos][d.pos]));

          const here = G.turn === "x" ? -1 : G.det[G.turn].pos;

          // 自分の駅が怪盗Xの逃げ道（候補の隣）になっていれば置く

  // 罠：踏んだ刑事は1回休み

  // ---------------- CPU ----------------

  function xSafety(G, to) {

    const wantBlack = G.black > 0 && !REVEAL.includes(n) && (

  // 最後の目撃から記録された切符をたどり、候補駅の確からしさを求める

  const AI_BIAS = 1.2, AI_PROB = 30, AI_SPREAD = 1.2, AI_LOOK = 20;
  function candWeights(G) {

    const color = kind === "x" ? "#2A2530" : DCOL[k];
    const bg = kind === "x" ? "rgba(192,39,31,0.28)" : "rgba(255,255,255,0.08)";
    return `<svg class="portrait ${cls}" viewBox="-30 -114 60 60" aria-hidden="true"><defs><clipPath id="pc-${kind}${k}${cls}"><circle cx="0" cy="-84" r="29"></circle></clipPath></defs><circle cx="0" cy="-84" r="29" fill="${bg}"></circle><g clip-path="url(#pc-${kind}${k}${cls})"><use href="${kind === "x" ? "#fig-x" : "#fig-d"}" x="-36" y="-112" width="72" height="120" style="color:${color}"></use></g>${kind === "d" ? `<text x="17" y="-61" class="pawn-num" style="font-size:13px">${k + 1}</text>` : ""}</svg>`;
  }

  // ======================================================================
  // 状態
  // ======================================================================
  const A = {
    role: null,        // "x" | "d" | "pass"
    detCount: DEFAULT_DETS,
    detPick: (() => { try { return Math.min(4, Math.max(0, Number(localStorage.getItem(DET_KEY)) || 0)); } catch (e) { return 0; } })(),
    thief: (() => { try { return Math.min(2, Math.max(0, Number(localStorage.getItem(THIEF_KEY)) || 0)); } catch (e) { return 0; } })(),
    G: null,
    sec: null,
    feed: [],
    sel: null,         // 選択中の移動先
    useDouble: false,
    hints: true,
    cover: null,       // パス&プレイの目隠し："x"（Xへ渡す）| "x-open" | "d"（刑事へ渡す）
    screen: "title",   // title | rules | game | result
    busy: false,
  };
  let timer = null;

  const humanTurn = () => {
    const G = A.G;
    if (!G || G.over || A.pendingCard) return false;
    if (A.role === "pass") return G.turn === "x" ? A.cover === "x-open" : A.cover === null;
    return A.role === "x" ? G.turn === "x" : G.turn === ME_DET;
  };
  // 刑事モードで自分が動かす刑事（ほかの刑事はCPU）
  const ME_DET = 0;
  const xVisible = () => {
    const G = A.G;
    if (!G) return false;
    if (G.over || A.role === "x") return true;
    return A.role === "pass" && A.cover === "x-open";
  };
  const sideName = () => A.role === "x" ? "x" : A.role === "d" ? "d" : null;

  function pushFeed(n, text, hot = false) {
    A.feed.unshift({ n, text, hot });
    if (A.feed.length > 200) A.feed.length = 200;
  }
  function describe(prev, G) {
    for (let i = prev.xLog.length; i < G.xLog.length; i++) {
      const e = G.xLog[i];
      let s = e.t === "pass" ? "怪盗Xはパス（その場にとどまった）" : `怪盗Xが ${TYPE[e.t].name} で移動`;
      if (e.d === 1) s = "怪盗Xが2倍移動！ " + s;
      if (xVisible()) s += `（→ ${NO(A.sec.path[i + 1])} ${NAME(A.sec.path[i + 1])}）`;
      pushFeed(i + 1, s);
      if (e.t === "heli" && A.sec.path[i + 1] === A.sec.path[i] && xVisible()) {
        dudAction(A.sec.path[i], "怪盗Xのヘリが飛べない…（刑事にはバレていない）");
      }
      if (e.v) {
        pushFeed(i + 1, "雲隠れ！ 目撃情報が消えた", true); toast("雲隠れ！ 目撃情報が消えた");
        say(Math.floor(Math.random() * G.det.length), "消えた！？", "sad");
        banner("雲隠れ！", "出現するはずの怪盗Xが姿を見せない", "gray", 1);
      }
      if (e.p !== null) {
        pushFeed(i + 1, `目撃情報！ 怪盗Xは ${NO(e.p)} ${NAME(e.p)} にいる`, true); toast(`目撃情報！ 怪盗Xは ${NAME(e.p)} に`);
        say(nearestDet([e.p]), pick(FOUND_LINES), "hot");
        banner("目撃！", `怪盗Xは ${NO(e.p)} ${NAME(e.p)} に現れた`, "", 2);
      }
    }
    G.det.forEach((d, k) => {
      const p = prev.det[k];
      if (p && p.pos === d.pos && p.t.heli !== d.t.heli) {
        say(k, "ガス欠だと！？", "sad", 3000);
        dudAction(d.pos, `${NAME(d.pos)} のヘリは使えない`);
      }
      if (p && p.pos !== d.pos) {
        const used = d.last;
        pushFeed(G.xLog.length, `${dName(k)} → ${NO(d.pos)} ${NAME(d.pos)}（${used ? TYPE[used].name : ""}）`);
      }
    });
    if (G.mate && prev.mate) {
      if (!prev.mate.out && G.mate.out) {
        const k = G.mate.by ?? 0;
        pushFeed(G.xLog.length, `${dName(k)} が ${NAME(G.mate.pos)} で相棒を確保！ もう合流はできない`, true);
        say(k, "相棒を捕まえた！", "hot", 3000);
        banner("相棒確保！", "怪盗Xはもう相棒と合流できない", "blue", 2);
      } else if (!G.mate.out && prev.mate.pos !== G.mate.pos && !G.over) {
        pushFeed(G.xLog.length, `相棒 → ${NO(G.mate.pos)} ${NAME(G.mate.pos)}`);
      }
    }
    if (!prev.over && G.over && G.reason === "meet") {
      pushFeed(G.xLog.length, `${NAME(G.mate.pos)} で怪盗Xが相棒と合流！ 逃走成功`, true);
      G.det.forEach((_, k) => say(k, pick(["しまった、仲間がいたか！", "逃げられた…", "くそっ…"]), "sad", 4000));
      banner("合流成功！", `怪盗Xは ${NAME(G.mate.pos)} で相棒と落ち合った`, "", 3);
    } else if (!prev.over && G.over) {
      pushFeed(G.xLog.length, G.winner === "x" ? "怪盗Xの勝ち！" : "怪盗Xを逮捕！ 刑事の勝ち！", true);
      if (G.winner === "d") {
        const kc = G.det.findIndex(d => d.pos === A.sec.pos);
        G.det.forEach((_, k) => say(k, k === kc ? "確保ーっ！" : pick(["やったな！", "お手柄だ！", "観念しろ！"]), k === kc ? "hot" : "", 4000));
        banner("逮捕！", G.reason === "trapped" ? "怪盗Xは追い詰められて動けない" : `${dName(Math.max(0, kc))}が怪盗Xを確保した`, "blue", 3);
      } else {
        G.det.forEach((_, k) => say(k, pick(["くそっ…", "逃げられた…", "無念…"]), "sad", 4000));
        banner("逃げ切り！", "怪盗Xは霧のロンドンへ消えた", "", 3);
      }
    }
  }

  // 刑事側から見た怪盗Xの見つかり具合（公開情報だけで決まる）
  function exposure(G) {
    const n = G.possible.length;
    if (n <= 1) return { level: "found", n, label: "発見されている", help: "刑事に居場所がばれています" };
    if (n <= 4) return { level: "near", n, label: `追われている・候補${n}駅`, help: "刑事は候補をかなり絞り込んでいます" };
    return { level: "lost", n, label: `見失われている・候補${n}駅`, help: "刑事はまだ居場所をつかめていません" };
  }
  // 刑事ごとの吹き出し："!" は怪盗Xを捕捉している、"?" は見失っている
  function detBubble(G, k) {
    const e = exposure(G);
    if (e.level === "found") return "!";
    const near = Math.min(...G.possible.map(p => D[G.det[k].pos][p]));
    return e.level === "near" && near <= 2 ? "!" : "?";
  }
  // ---------------- 刑事のリアクション（セリフの吹き出しと中央の見出し） ----------------
  const SPEECH = new Map();   // 刑事番号 -> { text, kind, until }
  function say(k, text, kind = "", ms = 2400) {
    if (k < 0 || !A.G || !A.G.det[k]) return;
    SPEECH.set(k, { text, kind, until: Date.now() + ms });
    updateTalk();
    setTimeout(updateTalk, ms + 40);
  }
  function nearestDet(targets) {
    const G = A.G;
    let best = 0, bd = Infinity;
    G.det.forEach((d, k) => { const x = Math.min(...targets.map(p => D[d.pos][p])); if (x < bd) { bd = x; best = k; } });
    return best;
  }
  function updateTalk() {
    if (!A.G) return;
    A.G.det.forEach((_, k) => {
      const t = $("tokD" + k);
      if (!t) return;
      const s = SPEECH.get(k), on = s && s.until > Date.now();
      const tp = $("talkD" + k), tk = tp.querySelector(".talk"), b = t.querySelector(".bubble");
      tp.style.transform = t.style.transform;
      if (!on) { tk.style.display = "none"; tk.dataset.text = ""; if (b) b.style.visibility = ""; return; }
      if (b) b.style.visibility = "hidden";
      if (tk.dataset.text !== s.text) {
        tk.dataset.text = s.text;
        const w = s.text.length * 26 + 30;
        tk.querySelector(".tb").setAttribute("d", `M${-w / 2},-54 h${w} a10,10 0 0 1 10,10 v30 a10,10 0 0 1 -10,10 h${-w / 2 + 14} l-14,14 l-4,-14 h${-w / 2 + 4} a10,10 0 0 1 -10,-10 v-30 a10,10 0 0 1 10,-10 Z`);
        tk.querySelector("text").textContent = s.text;
        tk.setAttribute("class", "talk pop " + s.kind);
      }
      tk.style.display = "";
    });
  }
  // ヘリのガス欠：ふわっと浮いて、プスンと落ちる
  function dudAction(pos, sub) {
    toast("ガス欠！ ヘリが飛べない");
    banner("ガス欠！", sub, "gray", 2);
    const [x, y] = P(pos);
    const host = el("g", { transform: `translate(${x + 78} ${y - 14})` }, $("gTalk"));
    const heli = el("g", { class: "dud-heli" }, host);
    el("path", { d: "M-26,-6 q0,-20 24,-20 h8 q20,0 20,18 q0,12 -18,12 h-18 q-16,0 -16,-10 Z", class: "dh-body" }, heli);
    el("path", { d: "M26,-10 L58,-16 L60,-4 L26,-2 Z", class: "dh-body" }, heli);
    el("path", { d: "M-10,-6 h12 v-12 h-4 q-8,0 -8,8 Z", class: "dh-glass" }, heli);
    el("path", { d: "M-20,8 v6 M18,8 v6 M-28,14 h56", class: "dh-skid" }, heli);
    el("path", { d: "M0,-26 v-8 M-44,-34 h88", class: "dh-rotor" }, heli);
    for (let i = 0; i < 3; i++) el("circle", { cx: 40 + i * 12, cy: -18 - i * 6, r: 10 + i * 4, class: "dh-smoke s" + i }, host);
    const t = el("text", { x: 0, y: -60, class: "dh-text" }, host);
    t.textContent = "プスン…";
    setTimeout(() => host.remove(), 2800);
  }
  let bannerPri = 0, bannerUntil = 0;
  function banner(title, sub = "", color = "", pri = 1) {
    if (Date.now() < bannerUntil && pri < bannerPri) return;
    bannerPri = pri; bannerUntil = Date.now() + 1900;
    const d = document.createElement("div");
    d.className = "bn " + color;
    d.innerHTML = `<b></b><small></small>`;
    d.querySelector("b").textContent = title;
    d.querySelector("small").textContent = sub;
    $("banner").replaceChildren(d);
    setTimeout(() => { if (d.parentNode) d.remove(); }, 1950);
  }
  const FOUND_LINES = ["見つけた！", "いたぞ！", "そこか！", "逃がさん！"];
  const LOST_LINES = ["見失った…", "どこへ消えた…", "くそっ、撒かれた", "手がかりが…"];
  const NEAR_LINES = ["近いぞ…", "この辺りだ", "匂うな…"];

  let lastExpo = null;
  function noteExposure() {
    const G = A.G;
    if (!G || G.over) { lastExpo = null; return; }
    const lv = exposure(G).level;
    if (lv === "found") {
      G.seen = G.seen || [];
      const last = G.seen[G.seen.length - 1], pos = G.possible[0], n = G.xLog.length;
      if (!last || last.pos !== pos) G.seen.push({ n, pos });
    }
    if (lastExpo && lv !== lastExpo) {
      if (lv === "found") {
        toast("刑事が怪盗Xを発見！");
        say(nearestDet(G.possible), pick(FOUND_LINES), "hot");
        banner("発見！", `刑事が怪盗Xの居場所をつかんだ（${NAME(G.possible[0])}）`, "", 1);
      } else if (lv === "lost") {
        toast("刑事は怪盗Xを見失った");
        say(Math.floor(Math.random() * G.det.length), pick(LOST_LINES), "sad");
        banner("見失った…", `候補は${G.possible.length}駅に広がった`, "gray", 0);
      } else if (lastExpo === "lost") {
        toast("刑事が怪盗Xに迫っている");
        say(nearestDet(G.possible), pick(NEAR_LINES));
      }
    }
    lastExpo = lv;
  }

  function save() {
    try {
      if (!A.G || A.G.over) localStorage.removeItem(SAVE_KEY);
      else localStorage.setItem(SAVE_KEY, JSON.stringify({ role: A.role, detCount: A.detCount, thief: A.thief, detPick: A.detPick, G: A.G, sec: A.sec, feed: A.feed.slice(0, 60), cover: A.cover === "x-open" ? "x" : A.cover }));
    } catch (e) {}
  }
  function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { return null; } }

  // ======================================================================
  // 進行
  // ======================================================================
  function startGame(role) {
    clearTimeout(timer);
    lastSight = null;
    SPEECH.clear();
    const { G, sec } = newGame(A.detCount);
    Object.assign(A, { role, G, sec, feed: [], sel: null, useDouble: false, screen: "game", busy: false });
    A.cover = role === "pass" ? "x" : null;
    pushFeed(0, role === "x" ? `あなたは怪盗X。${MAX_MOVES}手逃げ切るか、相棒と合流すれば勝ち！` : role === "d" ? `あなたは刑事1。ほかの刑事${A.detCount - 1}人はCPUの仲間です。怪盗Xを逮捕せよ！` : "パス&プレイ。怪盗X役の人から始めます。", true);
    buildTokens();
    fitView(false);
    step();
    if (role !== "pass") setTimeout(() => focusTurn(), 50);
  }

  function resume(s) {
    clearTimeout(timer);
    SPEECH.clear();
    lastSight = null;
    Object.assign(A, { role: s.role, detCount: s.detCount, thief: s.thief || 0, detPick: s.detPick || 0, G: s.G, sec: s.sec, feed: s.feed || [], sel: null, useDouble: false, screen: "game", busy: false, cover: s.cover || null });
    buildTokens();
    fitView(false);
    step();
  }

  function apply(fn) {
    const prev = clone(A.G);
    fn();
    if (!A.G.over && A.G.det.some(d => d.pos === A.sec.pos)) finish(A.G, "d", "caught");
    describe(prev, A.G);
    const tk = A.G.over ? -1 : checkTrap(A.G, A.sec);
    if (tk >= 0) { say(tk, "しまった！罠だ！", "hot"); toast(`${dName(tk)} が罠にかかった！ 1回休み`); pushFeed(A.G.xLog.length, `${dName(tk)} が ${NAME(A.G.det[tk].pos)} で怪盗Xの罠にかかった（1回休み）`, true); }
  }

  function step() {
    clearTimeout(timer);
    const G = A.G;
    while (!G.over) {
      if (G.turn === "x") {
        if (!xMoves(G, A.sec).length) { apply(() => finish(G, "d", "trapped")); continue; }
        if (A.role === "pass" && A.cover === null) A.cover = "x";
        if (A.role === "pass" && A.cover !== "x-open") { save(); render(); return; }
        if (!G.doubling) {
          const n = G.xLog.length + 1;
          G.drawn = G.drawn || { x: [], d: [] };
          if (CARD_TURNS.includes(n) && !G.drawn.x.includes(n)) {
            G.drawn.x.push(n);
            const card = drawCard("x");
            gainCard("x", card);
            if (A.role === "x" || A.role === "pass") { A.pendingCard = { side: "x", card, stage: "reveal" }; save(); render(); return; }
          }
          expireHand("x");
        }
        if (A.role === "x" || A.role === "pass") { save(); render(); return; }
        for (const [c, t] of aiUseCards(G, A.sec, "x")) useCardNow("x", c, t);
        render();
        timer = setTimeout(() => {
          const m = aiX(G, A.sec);
          apply(() => applyX(G, A.sec, m.to, m.type, m.useDouble));
          step();
        }, AI_DELAY);
        return;
      }
      const k = G.turn;
      if (k === 0) {
        const n = G.xLog.length;
        G.drawn = G.drawn || { x: [], d: [] };
        if (CARD_TURNS.includes(n) && !G.drawn.d.includes(n)) {
          if (A.role === "pass" && A.cover !== null) { save(); render(); return; }
          G.drawn.d.push(n);
          const card = drawCard("d", G);
          gainCard("d", card);
          if (A.role === "d" || A.role === "pass") { A.pendingCard = { side: "d", card, stage: "reveal" }; save(); render(); return; }
        }
        expireHand("d");
      }
      if (G.stun && G.stun[k] > 0) {
        G.stun[k]--;
        pushFeed(G.xLog.length, `${dName(k)} は罠で足止め（1回休み）`, true);
        apply(() => skipD(G, k));
        continue;
      }
      if (allStuck(G)) { apply(() => finish(G, "x", "stuck")); continue; }
      if (!detMoves(G, k).length) {
        pushFeed(G.xLog.length, `${dName(k)} は使える切符がないので待機`);
        apply(() => skipD(G, k));
        continue;
      }
      if (A.role === "pass" || (A.role === "d" && k === ME_DET)) { save(); render(); ensureVisible(G.det[k].pos); return; }
      // CPUの刑事は自分の番ならいつでもチームのカードを使う
      for (const [c, t] of aiUseCards(G, A.sec, "d")) {
        say(k, `「${CARD[c].name}」だ！`, "", 2200);
        pushFeed(G.xLog.length, `${dName(k)} がカードを使った`);
        useCardNow("d", c, t);
      }
      render();
      timer = setTimeout(() => {
        const m = aiD(G, k, A.role === "d");
        const from = G.det[k].pos;
        let landed = m.to;
        apply(() => { landed = applyD(G, k, m.to, m.type, A.sec); });
        if (m.type === "heli") heliNote(k, from, landed);
        step();
      }, AI_DELAY);
      return;
    }
    save();
    A.cover = null;
    render();
    setTimeout(() => { A.screen = "result"; renderScreen(); }, 900);
  }

  // ---------------- カードの処理 ----------------
  const needsTarget = card => card === "bridge" || card === "destroy";
  function announceCard(side, card, target) {
    const G = A.G, c = CARD[card];
    if (side === "d") {
      let detail = "";
      if (card === "bridge") detail = `${NO(target)} ${NAME(target)} を封鎖（4手）`;
      else if (card === "dash") { detail = `${dName(target)} がダッシュ！ この番は2回続けて動ける`; say(target, "走るぞ！", "hot", 2200); }
      else if (card === "rcheck") detail = `${NO(target)} ${NAME(target)} に検問所が敷かれた（6手のあいだ怪盗Xは通れない）`;
      else if (card === "checkpoint") detail = `${NO(target)} ${NAME(target)} に検問所を設置（6手のあいだ怪盗Xは通れない）`;
      else if (card === "reinforce") detail = "刑事全員にヘリの切符を1枚追加";
      else if (card === "heliban") detail = `すべてのヘリポートを閉鎖（${G.heliBan - G.xLog.length}手）`;
      else detail = "何も起こらなかった";
      toast(`刑事チームのカード「${c.name}」`);
      pushFeed(G.xLog.length, `刑事チームのカード「${c.name}」：${detail}`, card !== "miss");
      return;
    }
    const mine = A.role === "x" || (A.role === "pass" && A.cover === "x-open");
    if (card === "destroy") {
      toast(`怪盗Xが ${NAME(target)} を破壊！`);
      pushFeed(G.xLog.length, `怪盗Xのカード「駅破壊」：${NO(target)} ${NAME(target)} は壊れて最後まで誰も通れない`, true);
    } else if (mine) {
      toast(`カード「${c.name}」を使った`);
      pushFeed(G.xLog.length, `怪盗Xのカード「${c.name}」${card === "trap" ? `：${NAME(A.sec.pos)} に罠を仕掛けた` : card === "vanish" ? "：次の目撃情報を消す" : "：何も起こらなかった"}`, card !== "miss");
    } else {
      toast("怪盗Xがカードを使った…");
      pushFeed(G.xLog.length, "怪盗Xが何かのカードを使った（効果はわからない）", true);
    }
  }
  // 引いたカードを手札に加える（ハズレは捨てる）
  function gainCard(side, card) {
    const G = A.G;
    const mine = side === "x" ? (A.role === "x" || (A.role === "pass" && A.cover === "x-open")) : A.role !== "x";
    if (card === "heliban") {
      G.helibanDrawn = true;
      // ヘリ封鎖は引いたその場で自動発動
      applyCard(G, A.sec, card, null);
      announceCard(side, card, null);
      banner("ヘリ封鎖！", `すべてのヘリポートが${G.heliBan - G.xLog.length}手のあいだ閉鎖`, "blue", 2);
      return;
    }
    if (card === "rcheck") {
      // ランダム検問も引いたその場で自動発動
      const t = applyCard(G, A.sec, card, null);
      announceCard(side, card, t);
      banner("検問！", `${NAME(t)} に検問所が敷かれた`, "blue", 2);
      return;
    }
    if (card !== "miss") handOf(G, side).push(card);
    if (side === "d") {
      pushFeed(G.xLog.length, card === "miss" ? "刑事チームのカード：ハズレ" : `刑事チームがカード「${CARD[card].name}」を手に入れた`, card !== "miss");
    } else if (mine) {
      pushFeed(G.xLog.length, card === "miss" ? "怪盗Xのカード：ハズレ" : `カード「${CARD[card].name}」を手に入れた`, card !== "miss");
    } else {
      toast("怪盗Xがカードを引いた…");
      pushFeed(G.xLog.length, "怪盗Xがカードを引いた（中身はわからない）", true);

  // 足跡：経路に沿って左右交互に靴あとを並べる。新しいほど濃い
  function footPrint(parent, x, y, a, side, op, over) {
    const g = el("g", { transform: `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a.toFixed(1)}) translate(0 ${side * 7})`, opacity: op.toFixed(2) }, parent);
    el("ellipse", { cx: 3, cy: 0, rx: 8, ry: 4.6, class: "foot" + (over ? " x-over" : "") }, g);

  }
  function footPair(parent, x, y, a, op, over) {
    footPrint(parent, x - 8 * Math.cos(a * Math.PI / 180), y - 8 * Math.sin(a * Math.PI / 180), a, -1, op, over);
    footPrint(parent, x + 8 * Math.cos(a * Math.PI / 180), y + 8 * Math.sin(a * Math.PI / 180), a, 1, op, over);
  }
  function drawFootprints(parent, path, over) {
    const segs = path.length - 1;
    for (let i = 0; i < segs; i++) {
      if (path[i] === path[i + 1]) continue;
      const [x1, y1] = P(path[i]), [x2, y2] = P(path[i + 1]);
      const len = Math.hypot(x2 - x1, y2 - y1), a = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
      const op = 0.25 + 0.75 * (i + 1) / segs;
      const n = Math.max(1, Math.floor((len - 60) / 34));
      for (let j = 0; j < n; j++) {
        const t = (30 + (len - 60) * (j + 0.5) / n) / len;
        footPrint(parent, x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, a, j % 2 ? 1 : -1, op, over);
      }
    }
    if (over) path.forEach((p, i) => { if (i > 0) { const [x, y] = P(p); el("text", { x, y: y + 52, class: "foot-no" }, parent).textContent = i; } });
  }

    if (!G || A.screen !== "game") return [];
    const t = G.det.map((d, k) => ({ key: "d" + k, kind: "d", k, pos: d.pos }));

    else if (!G.over && exposure(G).level === "found") t.push({ key: "xf" + G.possible[0], kind: "x", k: 0, pos: G.possible[0], found: true });
    if (mateActive(G) && !G.over) t.push({ key: "m" + G.mate.pos, kind: "m", k: 0, pos: G.mate.pos });
    return t;

  function layoutEdge() {
    const host = $("edge");
    if (!host || !host.children.length) return;
    const r = mapEl.getBoundingClientRect();
    const topEl = document.querySelector(".hud.top"), botEl = document.querySelector(".hud.bottom"), sideEl = document.querySelector(".hud.side");
    const top = (topEl ? topEl.getBoundingClientRect().bottom - r.top : 100) + 36;
    const bottom = (botEl ? botEl.getBoundingClientRect().top - r.top : r.height) - 40;
    const sideR = sideEl ? sideEl.getBoundingClientRect() : null;
    const right = r.width - 36;
    const left = 40;
    const cx = (left + right) / 2, cy = (top + bottom) / 2;
    for (const b of host.children) {
      const pos = Number(b.dataset.pos);
      const [wx, wy] = P(pos);
      const sx = wx * V.s + V.tx, sy = (wy - 40) * V.s + V.ty;
      if (sx >= left - 20 && sx <= right + 20 && sy >= top - 30 && sy <= bottom + 30) { b.hidden = true; continue; }
      // 駒（と相棒の札）が画面の中に見えていれば矢印は出さない
      const key = b.dataset.key || "";
      const tokEl = key === "x" || key.startsWith("xf") ? $("tokX") : key.startsWith("m") ? $("tokM") : $("tokD" + key.slice(1));
      if (tokEl && tokEl.style.display !== "none") {
        const tr = tokEl.getBoundingClientRect();
        const tcx = tr.left + tr.width / 2 - r.left, tcy = tr.top + tr.height / 2 - r.top;
        if (tr.width > 0 && tcx >= 0 && tcx <= r.width && tcy >= top - 36 && tcy <= r.height) { b.hidden = true; continue; }
      }
      const dx = sx - cx, dy = sy - cy;
      const kx = dx ? Math.abs((dx > 0 ? right - cx : cx - left) / dx) : Infinity;
      const ky = dy ? Math.abs((dy > 0 ? bottom - cy : cy - top) / dy) : Infinity;
      const k = Math.min(kx, ky);
      let ax = cx + dx * k, ay = cy + dy * k;
      // 右側のボタン列に重なるときは、その左へずらす
      if (sideR) {
        const sl = sideR.left - r.left, st = sideR.top - r.top, sb = sideR.bottom - r.top;
        if (ax > sl - 30 && ay > st - 30 && ay < sb + 30) ax = sl - 34;
      }
      b.hidden = false;
      b.style.transform = `translate(${ax.toFixed(1)}px, ${ay.toFixed(1)}px)`;
      b.querySelector(".rot").setAttribute("transform", `rotate(${(Math.atan2(dy, dx) * 180 / Math.PI).toFixed(1)})`);
    }
  }

  // 目印は拡大率に関係なく、画面上でほぼ同じ大きさに見えるように描く（スマホは小さめ）
  const markScale = () => {
    const px = window.innerWidth < 600 ? 26 : 46;   // 照準の外側の輪の、画面上の半径
    return Math.min(2.4, Math.max(0.3, px / (60 * (V.s || 1))));

  function rescaleMarks() {
    const k = markScale().toFixed(3);
    document.querySelectorAll("#gMarks .scaled-mark").forEach(g => g.setAttribute("transform", `translate(${g.dataset.x} ${g.dataset.y}) scale(${k})`));
    // 相棒の札は縮小表示でも読めるように大きくする（拡大時はそのまま）
    const mb = Math.max(1, Math.min(6, (window.innerWidth < 600 ? 58 : 66) / (80 * (V.s || 1))));
    document.querySelectorAll(".mate-badge").forEach(g => g.setAttribute("transform", `translate(0 ${-130 - 8 * mb}) scale(${mb.toFixed(3)})`));
  }
  // 手札欄のヘリ：残り枚数と、いま飛べるかどうか
  function heliCard(G, side) {
    const left = side === "x" ? G.heli : (G.det[A.role === "d" ? ME_DET : (G.turn === "x" ? 0 : G.turn)] || {}).t?.heli ?? 0;
    const can = humanTurn() && (G.turn === "x" ? xMoves(G, A.sec) : detMoves(G, G.turn)).some(m => m.type === "heli");

  // 盤面の背景画像（路線・駅なし）を書き出す
  async function exportBackground(fmt) {
    const svg = backgroundSVG();
    let blob;
    try {
      if (fmt === "svg") blob = new Blob([svg], { type: "image/svg+xml" });
      else {
        toast("背景画像を書き出しています…");
        const im = new Image();
        im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
        await im.decode();
        const k = 1.5;
        const c = document.createElement("canvas");
        c.width = W * k; c.height = H * k;
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        blob = await new Promise(r => c.toBlob(r, "image/png"));
      }
    } catch (e) { toast("画像を作れませんでした"); return; }
    const filename = `london-chase-background.${fmt}`;
    let dl = null;
    try { dl = await window.claude?.use?.("downloads"); } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename, data: blob }); toast(`${filename} を保存しました`); }
      catch (e) { if (e?.code !== "declined") toast("保存できませんでした"); }
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }
  window.londonChaseBackgroundSVG = () => backgroundSVG();

  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    $("toastHost").replaceChildren(t);
    setTimeout(() => { if (t.parentNode) t.remove(); }, 2500);
  }

  // ======================================================================
  // イベント
  // ======================================================================
  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    const { w, h } = vpSize();
    switch (act) {
      case "start": return startGame(b.dataset.role);
      case "resume": { const s = loadSave(); if (s) resume(s); return; }
      case "again": return startGame(A.role);
      case "title": clearTimeout(timer); A.screen = "title"; A.sel = null; renderScreen(); renderSheet(); return;
      case "toggleHud": {
        const hidden = document.body.classList.toggle("hud-hidden");
        try { localStorage.setItem("london-chase-hud-hidden", hidden ? "1" : "0"); } catch (e) {}
        b.setAttribute("aria-expanded", String(!hidden));
        b.setAttribute("aria-label", hidden ? "上部の表示を出す" : "上部の表示を隠す");
        setTimeout(() => { clampView(); applyView(); layoutEdge(); }, 330);
        return;
      }
      case "menu": clearTimeout(timer); save(); A.screen = "title"; A.sel = null; renderScreen(); renderSheet(); return;
      case "rules": A.screen = "rules"; renderScreen(); return;
      case "exportBg": exportBackground(b.dataset.fmt); return;
      case "dets": A.detCount = Number(b.dataset.n); renderScreen(); return;
      case "detPick": A.detPick = Number(b.dataset.i); try { localStorage.setItem(DET_KEY, String(A.detPick)); } catch (e) {} renderScreen(); return;
      case "thief": A.thief = Number(b.dataset.i); try { localStorage.setItem(THIEF_KEY, String(A.thief)); } catch (e) {} renderScreen(); return;
      case "result": A.screen = "result"; renderScreen(); return;
      case "closeResult": A.screen = "game"; renderScreen(); fitView(); return;
      case "openX": A.cover = "x-open"; step(); focusTurn(); return;
      case "openD": A.cover = null; render(); step(); return;
      case "zoomIn": return zoomAt(1.5, w / 2, h / 2);
      case "zoomOut": return zoomAt(1 / 1.5, w / 2, h / 2);
      case "fit": return fitView();
      case "focusTurn": return focusTurn();
      case "focusX": { const G = A.G; if (!G) return; if (xVisible()) centerOn(A.sec.pos); else if (G.lastSeen) centerOn(G.lastSeen.pos); else toast("怪盗Xはまだ姿を見せていません"); return; }
      case "focusD": return A.G && centerOn(A.G.det[Number(b.dataset.k)].pos);
      case "focusPos": return centerOn(Number(b.dataset.pos));
      case "cardOk": {
        const pc = A.pendingCard;
        if (!pc || pc.stage !== "reveal") return;
        A.pendingCard = null;
        return step();
      }
      case "cardCancel": if (A.pendingCard && A.pendingCard.stage === "target") { A.pendingCard = null; render(); } return;
      case "hand": if (!handViewSide()) return; A.handSheet = true; A.sel = null; renderSheet(); return;
      case "handClose": A.handSheet = false; renderSheet(); return;
      case "useCard": {
        if (!canUseHand()) return;
        const side = handSide(), i = Number(b.dataset.i), card = handOf(A.G, side)[i];
        A.handSheet = false;
        if (needsTargetCard(card)) {
          const opts = cardTargets(A.G, A.sec, card) || [];
          if (!opts.length) { toast("いまは使える場所がありません"); renderSheet(); return; }
          A.pendingCard = { side, card, stage: "target", opts, handIndex: i };
          render();
          if (card === "destroy") fitStations([A.sec.pos, ...opts]); else fitView();
          return;
        }
        let tgt = null;
        if (card === "checkpoint") {
          if (A.G.turn === "x") return;
          tgt = A.G.det[A.G.turn].pos;
        }
        if (card === "dash") {
          if (A.G.turn === "x" || A.G.dash != null) return;
          tgt = A.G.turn;
        }
        handOf(A.G, side).splice(i, 1);
        useCardNow(side, card, tgt);
        save(); render();
        return;
      }
      case "order": A.orderSheet = Number(b.dataset.k); A.sel = null; renderSheet(); return;
      case "orderPick": A.pendingOrder = A.orderSheet; A.orderSheet = null; renderSheet(); render(); toast(`${dName(A.pendingOrder)} の行き先の駅をタップ`); return;
      case "orderClear": { const k = A.orderSheet; if (A.G.orders) delete A.G.orders[k]; A.orderSheet = null; toast(`${dName(k)} はおまかせで動きます`); save(); render(); return; }
      case "orderClose": A.orderSheet = null; renderSheet(); return;
      case "pinSend": {
        const k = Number(b.dataset.k), st = A.pinSheet, G = A.G;
        G.pin = st; G.orders = { ...(G.orders || {}), [k]: st };
        A.pinSheet = null;
        toast(`${dName(k)}：${NAME(st)} へ向かいます`);
        pushFeed(G.xLog.length, `作戦ピン：${dName(k)} は ${NO(st)} ${NAME(st)} へ`);
        save(); render(); return;
      }
      case "pinSurround": {
        const st = A.pinSheet, G = A.G;
        G.pin = st; surround(st);
        A.pinSheet = null;
        toast(`${NAME(st)} を包囲せよ！`);
        pushFeed(G.xLog.length, `作戦ピン：全員で ${NO(st)} ${NAME(st)} を包囲`, true);
        save(); render(); return;
      }
      case "pinClear": A.G.pin = null; A.G.orders = {}; A.pinSheet = null; toast("作戦ピンと指示を外しました"); save(); render(); return;
      case "pinClose": A.pinSheet = null; renderSheet(); return;
      case "hint": A.hints = !A.hints; render(); return;
      case "log": $("drawer").hidden = !$("drawer").hidden; renderHandbar(); return;
      case "cancel": A.sel = null; A.useDouble = false; render(); return;
      case "double": A.useDouble = !A.useDouble; renderSheet(); return;
      case "passTurn": {
        if (!humanTurn()) return;
        const G = A.G;
        A.sel = null; A.useDouble = false;
        if (G.turn === "x") {
          if (G.doubling || !xMoves(G, A.sec).length) return;
          commitX(A.sec.pos, "pass");
        } else {
          const k = G.turn;
          pushFeed(G.xLog.length, `${dName(k)} はパス（その場にとどまった）`);
          apply(() => skipD(G, k));
          step();
        }
        return;
      }
      case "heli": {
        if (!humanTurn()) return;
        const G = A.G, moves = G.turn === "x" ? xMoves(G, A.sec) : detMoves(G, G.turn);
        if (!moves.some(m => m.type === "heli")) return;
        A.sel = -1; A.useDouble = false; render(); return;
      }
      case "ticket": {
        const G = A.G, to = A.sel, type = b.dataset.type;
        if (to === null || !humanTurn()) return;
        if (G.turn === "x") commitX(to, type); else commitD(G.turn, to, type);
        return;
      }
    }
  });
  $("sheet").addEventListener("click", e => { if (e.target === $("sheet")) { A.sel = null; A.useDouble = false; A.orderSheet = null; A.pinSheet = null; A.handSheet = false; render(); } });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && A.sel !== null) { A.sel = null; render(); }
    if (A.screen !== "game") return;
    const { w, h } = vpSize();
    if (e.key === "+" || e.key === "=") zoomAt(1.4, w / 2, h / 2);
    if (e.key === "-") zoomAt(1 / 1.4, w / 2, h / 2);
  });

  // ======================================================================
  // 起動
  // ======================================================================
  function boot(data) {
    renderBackground();
    buildBoard();
    fitView(false);
    if (data && data.A && data.A.G) {
      Object.assign(A, data.A, { busy: false });
      buildTokens();
      if (A.screen === "game" && !A.G.over) step(); else render();
    } else {
      renderScreen();
    }
  }
  try { window.claude?.hot?.snapshot?.(() => ({ A })); } catch (e) {}
  if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
  else boot(window.claude?.hot?.data ?? {});
})();
</script>
