<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ARTIFACT-START -->
<title>ロンドン・チェイス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Old+Mincho:wght@700;900&display=swap">
<style>
  /* 霧のロンドン：卓上に広げたボードゲーム盤（単一テーマ） */
  :root {
    color-scheme: dark;
    --ground: #16110C;
    --panel: #221A12;
    --panel-2: #2C2218;
    --ink: #F2E8D5;
    --muted: #B4A58B;
    --rule: #43352A;
    --accent: #E3B341;
    /* 盤面（羊皮紙） */
    --land: #E9DDC0;
    --street: #CDBB93;
    --road: #F3EAD2;
    --road-edge: #BFAA7E;
    --water: #9CBFC4;
    --water-ink: #3F6B74;
    --park: #B6C48A;
    --park-ink: #5C6E33;
    --map-ink: #3E2F20;
    --lm: #D8C7A0;
    --train: #E0A91C;
    --subway: #C3342B;
    --bus: #1F8A57;
    --ferry: #2F7FB0;
    --black: #0B0906;
    --xdisc: #1D1A16;
    --xrim: #B3261E;
    --station: #FBF5E4;
    --good: #5FBF7A;
  }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .app {
    max-width: 1440px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 12px 28px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ---------- header ---------- */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
  }
  .brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand-chars { display: flex; }
  .brand-chars svg { width: 40px; height: 40px; }
  .brand-chars svg + svg { margin-left: -12px; }
  h1 {
    font-family: "Zen Old Mincho", "Hiragino Mincho ProN", serif;
    font-weight: 900;
    font-size: clamp(22px, 3.2vw, 32px);
    letter-spacing: 0.04em;
    margin: 0;
    line-height: 1.1;
  }
  h1 em { font-style: normal; color: var(--accent); }
  .brand small { color: var(--muted); font-size: 12px; letter-spacing: 0.1em; }
  .status-bar { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
  .flap {
    font-family: "DotGothic16", ui-monospace, monospace;
    background: #05070C;
    color: var(--accent);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 6px 12px;
    display: flex;
    gap: 12px;
    align-items: baseline;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.06em;
  }
  .flap b { font-weight: 400; font-size: 22px; }
  .flap span { font-size: 12px; opacity: 0.85; }
  .net {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
    border: 1px solid var(--rule); border-radius: 6px; padding: 4px 10px;
  }
  .net i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .net.on i { background: var(--good); box-shadow: 0 0 8px var(--good); }

  /* ---------- legend ---------- */
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--muted); align-items: center; }
  .legend > span { display: inline-flex; align-items: center; gap: 6px; }
  .legend svg.sw { width: 38px; height: 12px; }
  .legend svg.face { width: 22px; height: 22px; }

  /* ---------- map ---------- */
  .mapwrap {
    position: relative;
    background: var(--land);
    border: 1px solid var(--rule);
    border-radius: 12px;
    overflow: hidden;
  }
  .mapscroll { overflow-x: auto; }
  svg#map { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
  @media (max-width: 760px) {
    svg#map { width: 760px; max-width: none; }
  }

  /* ---------- panels ---------- */
  .panels {
    display: grid;
    grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.35fr) minmax(280px, 1fr);
    gap: 12px;
    align-items: start;
  }
  @media (max-width: 1080px) { .panels { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); } }
  .card {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }
  .label {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--muted);
    font-weight: 700;
  }
  .turn-title { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .turn-help { color: var(--muted); font-size: 13px; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.45; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip {
    border: 1px solid var(--rule);
    background: var(--panel-2);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .chip:hover:not(:disabled) { border-color: var(--ink); }
  .dots { display: inline-flex; gap: 3px; }
  .dot { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .dot.train { background: var(--train); }
  .dot.subway { background: var(--subway); }
  .dot.bus { background: var(--bus); border-radius: 50%; }
  .dot.ferry { background: var(--ferry); border-radius: 50% 0; }
  .dot.black { background: var(--black); outline: 1px solid var(--ink); }
  .btn {
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #111;
    border-radius: 8px;
    padding: 8px 14px;
    font-weight: 700;
  }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); font-weight: 400; }
  .btn.ghost:hover:not(:disabled) { border-color: var(--ink); }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .toggle[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .who { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 13px; white-space: nowrap; }
  .who svg { width: 26px; height: 26px; flex: none; }

  /* ---------- tickets ---------- */
  .tk {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 34px; height: 22px; padding: 0 6px; border-radius: 4px;
    font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: #111;
  }
  .tk.train { background: var(--train); }
  .tk.subway { background: var(--subway); color: #fff; }
  .tk.bus { background: var(--bus); color: #fff; }
  .tk.black { background: var(--black); color: #fff; border: 1px solid #C9D1E3; }
  .tk.double { background: #fff; color: #111; }
  .tk.zero { opacity: 0.3; }

  /* 怪盗Xの移動記録 */
  .log-grid { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
  .slot {
    position: relative;
    border: 1px solid var(--rule);
    background: var(--panel-2);
    border-radius: 5px;
    height: 50px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "DotGothic16", ui-monospace, monospace;
    font-size: 12px;
    overflow: hidden;
  }
  .slot .n { position: absolute; top: 1px; left: 4px; font-size: 9px; color: var(--muted); }
  .slot.reveal { border-color: var(--xrim); }
  .slot.reveal .n { color: var(--xrim); }
  .slot.now { box-shadow: 0 0 0 2px var(--accent); }
  .slot.train { background: var(--train); color: #111; }
  .slot.subway { background: var(--subway); color: #fff; }
  .slot.bus { background: var(--bus); color: #fff; }
  .slot.black { background: var(--black); color: #fff; }
  .slot.train .n, .slot.subway .n, .slot.bus .n, .slot.black .n { color: inherit; opacity: 0.75; }
  .slot .st { font-family: "Zen Kaku Gothic New", sans-serif; font-size: 10px; font-weight: 700; line-height: 1.1; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
  .slot .dbl { position: absolute; top: 1px; right: 3px; font-size: 9px; }

  .dets { display: flex; flex-direction: column; gap: 6px; }
  .det-row { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
  .det-row .nm { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .det-row .nm small { font-weight: 400; color: var(--muted); }
  .det-row .tks { display: flex; gap: 4px; }
  .det-row.active .nm { color: var(--accent); }
  .xrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }

  /* ---------- log / chat ---------- */
  .tabs { display: flex; gap: 4px; }
  .tab { border: 1px solid var(--rule); background: transparent; border-radius: 6px; padding: 3px 10px; font-size: 12px; color: var(--muted); }
  .tab[aria-selected="true"] { background: var(--panel-2); color: var(--ink); border-color: var(--ink); }
  .feed { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .feed li { display: flex; gap: 8px; }
  .feed .r { font-family: "DotGothic16", ui-monospace, monospace; color: var(--muted); min-width: 30px; font-variant-numeric: tabular-nums; }
  .feed li.hot { font-weight: 700; color: var(--accent); }
  .feed li.chat .who-n { font-weight: 700; }
  .chat-form { display: flex; gap: 6px; }
  .chat-form input {
    flex: 1; min-width: 0;
    background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; font: inherit;
  }

  /* ---------- map SVG ---------- */
  .bg-land { fill: var(--land); }
  .bg-street { fill: none; stroke: var(--street); stroke-width: 1.4; stroke-linecap: round; }
  .bg-road { fill: none; stroke: var(--road); stroke-width: 6; stroke-linecap: round; }
  .bg-road-edge { fill: none; stroke: var(--road-edge); stroke-width: 9; stroke-linecap: round; }
  .bg-water { fill: var(--water); }
  .bg-river { fill: none; stroke: var(--water); stroke-linecap: round; stroke-linejoin: round; }
  .bg-river-edge { fill: none; stroke: var(--water-ink); stroke-linecap: round; stroke-linejoin: round; opacity: 0.55; }
  .bg-park { fill: var(--park); stroke: var(--park-ink); stroke-width: 1.2; stroke-opacity: 0.6; }
  .bg-ward { font-family: "IM Fell English SC", Georgia, serif; font-size: 30px; letter-spacing: 0.3em; fill: var(--map-ink); opacity: 0.16; pointer-events: none; }
  .bg-place { font-family: "Zen Old Mincho", serif; font-size: 13px; fill: var(--park-ink); font-weight: 700; letter-spacing: 0.12em; pointer-events: none; }
  .bg-place.water { fill: var(--water-ink); font-style: italic; font-size: 16px; letter-spacing: 0.4em; }
  .bg-ink { fill: var(--map-ink); }
  .bg-inkline { stroke: var(--map-ink); fill: none; }
  .lm { fill: var(--lm); stroke: var(--map-ink); stroke-width: 1.3; stroke-linejoin: round; opacity: 0.9; }
  .lm-line { fill: none; stroke: var(--map-ink); stroke-width: 1.3; opacity: 0.9; }
  .lm-label { font-family: "IM Fell English SC", Georgia, serif; font-size: 11px; fill: var(--map-ink); opacity: 0.75; text-anchor: middle; pointer-events: none; }
  .cartouche { fill: var(--station); stroke: var(--map-ink); stroke-width: 1.5; }
  .cartouche-title { font-family: "IM Fell English SC", Georgia, serif; font-size: 34px; fill: var(--map-ink); letter-spacing: 0.18em; text-anchor: middle; }
  .cartouche-sub { font-family: "IM Fell English SC", Georgia, serif; font-size: 12px; fill: var(--map-ink); text-anchor: middle; opacity: 0.8; }

  .edge { fill: none; stroke-linecap: round; }
  .edge.train.base { stroke: var(--train); stroke-width: 8; stroke-linecap: butt; }
  .edge.train.tie  { stroke: var(--land); stroke-width: 3.5; stroke-dasharray: 12 12; stroke-linecap: butt; }
  .edge.subway.base { stroke: var(--subway); stroke-width: 10; }
  .edge.subway.tie  { stroke: var(--land); stroke-width: 3.5; }
  .edge.bus.base { stroke: var(--bus); stroke-width: 7; stroke-dasharray: 0 13; }
  .edge.ferry.base { stroke: var(--ferry); stroke-width: 4; stroke-dasharray: 16 8 3 8; }

  .stn { fill: var(--station); }
  .stn-rim { fill: none; stroke: var(--map-ink); stroke-width: 2.5; }
  .stn-pier { fill: none; stroke: var(--ferry); stroke-width: 3; stroke-dasharray: 4 3; }
  .wedge.train { fill: var(--train); }
  .wedge.subway { fill: var(--subway); }
  .wedge.bus { fill: var(--bus); }
  .stn-num { font-family: "IM Fell English SC", Georgia, serif; font-size: 12px; font-weight: 700; fill: var(--map-ink); text-anchor: middle; pointer-events: none; }
  .stn-hit { fill: transparent; }
  .stn-hit.can { cursor: pointer; }
  .stn-label {
    font-family: "Zen Old Mincho", "Hiragino Mincho ProN", serif;
    font-size: 17px; font-weight: 900; fill: var(--map-ink);
    paint-order: stroke; stroke: var(--land); stroke-width: 6px; stroke-linejoin: round;
    pointer-events: none;
  }
  .dest { fill: none; stroke: var(--map-ink); stroke-width: 4; pointer-events: none; }
  .dest.pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .poss { fill: var(--xrim); opacity: 0.25; pointer-events: none; }
  .lastseen { fill: none; stroke: var(--xrim); stroke-width: 3; stroke-dasharray: 6 5; pointer-events: none; }
  .lastseen-label { font-size: 15px; font-weight: 700; fill: var(--xrim); paint-order: stroke; stroke: var(--land); stroke-width: 5px; pointer-events: none; }
  .tok { pointer-events: none; }
  .tok .disc { stroke: var(--station); stroke-width: 3; }
  .tok .disc.x { fill: var(--xdisc); stroke: var(--xrim); }
  .tok .ring { fill: none; stroke: var(--map-ink); stroke-width: 4; }
  .tok .num { fill: var(--map-ink); }
  .tok .num-t { fill: var(--station); font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  .trail { fill: none; stroke: var(--xrim); stroke-width: 4; stroke-dasharray: 10 7; opacity: 0.9; pointer-events: none; }

  /* ---------- overlay ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    background: color-mix(in srgb, var(--ground) 70%, transparent);
    display: grid;
    place-items: center;
    padding: 16px;
    backdrop-filter: blur(3px);
    overflow-y: auto;
  }
  .sheet {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 20px 22px;
    max-width: 640px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.5);
  }
  .sheet h2 { font-family: "Zen Old Mincho", "Hiragino Mincho ProN", serif; font-weight: 900; font-size: 24px; margin: 0; text-wrap: balance; line-height: 1.25; }
  .sheet p { margin: 0; color: var(--muted); font-size: 13px; }
  .sheet ul { margin: 0; padding-left: 1.2em; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mode {
    border: 1px solid var(--rule);
    background: var(--panel-2);
    border-radius: 12px;
    padding: 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .mode h3 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .mode p { font-size: 12px; }
  .rooms { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
  .room-row {
    display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
    background: var(--panel-2); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px;
  }
  .code { font-family: "DotGothic16", ui-monospace, monospace; font-size: 18px; color: var(--accent); letter-spacing: 0.12em; }
  .seats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
  .seat {
    border: 1px solid var(--rule); background: var(--panel-2); border-radius: 10px; padding: 10px;
    display: grid; grid-template-columns: 40px 1fr; gap: 2px 10px; align-items: center;
  }
  .seat svg { width: 40px; height: 40px; grid-row: span 2; }
  .seat .role-n { font-size: 12px; color: var(--muted); }
  .seat .pl { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat .acts { grid-column: 1 / -1; display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .seat.mine { border-color: var(--accent); }
  .note { font-size: 12px; color: var(--muted); border-left: 3px solid var(--rule); padding-left: 8px; }
  .result-chars { display: flex; gap: 4px; }
  .result-chars svg { width: 56px; height: 56px; }
  @media (max-width: 600px) {
    .modes { grid-template-columns: 1fr; }
    .overlay { position: fixed; z-index: 10; }
    .log-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .dest.pulse { animation: none; }
  }
</style>
<!-- ARTIFACT-HEAD-END -->
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

        <text x="0" y="-12.3" font-size="7.5" font-weight="700" text-anchor="middle" fill="#F2C230">X</text>
      </g>
    </symbol>
    <!-- 刑事 -->
    <symbol id="chr-d" viewBox="-20 -20 40 40">
      <g clip-path="url(#clip-chr)">
        <path d="M-15,20 Q-15,9 0,9 Q15,9 15,20 Z" fill="#2B3448"></path>
        <path d="M-4.5,9 L0,14 L4.5,9 Z" fill="#FFFFFF"></path>
        <path d="M-1.3,11.5 h2.6 l0.9,5.5 l-2.2,2 l-2.2,-2 z" fill="#0F1733"></path>
        <circle cx="7.5" cy="14" r="1.9" fill="#F2C230"></circle>
        <circle cy="0.5" r="8.6" fill="#F4C9A0"></circle>
        <path d="M-10,-5 L-8.5,-14 Q0,-18.5 8.5,-14 L10,-5 Z" fill="#1F2F5F"></path>
        <rect x="-10.5" y="-7.2" width="21" height="3" fill="#0F1733"></rect>
        <path d="M-10.2,-4.4 Q0,-1.2 10.2,-4.4 L10.2,-3.2 Q0,0.6 -10.2,-3.2 Z" fill="#0F1733"></path>
        <circle cx="0" cy="-11" r="2.4" fill="#F2C230"></circle>
        <circle cx="-3.3" cy="1.6" r="1.3" fill="#1B2230"></circle>
        <circle cx="3.3" cy="1.6" r="1.3" fill="#1B2230"></circle>
        <path d="M-5.2,-1.4 h3.2 M2,-1.4 h3.2" stroke="#1B2230" stroke-width="1.1" stroke-linecap="round"></path>
        <path d="M-2.6,5 Q0,7 2.6,5" stroke="#6B3A2A" stroke-width="1.3" fill="none" stroke-linecap="round"></path>
      </g>
    </symbol>
    <filter id="paper" x="0" y="0" width="100%" height="100%">

<script>
(() => {
  "use strict";

  // ======================================================================
  // CORE-START  ルールとCPU（DOMに依存しない）
  // ======================================================================
  const MX = x => 60 + (x - 50) * 1.45;
  const MY = y => 30 + y * 0.9;
  const RAW_STATIONS = [
    ["キルバーン", 220, 110, 0, -28, "middle"],
    ["ハムステッド", 400, 75, 0, -28, "middle"],
    ["ハイゲート", 600, 50, 0, -28, "middle"],
    ["ハイベリー", 740, 125, 24, 7, "start"],
    ["ハックニー", 890, 110, 0, -28, "middle"],
    ["エンジェル", 740, 230, 24, 7, "start"],
    ["バービカン", 700, 310, 24, 7, "start"],
    ["キングス・クロス", 590, 270, 0, -28, "middle"],
    ["カムデン", 500, 190, 0, -28, "middle"],
    ["メイダ・ヴェール", 180, 230, -24, 7, "end"],
    ["シェパーズ・ブッシュ", 50, 360, -16, 38, "start"],
    ["パディントン", 170, 370, -24, -14, "end"],
    ["オックスフォード・サーカス", 380, 370, 0, 38, "middle"],
    ["ホルボーン", 610, 370, -24, 7, "end"],
    ["リバプール・ストリート", 770, 380, 0, -28, "middle"],
    ["ストラトフォード", 930, 280, 16, 38, "end"],
    ["バンク", 700, 440, 24, 7, "start"],
    ["グリーン・パーク", 390, 470, -24, 7, "end"],
    ["チャリング・クロス", 500, 470, 0, 38, "middle"],
    ["セント・ポール", 670, 530, 24, 7, "start"],
    ["ホワイトチャペル", 850, 480, 24, 7, "start"],
    ["ケンジントン", 190, 480, -24, 7, "end"],
    ["ナイツブリッジ", 280, 540, 0, 38, "middle"],
    ["アールズ・コート", 180, 590, 0, 38, "middle"],
    ["ハマースミス", 50, 610, -16, 38, "start"],
    ["ヴィクトリア", 380, 590, 0, 38, "middle"],
    ["ウェストミンスター", 590, 590, -18, 36, "end"],
    ["タワー・ヒル", 790, 590, 0, 38, "middle"],
    ["ランベス", 480, 650, 0, 38, "middle"],
    ["ウォータールー", 610, 690, 24, 7, "start"],
    ["カナリー・ワーフ", 920, 660, 0, 38, "middle"],
    ["バタシー", 250, 700, 0, 38, "middle"],
    ["クラパム", 400, 740, 0, 38, "middle"],
  ];
  const STATIONS = RAW_STATIONS.map(([n, x, y, dx, dy, a]) => [n, MX(x), MY(y), dx, dy, a]);

  const LINES = [
    ["train", "タクシー", ["バンク","バービカン","エンジェル","ハイベリー","ハイゲート","ハムステッド","キルバーン","メイダ・ヴェール","パディントン","ケンジントン","アールズ・コート","バタシー","クラパム","ウォータールー","ウェストミンスター","バンク"]],
    ["train", "タクシー", ["シェパーズ・ブッシュ","パディントン","オックスフォード・サーカス","キングス・クロス","バービカン"]],
    ["train", "タクシー", ["エンジェル","ストラトフォード"]],
    ["train", "タクシー", ["ハマースミス","アールズ・コート"]],
    ["train", "タクシー", ["ハマースミス","パディントン"]],
    ["train", "タクシー", ["ウェストミンスター","カナリー・ワーフ"]],
    ["subway", "ピカデリー線", ["アールズ・コート","ナイツブリッジ","グリーン・パーク","ウェストミンスター","セント・ポール","リバプール・ストリート","バービカン","ハイベリー","ハックニー"]],
    ["subway", "セントラル線", ["シェパーズ・ブッシュ","パディントン","オックスフォード・サーカス","グリーン・パーク","チャリング・クロス","セント・ポール","バンク","ホルボーン","キングス・クロス","カムデン","キルバーン"]],
    ["subway", "メトロポリタン線", ["シェパーズ・ブッシュ","メイダ・ヴェール","カムデン"]],
    ["subway", "メトロポリタン線", ["ホルボーン","リバプール・ストリート","ホワイトチャペル"]],
    ["subway", "ディストリクト線", ["パディントン","ヴィクトリア","ランベス","ウォータールー","タワー・ヒル"]],
    ["subway", "DLR", ["セント・ポール","タワー・ヒル","カナリー・ワーフ"]],
    ["subway", "エリザベス線", ["リバプール・ストリート","ストラトフォード"]],
    ["subway", "ジュビリー線", ["ヴィクトリア","チャリング・クロス"]],
    ["subway", "ノーザン線", ["バタシー","ランベス"]],
    ["bus", "バス 9番", ["アールズ・コート","ヴィクトリア","ウェストミンスター"]],
    ["bus", "バス 14番", ["ケンジントン","ナイツブリッジ","ヴィクトリア"]],
    ["bus", "バス 72番", ["シェパーズ・ブッシュ","ハマースミス","バタシー"]],
    ["bus", "バス 24番", ["ハムステッド","カムデン","ハイベリー"]],
    ["bus", "バス 38番", ["ハイゲート","ハックニー","ストラトフォード","ホワイトチャペル","タワー・ヒル"]],
    ["bus", "バス D3番", ["ホワイトチャペル","カナリー・ワーフ"]],
    ["bus", "バス 73番", ["キングス・クロス","エンジェル"]],
    ["bus", "バス 88番", ["クラパム","ランベス"]],
    ["bus", "バス 11番", ["チャリング・クロス","ウェストミンスター"]],
    ["bus", "バス 390番", ["オックスフォード・サーカス","カムデン"]],
    ["bus", "バス 25番", ["バンク","リバプール・ストリート"]],
    ["bus", "バス 55番", ["ホルボーン","バービカン"]],
    ["bus", "バス 19番", ["グリーン・パーク","ヴィクトリア"]],
    // テムズ川のボートは怪盗Xが黒チケットでのみ使える
    ["ferry", "テムズ川ボート", ["ハマースミス","バタシー","ランベス","ウェストミンスター","タワー・ヒル","カナリー・ワーフ"]],
  ];

  const TYPE = {
    train:  { name: "タクシー", short: "タ" },
    subway: { name: "地下鉄", short: "地" },
    bus:    { name: "バス",   short: "バ" },
    ferry:  { name: "テムズ川ボート", short: "船" },
    black:  { name: "黒チケット", short: "黒" },
  };
  const TYPE_ORDER = ["train", "subway", "bus", "ferry"];
  const DET_TYPES = ["train", "subway", "bus"];

  const MAX_MOVES = 18;
  const REVEAL = [3, 8, 13, 18];
  const DET_COUNT = 4;
  const DET_TICKETS = { train: 10, bus: 8, subway: 4 };
  const X_BLACK = 5;
  const X_DOUBLE = 3;

  const N = STATIONS.length;
  const IDX = Object.fromEntries(STATIONS.map((s, i) => [s[0], i]));
  const NAME = i => STATIONS[i][0];

  const edgeTypes = new Map(); // "a-b" -> Map(type -> 路線名[])
  for (const [type, lineName, seq] of LINES) {
    for (let k = 0; k < seq.length - 1; k++) {
      const a = IDX[seq[k]], b = IDX[seq[k + 1]];
      if (a === undefined || b === undefined) throw new Error("unknown station " + seq[k] + "/" + seq[k + 1]);
      const key = a < b ? a + "-" + b : b + "-" + a;
      if (!edgeTypes.has(key)) edgeTypes.set(key, new Map());
      const m = edgeTypes.get(key);
      if (!m.has(type)) m.set(type, []);
      if (!m.get(type).includes(lineName)) m.get(type).push(lineName);
    }
  }
  const ADJ = Array.from({ length: N }, () => []);
  for (const [key, types] of edgeTypes) {
    const [a, b] = key.split("-").map(Number);
    for (const t of types.keys()) {
      ADJ[a].push({ to: b, type: t });
      ADJ[b].push({ to: a, type: t });
    }
  }
  // 刑事が使える路線だけでの最短距離
  const D = Array.from({ length: N }, (_, s) => {
    const d = new Array(N).fill(Infinity);
    d[s] = 0;
    const q = [s];
    while (q.length) {
      const u = q.shift();
      for (const e of ADJ[u]) if (e.type !== "ferry" && d[e.to] === Infinity) { d[e.to] = d[u] + 1; q.push(e.to); }
    }
    return d;
  });

  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  const clone = o => JSON.parse(JSON.stringify(o));

  // ゲーム状態 G は公開情報のみ。怪盗Xの現在地は sec（秘密）に分けて持つ。
  function newGame(detCount = DET_COUNT) {
    const ids = shuffle([...Array(N).keys()]);
    const det = ids.slice(0, detCount).map(pos => ({ pos, t: { ...DET_TICKETS } }));
    const startable = ids.filter(p => det.every(d => D[p][d.pos] >= 2));
    const xStart = startable[0];
    const G = {
      seq: 1, turn: "x", det, xLog: [], black: X_BLACK, dbl: X_DOUBLE, doubling: false,
      possible: startable.slice().sort((a, b) => a - b), lastSeen: null,
      over: false, winner: null, reason: "", xPath: null,
    };
    return { G, sec: { pos: xStart, path: [xStart] } };
  }

  function xMoves(G, sec) {
    const occ = new Set(G.det.map(d => d.pos));
    const out = [];
    const blackTo = new Set();
    for (const e of ADJ[sec.pos]) {
      if (occ.has(e.to)) continue;
      if (e.type !== "ferry") out.push({ to: e.to, type: e.type });
      if (G.black > 0 && !blackTo.has(e.to)) { blackTo.add(e.to); out.push({ to: e.to, type: "black" }); }
    }
    return out;
  }
  const canDouble = G => G.dbl > 0 && !G.doubling && G.xLog.length <= MAX_MOVES - 2;

  function nextPossible(G, type) {
    const occ = new Set(G.det.map(d => d.pos));
    const nx = new Set();
    for (const s of G.possible) for (const e of ADJ[s]) {
      if ((type === "black" || e.type === type) && !occ.has(e.to)) nx.add(e.to);
    }
    return [...nx].sort((a, b) => a - b);
  }

  function applyX(G, sec, to, type, useDouble) {
    sec.pos = to;
    sec.path.push(to);
    const n = G.xLog.length + 1;
    const rev = REVEAL.includes(n);
    G.xLog.push({ t: type, p: rev ? to : null, d: useDouble ? 1 : (G.doubling ? 2 : 0) });
    if (type === "black") G.black--;
    G.possible = rev ? [to] : nextPossible(G, type);
    if (rev) G.lastSeen = { pos: to, n };
    if (useDouble) { G.dbl--; G.doubling = true; }
    else { G.doubling = false; G.turn = 0; }
    G.seq++;
  }

  function detMoves(G, k) {
    const d = G.det[k];
    const occ = G.det.filter((_, j) => j !== k).map(x => x.pos);
    return ADJ[d.pos].filter(e => e.type !== "ferry" && d.t[e.type] > 0 && !occ.includes(e.to));
  }
  const allStuck = G => G.det.every((_, k) => detMoves(G, k).length === 0);

  function advance(G, k) {
    if (k + 1 < G.det.length) G.turn = k + 1;
    else if (G.xLog.length >= MAX_MOVES) { G.over = true; G.winner = "x"; G.reason = "escape"; }
    else G.turn = "x";
  }
  function applyD(G, k, to, type) {
    const d = G.det[k];
    d.pos = to;
    d.t[type]--;
    G.possible = G.possible.filter(p => p !== to);
    advance(G, k);
    G.seq++;
  }
  function skipD(G, k) { advance(G, k); G.seq++; }
  function finish(G, winner, reason) { G.over = true; G.winner = winner; G.reason = reason; G.seq++; }

  // ---------------- CPU ----------------
  function aiX(G, sec) {
    const moves = xMoves(G, sec);
    const cpos = G.det.map(d => d.pos);
    const score = to => {
      const dmin = Math.min(...cpos.map(c => D[to][c]));
      const dsum = cpos.reduce((s, c) => s + Math.min(D[to][c], 5), 0);
      const exits = ADJ[to].filter(e => !cpos.some(c => D[e.to][c] <= 1)).length;
      let s = Math.min(dmin, 4) * 10 + dsum + exits * 1.5 + Math.random() * 3;
      if (dmin <= 1) s -= 40;
      return { s, dmin };
    };
    let best = null, bs = -Infinity, bestD = 0;
    for (const to of new Set(moves.map(m => m.to))) {
      const r = score(to);
      if (r.s > bs) { bs = r.s; best = to; bestD = r.dmin; }
    }
    const n = G.xLog.length + 1;
    const nowD = Math.min(...cpos.map(c => D[sec.pos][c]));
    const useDouble = canDouble(G) && bestD <= 1;
    const opts = moves.filter(m => m.to === best && m.type !== "black").map(m => m.type);
    let type = opts[0], size = -1;
    for (const ty of opts) { const k = nextPossible(G, ty).length; if (k > size) { size = k; type = ty; } }
    const wantBlack = G.black > 0 && !REVEAL.includes(n) && (
      !opts.length ||
      (REVEAL.includes(n - 1) && Math.random() < 0.6) ||
      (nowD <= 2 && Math.random() < 0.35));
    if (wantBlack || !type) type = "black";
    return { to: best, type, useDouble };
  }

  function aiD(G, k) {
    const moves = detMoves(G, k);
    const P = G.possible;
    const w = 1 / Math.max(1, P.length);
    let best = null, bs = -Infinity;
    for (const to of new Set(moves.map(m => m.to))) {
      let ed = 0;
      for (const p of P) ed += Math.min(D[to][p], 8) * w;
      const prob = P.includes(to) ? w : 0;
      let spread = 0;
      G.det.forEach((o, j) => { if (j !== k && D[to][o.pos] <= 1) spread -= 1.2; });
      const types = moves.filter(m => m.to === to).map(m => m.type);
      const spare = Math.max(...types.map(t => G.det[k].t[t]));
      const s = prob * 30 - ed * 4 + spread - (spare <= 1 ? 1.5 : 0) + Math.random() * 0.8;
      if (s > bs) { bs = s; best = to; }
    }
    // 残り枚数が多い切符を使う
    const types = moves.filter(m => m.to === best).map(m => m.type);
    types.sort((a, b) => G.det[k].t[b] - G.det[k].t[a]);
    return { to: best, type: types[0] };
  }
  // ======================================================================
  // CORE-END
  // ======================================================================

  const $ = id => document.getElementById(id);
  const SVGNS = "http://www.w3.org/2000/svg";
  function el(tag, attrs = {}, parent) {
    const e = document.createElementNS(SVGNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const DCOL = ["#4F8DFF", "#FF8A3D", "#B46CFF", "#2FD1C0"];
  const AI_DELAY = 550;

  function face(kind, k = 0) {
    if (kind === "x") {
      return `<svg class="face" viewBox="-20 -20 40 40" aria-hidden="true"><circle r="19" fill="#1D2130" stroke="#E5484D" stroke-width="2"></circle><use href="#chr-x" x="-20" y="-20" width="40" height="40"></use></svg>`;
    }
    return `<svg class="face" viewBox="-20 -20 40 40" aria-hidden="true"><circle r="19" fill="${DCOL[k % DCOL.length]}"></circle><use href="#chr-d" x="-20" y="-20" width="40" height="40"></use></svg>`;
  }
  const dName = k => "刑事" + (k + 1);

  // ======================================================================
  // アプリ状態
  // ======================================================================
  const A = {
    mode: null,          // "local" | "online"
    role: null,          // local: "x" | "d"
    G: null,
    sec: null,           // 怪盗Xの秘密（自分がXのときだけ）
    pending: null,       // 同じ駅へ複数の手段があるときの選択
    useBlack: false,
    useDouble: false,
    hints: true,
    tab: "log",
    feed: [],            // {n, text, hot}
    showResult: false,
    screen: "menu",      // menu | lobby | room | game
  };
  const NET = { db: null, user: null, me: null, rooms: [], room: null, code: null, chat: [], unsub: [], names: {}, handledSeq: 0, busy: false, readOnly: false };
  let timer = null;

  // ---------------- 手番の担当 ----------------
  function mySeatsD() {
    if (A.mode === "local") return A.role === "d" ? A.G.det.map((_, k) => k) : [];
    const s = NET.room?.seats || {};
    return A.G.det.map((_, k) => k).filter(k => s["d" + k]?.uid === NET.me && !s["d" + k]?.cpu);
  }
  const iAmX = () => A.mode === "local" ? A.role === "x" : (NET.room?.seats?.x?.uid === NET.me && !!NET.me);
  function isMyTurn() {
    const G = A.G;
    if (!G || G.over) return false;
    if (G.turn === "x") return iAmX() && !!A.sec;
    return mySeatsD().includes(G.turn);
  }
  function seatLabel(key) {
    if (A.mode !== "online") return key === "x" ? (A.role === "x" ? "あなた" : "CPU") : (A.role === "d" ? "あなた" : "CPU");
    const s = NET.room?.seats?.[key];
    if (!s) return "空席";
    if (s.cpu) return "CPU";
    if (!s.uid) return "空席";
    if (s.uid === NET.me) return "あなた";
    return NET.names[s.uid] || "プレイヤー";
  }

  // ---------------- ログ（状態の差分から作る） ----------------
  function describe(prev, G) {
    const out = [];
    if (!prev) return out;
    for (let i = prev.xLog.length; i < G.xLog.length; i++) {
      const e = G.xLog[i];
      let s = `怪盗Xが ${TYPE[e.t].name} で移動`;
      if (e.d === 1) s = "怪盗Xが2倍移動！ " + s;
      if (iAmX() && A.sec) s += `（→ ${NAME(A.sec.path[i + 1])}）`;
      out.push({ n: i + 1, text: s });
      if (e.p !== null) out.push({ n: i + 1, text: `目撃情報！ 怪盗Xは ${NAME(e.p)} にいる`, hot: true });
    }
    G.det.forEach((d, k) => {
      const p = prev.det[k];
      if (!p) return;
      if (p.pos !== d.pos) {
        const used = DET_TYPES.find(t => p.t[t] !== d.t[t]);
        out.push({ n: G.xLog.length, text: `${dName(k)} → ${NAME(d.pos)}（${used ? TYPE[used].name : ""}）` });
      }
    });
    if (!prev.over && G.over) {
      const msg = G.winner === "x"
        ? (G.reason === "stuck" ? "刑事が全員動けなくなった。怪盗Xの勝ち！" : "怪盗Xが逃げ切った！")
        : (G.reason === "trapped" ? "怪盗Xは囲まれて動けない。刑事の勝ち！" : "怪盗Xを逮捕！ 刑事の勝ち！");
      out.push({ n: G.xLog.length, text: msg, hot: true });
    }
    return out;
  }
  function pushFeed(items) {
    for (const it of items) A.feed.unshift(it);
    if (A.feed.length > 120) A.feed.length = 120;
  }

  // ======================================================================
  // ローカル（CPU対戦）
  // ======================================================================
  function startLocal(role) {
    leaveRoom();
    clearTimeout(timer);
    const { G, sec } = newGame();
    A.mode = "local"; A.role = role; A.G = G; A.sec = sec;
    A.feed = []; A.pending = null; A.useBlack = false; A.useDouble = false; A.showResult = false;
    A.screen = "game";
    pushFeed([{ n: 0, text: role === "x" ? "あなたは怪盗X。18手逃げ切れば勝ち！" : "あなたは刑事4人を指揮する。怪盗Xを逮捕せよ！", hot: true }]);
    localStep();
  }

  function localApply(fn) {
    const prev = clone(A.G);
    fn();
    // 逮捕判定（ローカルは秘密を知っている）
    if (!A.G.over && A.G.det.some(d => d.pos === A.sec.pos)) finish(A.G, "d", "caught");
    pushFeed(describe(prev, A.G));
  }

  function localStep() {
    clearTimeout(timer);
    const G = A.G;
    while (!G.over) {
      if (G.turn === "x") {
        if (!xMoves(G, A.sec).length) { localApply(() => finish(G, "d", "trapped")); continue; }
        if (A.role === "x") { render(); return; }
        render();
        timer = setTimeout(() => {
          const m = aiX(G, A.sec);
          localApply(() => applyX(G, A.sec, m.to, m.type, m.useDouble));
          localStep();
        }, AI_DELAY);
        return;
      }
      const k = G.turn;
      if (allStuck(G)) { localApply(() => finish(G, "x", "stuck")); continue; }
      if (!detMoves(G, k).length) {
        pushFeed([{ n: G.xLog.length, text: `${dName(k)} は使える切符がないので待機` }]);
        localApply(() => skipD(G, k));
        continue;
      }
      if (A.role === "d") { render(); return; }
      render();
      timer = setTimeout(() => {
        const m = aiD(G, k);
        localApply(() => applyD(G, k, m.to, m.type));
        localStep();
      }, AI_DELAY);
      return;
    }
    A.showResult = true;
    render();
  }

  // ======================================================================
  // オンライン（db 共有状態）
  // ======================================================================
  const ROOM_TTL = 3 * 60 * 60 * 1000;
  const roomRef = code => NET.db.doc("rooms/" + code);
  const secretRef = code => NET.db.doc("data/users/" + NET.me + "/x-" + code);

  async function initNet() {
    try {
      if (!window.claude?.use) return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const me = await user.id();
      if (!me) return;
      NET.db = db; NET.user = user; NET.me = me;
      const can = await user.can("data.write");
      NET.readOnly = can === false;
      $("net").classList.add("on");
      $("netText").textContent = "オンライン";
      if (A.screen === "menu") showMenu();
    } catch (e) { /* オンライン機能なしで続行 */ }
  }

  async function resolveNames(ids) {
    if (!NET.user) return;
    const want = [...new Set(ids.filter(Boolean))].filter(id => !(id in NET.names));
    if (!want.length) return;
    try {
      const ps = await NET.user.profiles(want);
      let changed = false;
      for (const id of want) { NET.names[id] = ps[id]?.name || ""; changed = true; }
      if (changed) { renderOverlay(); render(); }
    } catch (e) {}
  }

  function stopSubs() { NET.unsub.forEach(u => { try { u(); } catch (e) {} }); NET.unsub = []; }

  function openLobby() {
    if (!NET.db) return;
    leaveRoom();
    A.screen = "lobby";
    stopSubs();
    const q = NET.db.collection("rooms").where("status", "==", "lobby").orderBy("created", "desc").limit(20);
    NET.unsub.push(q.onSnapshot(snap => {
      const now = Date.now();
      NET.rooms = snap.docs.map(d => d.data()).filter(r => r && now - (r.created || 0) < ROOM_TTL);
      resolveNames(NET.rooms.map(r => r.seats?.x?.uid));
      if (A.screen === "lobby") renderOverlay();
    }, () => {}));
    renderOverlay();
  }

  function makeCode() {
    const cs = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    return Array.from({ length: 4 }, () => cs[Math.floor(Math.random() * cs.length)]).join("");
  }
  function emptySeats() {
    const s = { x: { uid: null, cpu: false } };
    for (let k = 0; k < DET_COUNT; k++) s["d" + k] = { uid: null, cpu: false };
    return s;
  }

  async function createRoom() {
    const code = makeCode();
    const seats = emptySeats();
    seats.x.uid = NET.me;
    try {
      await roomRef(code).set({ code, created: Date.now(), owner: NET.me, status: "lobby", seats, game: null });
      enterRoom(code);
    } catch (e) { toast("ルームを作れませんでした。共有設定で編集できる権限が必要です。"); }
  }

  function enterRoom(code) {
    stopSubs();
    NET.code = code; NET.room = null; NET.chat = []; NET.handledSeq = 0;
    A.mode = "online"; A.screen = "room"; A.G = null; A.sec = null; A.feed = []; A.showResult = false;
    NET.unsub.push(roomRef(code).onSnapshot(onRoom, () => {}));
    NET.unsub.push(NET.db.collection("rooms/" + code + "/chat").orderBy("t", "desc").limit(40).onSnapshot(snap => {
      NET.chat = snap.docs.map(d => d.data()).reverse();
      resolveNames(NET.chat.map(c => c.uid));
      if (A.tab === "chat") renderFeed();
    }, () => {}));
    render();
    renderOverlay();
  }

  function leaveRoom() {
    stopSubs();
    NET.code = null; NET.room = null; NET.chat = [];
    if (A.mode === "online") { A.mode = null; A.G = null; A.sec = null; }
  }

  async function onRoom(snap) {
    if (!snap.exists) { NET.room = null; A.screen = "lobby"; openLobby(); return; }
    const room = snap.data();
    const prevG = A.G;
    NET.room = room;
    const s = room.seats || {};
    resolveNames([s.x?.uid, ...Array.from({ length: DET_COUNT }, (_, k) => s["d" + k]?.uid)]);

    if (room.status === "lobby") {
      A.G = null; A.sec = null; A.screen = "room"; A.showResult = false;
      render(); renderOverlay();
      return;
    }
    const G = clone(room.game);
    A.G = G;
    A.screen = "game";
    if (iAmX() && !A.sec) {
      try {
        const sd = await secretRef(room.code).get();
        if (sd.exists) A.sec = clone(sd.data());
      } catch (e) {}
    }
    if (prevG && prevG.seq !== G.seq) pushFeed(describe(prevG, G));
    else if (!prevG) pushFeed([{ n: G.xLog.length, text: "ゲームに接続しました", hot: true }]);
    if (G.over && !prevG?.over) A.showResult = true;
    if (!G.over) A.showResult = false;
    if (A.pending && !isMyTurn()) A.pending = null;
    render(); renderOverlay();
    onlineTick();
  }

  async function writeGame(G, fields) {
    const part = {};
    for (const f of fields) part[f] = G[f];
    if (G.over) { part.over = true; part.winner = G.winner; part.reason = G.reason; }
    part.seq = G.seq;
    const extra = G.over ? { status: "over" } : {};
    await roomRef(NET.code).update({ game: part, ...extra });
  }
  const X_FIELDS = ["xLog", "black", "dbl", "doubling", "possible", "lastSeen", "turn"];
  const D_FIELDS = ["det", "possible", "turn"];

  // 怪盗Xのクライアントが進行役：逮捕判定・待機・CPU刑事を処理する
  function onlineTick() {
    const room = NET.room, G = A.G;
    if (!room || room.status === "lobby" || !G || NET.busy) return;
    if (!iAmX() || !A.sec) return;
    if (G.over) {
      if (!G.xPath) {
        NET.busy = true;
        roomRef(NET.code).update({ game: { xPath: A.sec.path }, status: "over" }).finally(() => { NET.busy = false; });
      }
      return;
    }
    if (NET.handledSeq === G.seq) return;
    const g = clone(G);
    let fields = null;
    if (g.det.some(d => d.pos === A.sec.pos)) { finish(g, "d", "caught"); fields = []; }
    else if (g.turn === "x") {
      if (!xMoves(g, A.sec).length) { finish(g, "d", "trapped"); fields = []; }
      else return; // 自分の入力待ち
    } else {
      const k = g.turn;
      const seat = room.seats["d" + k] || {};
      if (allStuck(g)) { finish(g, "x", "stuck"); fields = []; }
      else if (!detMoves(g, k).length) { skipD(g, k); fields = D_FIELDS; }
      else if (seat.cpu || !seat.uid) {
        NET.busy = true;
        NET.handledSeq = G.seq;
        clearTimeout(timer);
        timer = setTimeout(async () => {
          const m = aiD(g, k);
          applyD(g, k, m.to, m.type);
          if (g.det.some(d => d.pos === A.sec.pos)) finish(g, "d", "caught");
          try { await writeGame(g, D_FIELDS); } catch (e) { NET.handledSeq = 0; }
          NET.busy = false;
        }, AI_DELAY);
        return;
      } else return; // 人間の刑事の入力待ち
    }
    NET.busy = true;
    NET.handledSeq = G.seq;
    writeGame(g, fields).catch(() => { NET.handledSeq = 0; }).finally(() => { NET.busy = false; });
  }

  async function sit(key) {
    const s = NET.room?.seats?.[key];
    if (!s || (s.uid && s.uid !== NET.me)) return;
    try { await roomRef(NET.code).update({ seats: { [key]: { uid: NET.me, cpu: false } } }); }
    catch (e) { toast("席に座れませんでした。"); }
  }
  async function standUp(key) {
    try { await roomRef(NET.code).update({ seats: { [key]: { uid: null, cpu: false } } }); } catch (e) {}
  }
  async function toggleCpu(key) {
    const s = NET.room?.seats?.[key];
    if (!s) return;
    try { await roomRef(NET.code).update({ seats: { [key]: { uid: null, cpu: !s.cpu } } }); } catch (e) {}
  }

  async function startOnline() {
    const room = NET.room;
    if (!room || !iAmX()) return;
    const { G, sec } = newGame(DET_COUNT);
    const seats = clone(room.seats);
    for (let k = 0; k < DET_COUNT; k++) if (!seats["d" + k].uid) seats["d" + k].cpu = true;
    try {
      await secretRef(room.code).set(sec);
      A.sec = sec;
      NET.handledSeq = 0;
      A.feed = [];
      await roomRef(room.code).set({ ...room, status: "play", seats, game: G, started: Date.now() });
    } catch (e) { toast("ゲームを始められませんでした。"); }
  }

  async function backToRoom() {
    if (!NET.room) return;
    try { await roomRef(NET.code).update({ status: "lobby", game: null }); } catch (e) {}
  }

  async function sendChat(text) {
    if (!NET.code || !text.trim()) return;
    try { await NET.db.collection("rooms/" + NET.code + "/chat").add({ uid: NET.me, text: text.trim().slice(0, 120), t: Date.now() }); }
    catch (e) { toast("送信できませんでした。"); }
  }

  // ======================================================================
  // 入力
  // ======================================================================
  async function commitX(to, type, useDouble) {
    if (A.mode === "local") {
      localApply(() => applyX(A.G, A.sec, to, type, useDouble));
      A.pending = null; A.useBlack = false; A.useDouble = false;
      localStep();
      return;
    }
    const g = clone(A.G), s = clone(A.sec);
    applyX(g, s, to, type, useDouble);
    A.pending = null; A.useBlack = false; A.useDouble = false;
    try {
      await secretRef(NET.code).set(s);
      A.sec = s;
      await writeGame(g, X_FIELDS);
    } catch (e) { toast("移動を送れませんでした。もう一度試してください。"); }
  }

  async function commitD(k, to, type) {
    if (A.mode === "local") {
      localApply(() => applyD(A.G, k, to, type));
      A.pending = null;
      localStep();
      return;
    }
    const g = clone(A.G);
    applyD(g, k, to, type);
    A.pending = null;
    try { await writeGame(g, D_FIELDS); } catch (e) { toast("移動を送れませんでした。"); }
  }

  function onStation(id) {
    if (!isMyTurn()) return;
    const G = A.G;
    if (G.turn === "x") {
      const opts = xMoves(G, A.sec).filter(m => m.to === id);
      if (!opts.length) return;
      const dbl = A.useDouble && canDouble(G);
      if (A.useBlack && G.black > 0) return commitX(id, "black", dbl);
      const types = [...new Set(opts.map(o => o.type).filter(t => t !== "black"))];
      if (!types.length) { A.pending = { to: id, types: ["black"] }; render(); return; }
      if (types.length > 1) { A.pending = { to: id, types }; render(); return; }
      return commitX(id, types[0], dbl);
    }
    const k = G.turn;
    const opts = detMoves(G, k).filter(m => m.to === id);
    if (!opts.length) return;
    const types = [...new Set(opts.map(o => o.type))];
    if (types.length > 1) { A.pending = { to: id, types }; render(); return; }
    commitD(k, id, types[0]);
  }

    let seed = 20251;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const SP = 36, cols = Math.ceil(1400 / SP) + 3, rows = Math.ceil(750 / SP) + 3;
    const P = [];
    for (let r = 0; r < rows; r++) {
      P.push([]);
      for (let c = 0; c < cols; c++) P[r].push([(c - 1) * SP + (rnd() - 0.5) * 20, (r - 1) * SP + (rnd() - 0.5) * 20]);
    }

    let d = "";
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {

      if (r + 1 < rows && rnd() > 0.2) d += `M${pt(P[r][c])}L${pt(P[r + 1][c])}`;

    el("path", { d: "M0,-30 L5,0 L0,30 L-5,0 Z M-30,0 L0,-5 L30,0 L0,5 Z", class: "lm" }, cg);
    el("path", { d: "M0,-30 L5,0 L-5,0 Z", class: "bg-ink" }, cg);
    el("text", { y: -34, class: "lm-label", style: "font-size:13px" }, cg).textContent = "N";

    // 表題の飾り枠と縮尺
    const tg = el("g", { transform: "translate(22 650)" }, g);
    el("rect", { x: 0, y: 0, width: 214, height: 84, rx: 3, class: "cartouche" }, tg);
    el("rect", { x: 5, y: 5, width: 204, height: 74, rx: 2, class: "bg-inkline", "stroke-width": 0.8 }, tg);
    el("text", { x: 107, y: 40, class: "cartouche-title" }, tg).textContent = "LONDON";
    el("path", { d: "M52,56 h110 M52,52 v8 M107,54 v4 M162,52 v8", class: "bg-inkline", "stroke-width": 1.2 }, tg);
    el("text", { x: 107, y: 72, class: "cartouche-sub" }, tg).textContent = "Scale of Two Miles";

    // 紙の質感と周辺の焼け
    el("rect", { x: 0, y: 0, width: 1400, height: 750, filter: "url(#blotch)", "pointer-events": "none" }, g);
    el("rect", { x: 0, y: 0, width: 1400, height: 750, filter: "url(#paper)", "pointer-events": "none" }, g);
    el("rect", { x: 0, y: 0, width: 1400, height: 750, fill: "url(#vignette)", "pointer-events": "none" }, g);
  }

  function buildMap() {
    buildBackground();
    const gE = $("gEdges"), gS = $("gStations"), gL = $("gLabels"), gH = $("gHits");
    for (const [key, types] of edgeTypes) {
      const [a, b] = key.split("-").map(Number);
      const [, x1, y1] = STATIONS[a], [, x2, y2] = STATIONS[b];
      const len = Math.hypot(x2 - x1, y2 - y1);
      const nx = -(y2 - y1) / len, ny = (x2 - x1) / len;
      const list = TYPE_ORDER.filter(t => types.has(t));
      list.forEach((t, k) => {
        const off = (k - (list.length - 1) / 2) * 11;
        const pts = { x1: x1 + nx * off, y1: y1 + ny * off, x2: x2 + nx * off, y2: y2 + ny * off };
        const grp = el("g", {}, gE);
        el("title", {}, grp).textContent = `${types.get(t).join("・")}（${TYPE[t].name}）`;
        el("line", { ...pts, class: `edge ${t} base` }, grp);
        if (t === "train" || t === "subway") el("line", { ...pts, class: `edge ${t} tie` }, grp);
      });
    }
    STATIONS.forEach(([name, x, y, dx, dy, anchor], i) => {
      // ボードゲーム風の駅マーク：上半分を使える交通手段の色で塗り分け、番号を入れる
      const R = 15;
      if (ADJ[i].some(e => e.type === "ferry")) el("circle", { cx: x, cy: y, r: R + 4.5, class: "stn-pier" }, gS);
      el("circle", { cx: x, cy: y, r: R, class: "stn" }, gS);
      const ts = DET_TYPES.filter(t => ADJ[i].some(e => e.type === t));
      ts.forEach((t, k) => {
        const a0 = Math.PI + Math.PI * k / ts.length, a1 = Math.PI + Math.PI * (k + 1) / ts.length;
        const pa = `M${x},${y} L${(x + R * Math.cos(a0)).toFixed(2)},${(y + R * Math.sin(a0)).toFixed(2)} A${R},${R} 0 0 1 ${(x + R * Math.cos(a1)).toFixed(2)},${(y + R * Math.sin(a1)).toFixed(2)} Z`;
        el("path", { d: pa, class: "wedge " + t }, gS);
      });
      el("circle", { cx: x, cy: y, r: R, class: "stn-rim" }, gS);
      el("text", { x, y: y + 11, class: "stn-num" }, gS).textContent = i + 1;
      el("text", { x: x + dx, y: y + dy, "text-anchor": anchor, class: "stn-label", "dominant-baseline": "middle" }, gL).textContent = name;
      const hit = el("circle", { cx: x, cy: y, r: 30, class: "stn-hit" }, gH);
      hit.addEventListener("click", () => onStation(i));
    });
  }

  function buildLegend() {
    const sw = t => `<svg class="sw" viewBox="0 0 38 12" aria-hidden="true"><line x1="3" y1="6" x2="35" y2="6" class="edge ${t} base"></line>${t === "train" || t === "subway" ? `<line x1="3" y1="6" x2="35" y2="6" class="edge ${t} tie"></line>` : ""}</svg>`;
    $("legend").innerHTML =
      `<span>${sw("train")}タクシー</span><span>${sw("subway")}地下鉄</span><span>${sw("bus")}バス</span><span>${sw("ferry")}テムズ川ボート（黒チケットのみ）</span>` +
      `<span>${face("x")}怪盗X</span><span>${face("d", 0)}${face("d", 1)}${face("d", 2)}${face("d", 3)}刑事</span>`;
    $("brandChars").innerHTML = face("x") + face("d", 0);
  }

  function render() {
    renderHeader();
    renderMapState();
    renderTurn();
    renderBoard();
    renderFeed();
    if (A.mode === "local") renderOverlay();
  }

  function renderHeader() {
    const G = A.G;
    $("roundNo").textContent = G ? String(G.xLog.length).padStart(2, "0") + "/" + MAX_MOVES : "--/" + MAX_MOVES;
    const nx = G ? REVEAL.find(r => r > G.xLog.length) : undefined;
    $("nextReveal").textContent = !G ? "次の出現 --" : G.over ? "ゲーム終了" : nx === undefined ? "出現なし" : `次の出現 ${nx}手目`;
    const hb = $("hintBtn");
    hb.hidden = !G || iAmX();
    hb.setAttribute("aria-pressed", String(A.hints));
    $("tabChat").hidden = A.mode !== "online";
    if (A.mode !== "online" && A.tab === "chat") A.tab = "log";
    $("tabLog").setAttribute("aria-selected", String(A.tab === "log"));
    $("tabChat").setAttribute("aria-selected", String(A.tab === "chat"));
    $("chatForm").hidden = A.tab !== "chat";
  }

  function xVisiblePos() {
    const G = A.G;
    if (!G) return null;
    if (iAmX() && A.sec) return A.sec.pos;
    if (G.over && G.xPath) return G.xPath[G.xPath.length - 1];
    return null;
  }

  function renderMapState() {
    const gP = $("gPoss"), gT = $("gTokens"), gD = $("gDest"), gTr = $("gTrail");
    gP.replaceChildren(); gT.replaceChildren(); gD.replaceChildren(); gTr.replaceChildren();
    const hitEls = document.querySelectorAll(".stn-hit");
    hitEls.forEach(h => h.classList.remove("can"));
    const G = A.G;
    if (!G) return;
    const xPos = xVisiblePos();

    if (!iAmX() && A.hints && !G.over) {
      for (const p of G.possible) {
        const [, x, y] = STATIONS[p];
        el("circle", { cx: x, cy: y, r: 26, class: "poss" }, gP);
      }
    }
    const path = G.over ? G.xPath : (iAmX() && A.sec ? A.sec.path : null);
    if (path && path.length > 1) {
      el("polyline", { points: path.map(p => STATIONS[p][1] + "," + STATIONS[p][2]).join(" "), class: "trail", opacity: G.over ? 0.9 : 0.35 }, gTr);
    }

    if (isMyTurn()) {
      const dests = G.turn === "x" ? new Set(xMoves(G, A.sec).map(m => m.to)) : new Set(detMoves(G, G.turn).map(m => m.to));
      for (const d of dests) {
        const [, x, y] = STATIONS[d];
        el("circle", { cx: x, cy: y, r: 21, class: "dest pulse" }, gD);
        hitEls[d].classList.add("can");
      }
      if (A.pending) {
        const [, x, y] = STATIONS[A.pending.to];
        el("circle", { cx: x, cy: y, r: 21, class: "dest", style: "stroke: var(--xrim); stroke-width: 4.5" }, gD);
      }
    }

    if (xPos === null && G.lastSeen && !G.over) {
      const [, x, y] = STATIONS[G.lastSeen.pos];
      el("circle", { cx: x, cy: y, r: 24, class: "lastseen" }, gT);
      el("text", { x: x + 26, y: y - 24, class: "lastseen-label" }, gT).textContent = `X? ${G.lastSeen.n}手目`;
    }

    const stack = {};
    const place = p => { stack[p] = (stack[p] || 0) + 1; return stack[p] - 1; };
    const offset = k => [[0, 0], [22, -18], [-22, -18], [22, 18], [-22, 18]][k] || [0, 0];
    if (xPos !== null) drawToken(gT, "x", 0, xPos, offset(place(xPos)), G.turn === "x" && !G.over);
    G.det.forEach((d, k) => drawToken(gT, "d", k, d.pos, offset(place(d.pos)), G.turn === k && !G.over));
  }

  function drawToken(g, kind, k, pos, [ox, oy], active) {
    const [, sx, sy] = STATIONS[pos];
    const grp = el("g", { class: "tok", transform: `translate(${sx + ox} ${sy + oy})` }, g);
    if (active) el("circle", { r: 29, class: "ring" }, grp);
    if (kind === "x") {
      el("circle", { r: 23, class: "disc x" }, grp);
      el("use", { href: "#chr-x", x: -23, y: -23, width: 46, height: 46 }, grp);
    } else {
      el("circle", { r: 23, class: "disc", fill: DCOL[k % DCOL.length] }, grp);
      el("use", { href: "#chr-d", x: -23, y: -23, width: 46, height: 46 }, grp);
      el("circle", { cx: 17, cy: 17, r: 9, class: "num" }, grp);
      el("text", { x: 17, y: 17.5, class: "num-t" }, grp).textContent = k + 1;
    }
  }

  function turnOwnerLabel(G) {
    if (G.turn === "x") return { html: `${face("x")} 怪盗X`, who: seatLabel("x") };
    return { html: `${face("d", G.turn)} ${dName(G.turn)}`, who: seatLabel("d" + G.turn) };
  }

  function renderTurn() {
    const card = $("turnCard");
    const G = A.G;
    if (!G) {
      card.innerHTML = `<div class="label">いまの手番</div><p class="turn-help">${A.screen === "room" ? "ルームでメンバーを待っています。" : "モードを選ぶとゲームが始まります。"}</p>`;
      return;
    }
    if (G.over) {
      const iWon = iAmX() ? G.winner === "x" : (A.mode === "local" || mySeatsD().length ? G.winner === "d" : null);
      card.innerHTML = `
        <div class="label">結果</div>
        <div class="turn-title">${iWon === null ? (G.winner === "x" ? "怪盗Xの勝ち" : "刑事チームの勝ち") : iWon ? "あなたの勝ち！" : "あなたの負け…"}</div>
        <p class="turn-help">地図上の赤い点線が怪盗Xの逃走経路です。</p>
        <div class="row">${resultButtons()}</div>`;
      return;
    }
    const owner = turnOwnerLabel(G);
    if (!isMyTurn()) {
      const waitingX = G.turn === "x" && A.mode === "online" && !iAmX();
      card.innerHTML = `
        <div class="label">いまの手番</div>
        <div class="turn-title"><span class="who">${owner.html}</span><small style="color:var(--muted);font-weight:400">${esc(owner.who)}</small></div>
        <p class="turn-help">${waitingX ? "怪盗Xが逃げ道を考えています…" : owner.who === "CPU" ? "CPUが考え中…" : "相手の操作を待っています。"}</p>`;
      return;
    }
    let help = "", extra = "", chips = "";
    if (G.turn === "x") {
      const moves = xMoves(G, A.sec);
      const byDest = new Map();
      for (const m of moves) { if (!byDest.has(m.to)) byDest.set(m.to, new Set()); byDest.get(m.to).add(m.type); }
      chips = [...byDest.entries()].sort((a, b) => a[0] - b[0]).map(([to, ts]) =>
        `<button class="chip" data-act="go" data-to="${to}">${NAME(to)}<span class="dots">${[...TYPE_ORDER.filter(t => ts.has(t) || (t === "ferry" && ts.has("black") && ADJ[A.sec.pos].some(e => e.to === to && e.type === "ferry")))].map(t => `<span class="dot ${t}"></span>`).join("")}</span></button>`).join("");
      help = G.doubling ? "2倍移動の2手目です。続けてもう1駅動いてください。" : "逃げる駅を選んでください。使った切符の種類は刑事に知られます。";
      extra = `<div class="row">
        <button class="btn ghost small toggle" data-act="black" aria-pressed="${A.useBlack}" ${G.black ? "" : "disabled"}>黒チケット（残り ${G.black}）</button>
        <button class="btn ghost small toggle" data-act="double" aria-pressed="${A.useDouble}" ${canDouble(G) ? "" : "disabled"}>2倍移動（残り ${G.dbl}）</button>
      </div>`;
    } else {
      const k = G.turn;
      const moves = detMoves(G, k);
      const byDest = new Map();
      for (const m of moves) { if (!byDest.has(m.to)) byDest.set(m.to, new Set()); byDest.get(m.to).add(m.type); }
      chips = [...byDest.entries()].sort((a, b) => a[0] - b[0]).map(([to, ts]) =>
        `<button class="chip" data-act="go" data-to="${to}">${NAME(to)}<span class="dots">${DET_TYPES.filter(t => ts.has(t)).map(t => `<span class="dot ${t}"></span>`).join("")}</span></button>`).join("");
      help = "怪盗Xのいる駅に入れば逮捕。赤くにじんだ駅はXがいるかもしれない場所です。切符には限りがあります。";
    }
    if (A.pending) {
      extra += `<div class="label">${NAME(A.pending.to)} へ使う切符</div><div class="chips">` +
        A.pending.types.map(ty => `<button class="chip" data-act="via" data-type="${ty}"><span class="dot ${ty}"></span>${TYPE[ty].name}</button>`).join("") + `</div>`;
    }
    card.innerHTML = `
      <div class="label">あなたの番</div>
      <div class="turn-title"><span class="who">${owner.html}</span> を動かす</div>
      <p class="turn-help">${help}</p>
      <div class="chips">${chips}</div>
      ${extra}`;
  }

  function resultButtons() {
    if (A.mode === "local") return `<button class="btn" data-act="again">もう一度</button><button class="btn ghost" data-act="menu">メニュー</button>`;
    return iAmX()
      ? `<button class="btn" data-act="toRoom">ルームに戻る</button><button class="btn ghost" data-act="lobby">ロビーへ</button>`
      : `<button class="btn ghost" data-act="lobby">ロビーへ</button>`;
  }

  function renderBoard() {
    const G = A.G;
    const showPos = G && ((iAmX() && A.sec) || (G.over && G.xPath));
    const path = G ? (iAmX() && A.sec ? A.sec.path : G.xPath) : null;
    let html = "";
    for (let i = 0; i < MAX_MOVES; i++) {
      const e = G?.xLog[i];
      const cls = ["slot"];
      if (e) cls.push(e.t);
      if (REVEAL.includes(i + 1)) cls.push("reveal");
      if (G && !G.over && i === G.xLog.length && G.turn === "x") cls.push("now");
      let st = "";
      if (e && e.p !== null) st = NAME(e.p);
      else if (e && showPos && path) st = NAME(path[i + 1]);
      html += `<div class="${cls.join(" ")}" title="${i + 1}手目${e ? "：" + TYPE[e.t].name : ""}${st ? "（" + st + "）" : ""}">
        <span class="n">${i + 1}</span>${e?.d ? `<span class="dbl">2×</span>` : ""}
        <span>${e ? TYPE[e.t].short : REVEAL.includes(i + 1) ? "？" : ""}</span>
        ${st ? `<span class="st">${st}</span>` : ""}</div>`;
    }
    $("xlog").innerHTML = html;
    $("xinfo").innerHTML = G
      ? `${face("x")}<span>怪盗X（${esc(seatLabel("x"))}）</span><span class="tk black ${G.black ? "" : "zero"}">黒 ${G.black}</span><span class="tk double ${G.dbl ? "" : "zero"}">2× ${G.dbl}</span>`
      : `<span class="turn-help">怪盗Xの切符：黒チケット ${X_BLACK}枚・2倍移動 ${X_DOUBLE}枚（タクシー・地下鉄・バスは使い放題）</span>`;
    const dets = G ? G.det : Array.from({ length: DET_COUNT }, () => ({ t: DET_TICKETS }));
    $("dets").innerHTML = dets.map((d, k) => `
      <div class="det-row ${G && !G.over && G.turn === k ? "active" : ""}">
        ${face("d", k)}
        <span class="nm">${dName(k)} <small>${esc(G ? seatLabel("d" + k) : "")}</small></span>
        <span class="tks">${DET_TYPES.map(t => `<span class="tk ${t} ${d.t[t] ? "" : "zero"}">${TYPE[t].short} ${d.t[t]}</span>`).join("")}</span>
      </div>`).join("");
  }

  function renderFeed() {
    const f = $("feed");
    if (A.tab === "chat" && A.mode === "online") {
      f.innerHTML = NET.chat.length ? NET.chat.slice().reverse().map(c =>
        `<li class="chat"><span class="who-n" style="color:${c.uid === NET.me ? "var(--accent)" : "var(--ink)"}">${esc(c.uid === NET.me ? "あなた" : (NET.names[c.uid] || "プレイヤー"))}</span><span>${esc(c.text)}</span></li>`).join("")
        : `<li><span class="turn-help">まだメッセージはありません。</span></li>`;
      return;
    }
    f.innerHTML = A.feed.map(l =>
      `<li class="${l.hot ? "hot" : ""}"><span class="r">${String(l.n).padStart(2, "0")}手</span><span>${esc(l.text)}</span></li>`).join("");
  }

  // ---------------- オーバーレイ ----------------
  function showMenu() {
    if (A.mode === "online") leaveRoom();
    clearTimeout(timer);
    A.screen = "menu";
    renderOverlay();
    render();
  }

  function renderOverlay() {
    const ov = $("overlay");
    const G = A.G;
    if (A.screen === "menu") { ov.hidden = false; ov.innerHTML = menuHTML(); return; }
    if (A.screen === "lobby") { ov.hidden = false; ov.innerHTML = lobbyHTML(); return; }
    if (A.screen === "room") { ov.hidden = false; ov.innerHTML = roomHTML(); return; }
    if (G && G.over && A.showResult) {
      ov.hidden = false;
      const xWin = G.winner === "x";
      const reason = { escape: "最後まで逃げ切りました。", stuck: "刑事が全員、動ける切符を失いました。", caught: "刑事が怪盗Xのいる駅に踏み込みました。", trapped: "怪盗Xは四方を囲まれて動けなくなりました。" }[G.reason] || "";
      ov.innerHTML = `
        <div class="sheet" role="dialog" aria-label="結果">
          <div class="result-chars">${xWin ? face("x") : [0, 1, 2, 3].map(k => face("d", k)).join("")}</div>
          <div class="label">${G.xLog.length}手目で決着</div>
          <h2>${xWin ? "怪盗Xの逃走成功" : "怪盗X、逮捕！"}</h2>
          <p>${reason}</p>
          <div class="row">${resultButtons()}<button class="btn ghost" data-act="close">逃走経路を見る</button></div>
        </div>`;
      return;
    }
    ov.hidden = true;
  }

  function menuHTML() {
    const online = !!NET.db;
    return `
      <div class="sheet" role="dialog" aria-label="メニュー">
        <div class="label">怪盗X 対 刑事チーム</div>
        <h2>霧のロンドンに消えた怪盗Xを追え</h2>
        <ul>
          <li>怪盗X 1人 対 刑事 ${DET_COUNT}人。怪盗Xの居場所は秘密で、使った切符だけが公開されます。</li>
          <li>${REVEAL.join("・")}手目の移動後、怪盗Xが姿を現します。</li>
          <li>刑事の切符は有限（タクシー${DET_TICKETS.train}・バス${DET_TICKETS.bus}・地下鉄${DET_TICKETS.subway}）。使い切ると動けません。</li>
          <li>怪盗Xは黒チケット（手段を隠す・テムズ川のボートに乗れる）${X_BLACK}枚と、2倍移動 ${X_DOUBLE}枚を持っています。</li>
          <li>刑事が怪盗Xのいる駅に入れば逮捕。${MAX_MOVES}手逃げ切れば怪盗Xの勝ち。</li>
        </ul>
        <div class="modes">
          <div class="mode">
            <h3>ひとりで遊ぶ</h3>
            <p>CPUを相手にすぐ遊べます。</p>
            <div class="row">
              <button class="btn" data-act="local" data-role="x">怪盗Xで</button>
              <button class="btn ghost" data-act="local" data-role="d">刑事で</button>
            </div>
          </div>
          <div class="mode">
            <h3>オンライン対戦</h3>
            <p>${online ? "ルームを作って友だちと対戦。空いた刑事の席はCPUが担当します。" : "claude.ai でこのページを開き、サインインしていると使えます。"}</p>
            <div class="row"><button class="btn" data-act="lobby" ${online ? "" : "disabled"}>ロビーへ</button></div>
          </div>
        </div>
      </div>`;
  }

  function lobbyHTML() {
    const rows = NET.rooms.map(r => {
      const s = r.seats || {};
      const filled = Object.keys(s).filter(k => s[k]?.uid).length;
      const host = s.x?.uid ? (s.x.uid === NET.me ? "あなた" : (NET.names[s.x.uid] || "プレイヤー")) : "空席";
      return `<div class="room-row"><span class="code">${esc(r.code)}</span>
        <span><b>${esc(host)}</b> が怪盗X<br><small style="color:var(--muted)">参加 ${filled}/${DET_COUNT + 1}人</small></span>
        <button class="btn small" data-act="join" data-code="${esc(r.code)}">参加</button></div>`;
    }).join("");
    return `
      <div class="sheet" role="dialog" aria-label="ロビー">
        <div class="label">オンライン ロビー</div>
        <h2>ルームを選んで参加</h2>
        <div class="rooms">${rows || `<p>募集中のルームはありません。ルームを作って友だちを呼びましょう。</p>`}</div>
        <div class="row">
          <button class="btn" data-act="create" ${NET.readOnly ? "disabled" : ""}>ルームを作る（怪盗Xになる）</button>
          <button class="btn ghost" data-act="menu">戻る</button>
        </div>
        ${NET.readOnly ? `<p class="note">このページを閲覧のみの権限で開いているため、ルームを作ったり参加したりできません。</p>` : ""}
        <p class="note">友だちを誘うときは、このページの共有メニューから「編集可」で招待してください。</p>
      </div>`;
  }

  function roomHTML() {
    const r = NET.room;
    if (!r) return `<div class="sheet"><p>ルームに接続しています…</p></div>`;
    const s = r.seats || {};
    const seat = (key, label, fc) => {
      const v = s[key] || {};
      const mine = v.uid === NET.me;
      const who = v.cpu ? "CPU" : v.uid ? (mine ? "あなた" : (NET.names[v.uid] || "プレイヤー")) : "空席";
      let acts = "";
      if (!v.uid && !v.cpu) acts += `<button class="btn small" data-act="sit" data-seat="${key}">座る</button>`;
      if (mine && key !== "x") acts += `<button class="btn ghost small" data-act="stand" data-seat="${key}">席を立つ</button>`;
      if (key !== "x" && iAmX() && !v.uid) acts += `<button class="btn ghost small toggle" aria-pressed="${!!v.cpu}" data-act="cpu" data-seat="${key}">CPU</button>`;
      return `<div class="seat ${mine ? "mine" : ""}">${fc}<span class="role-n">${label}</span><span class="pl">${esc(who)}</span>${acts ? `<div class="acts">${acts}</div>` : ""}</div>`;
    };
    let seats = seat("x", "怪盗X", face("x"));
    for (let k = 0; k < DET_COUNT; k++) seats += seat("d" + k, dName(k), face("d", k));
    const canStart = iAmX();
    return `
      <div class="sheet" role="dialog" aria-label="ルーム">
        <div class="row" style="justify-content:space-between"><div class="label">ルーム</div><span class="code">${esc(r.code)}</span></div>
        <h2>メンバーを待っています</h2>
        <div class="seats">${seats}</div>
        <p class="note">${canStart ? "準備ができたら開始してください。空いている刑事の席はCPUが担当します。" : "怪盗Xの人がゲームを開始します。好きな刑事の席に座ってください（複数の席に座ってもOK）。"}</p>
        <div class="row">
          ${canStart ? `<button class="btn" data-act="start">ゲーム開始</button>` : ""}
          <button class="btn ghost" data-act="lobby">ルームを出る</button>
        </div>
      </div>`;
  }

  let toastTimer = null;
  function toast(msg) {
    pushFeed([{ n: A.G ? A.G.xLog.length : 0, text: msg, hot: true }]);
    renderFeed();
    clearTimeout(toastTimer);
  }

  // ======================================================================
  // イベント
  // ======================================================================
  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    switch (act) {
      case "local": return startLocal(b.dataset.role);
      case "again": return startLocal(A.role);
      case "menu": return showMenu();
      case "lobby": return openLobby();
      case "create": return createRoom();
      case "join": return enterRoom(b.dataset.code);
      case "sit": return sit(b.dataset.seat);
      case "stand": return standUp(b.dataset.seat);
      case "cpu": return toggleCpu(b.dataset.seat);
      case "start": return startOnline();
      case "toRoom": return backToRoom();
      case "close": A.showResult = false; renderOverlay(); return;
      case "tab": A.tab = b.dataset.tab; render(); return;
      case "go": return onStation(Number(b.dataset.to));
      case "black": A.useBlack = !A.useBlack; A.pending = null; render(); return;
      case "double": A.useDouble = !A.useDouble; render(); return;
      case "via": {
        if (!A.pending || !isMyTurn()) return;
        const { to } = A.pending, type = b.dataset.type;
        if (A.G.turn === "x") return commitX(to, type, A.useDouble && canDouble(A.G));
        return commitD(A.G.turn, to, type);
      }
    }
  });
  $("menuBtn").addEventListener("click", showMenu);
  $("hintBtn").addEventListener("click", () => { A.hints = !A.hints; render(); });
  $("chatForm").addEventListener("submit", ev => {
    ev.preventDefault();
    const inp = $("chatInput");
    sendChat(inp.value);
    inp.value = "";
  });

  function boot(data) {
    buildMap();
    buildLegend();
    if (data && data.A && data.A.mode === "local" && data.A.G) {
      Object.assign(A, data.A);
      localStep();
    } else {
      showMenu();
    }
    initNet();
  }
  try { window.claude?.hot?.snapshot?.(() => ({ A: A.mode === "local" ? A : null })); } catch (e) {}
  if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
  else boot(window.claude?.hot?.data ?? {});
})();
</script>
<!-- ARTIFACT-BODY-END -->
</body>
</html>
