<title>トーキョー・チェイス</title>
<link rel="icon" type="image/png" href="art/icons/favicon-64.png">
<link rel="apple-touch-icon" href="art/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Zen+Old+Mincho:wght@700;900&family=DotGothic16&display=swap">
<style>
  /* ボードゲームアプリ風の単一テーマ：夜のテーブルに広げた古地図 */
  :root {
    color-scheme: dark;
    --ground: #120E0A;
    --hud: rgba(22, 17, 12, 0.86);
    --hud-solid: #1C1610;
    --hud-2: #2A2118;
    --ink: #F4EAD6;
    --muted: #B9A98E;
    --rule: rgba(227, 179, 65, 0.28);
    --gold: #E3B341;
    --gold-deep: #A87A18;
    --map-ink: #3B2C1E;
    --paper: #FBF5E4;
    --taxi: #F2B51D;
    --bus: #16935B;
    --tube: #D2362C;
    --ferry: #2F7FB0;
    --heli: #7C3AED;
    --black: #0B0906;
    --xrim: #C0271F;
    --good: #5FBF7A;
    --r: 14px;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  button:disabled { cursor: not-allowed; opacity: 0.4; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  #app { position: relative; height: 100%; overflow: hidden; }
  /* 4分割の画面 */
  #app.layout4 { display: grid; gap: 6px; padding: 6px; background: #17130E;
    grid-template-columns: minmax(0, 1fr) clamp(290px, 31vw, 470px); grid-template-rows: minmax(0, 1fr) clamp(150px, 29vh, 270px);
    grid-template-areas: "map info" "cards mini"; }
  #app.layout4 #map { position: relative; inset: auto; grid-area: map; justify-self: center; align-self: center; border-radius: 10px; cursor: default; }
  #mapCell { grid-area: map; min-width: 0; min-height: 0; }
  .pane { position: relative; z-index: 1; min-width: 0; min-height: 0; overflow: hidden; background: var(--hud-solid); border: 1px solid var(--rule); border-radius: 10px; }
  .pane.info { grid-area: info; display: flex; flex-direction: column; gap: 6px; padding: 6px; }
  .pane.cards { grid-area: cards; display: flex; gap: 8px; padding: 6px; }
  .pane.mini { grid-area: mini; display: flex; flex-direction: column; }
  #paneInfo .hud.top { position: static; transform: none; pointer-events: auto; flex: none; }
  #paneInfo .toprow.second, #paneInfo .pulltab, .hud.side, #overviewBtn { display: none !important; }
  #paneInfo .toprow.first { flex-wrap: wrap; }
  #paneInfo .toprow.first .xcard { flex: 1 1 0; min-width: 0; }
  #paneInfo .toprow.first .prompt { flex: 1 1 100%; max-width: none; order: 3; }
  #paneInfo .toprow.first .dets { flex: 1 1 100%; margin-left: 0; order: 4; }
  #paneInfo .drawer { position: static; width: auto; max-height: none; flex: 1; min-height: 0; padding: 6px 8px; box-shadow: none; }
  #paneInfo .drawer .row { display: flex; justify-content: space-between; align-items: center; }
  .hint-btn { min-height: 30px !important; padding: 0 10px !important; font-size: 12px !important; flex: 0 0 auto !important; width: auto !important; }
  .mini-h { white-space: nowrap; }
  #app.layout4 #edge { grid-area: map; position: relative; inset: auto; justify-self: center; align-self: center; width: var(--mw); height: var(--mh); }
  .hint-btn[aria-pressed="false"] { opacity: .55; }
  #paneCards .handbar { position: static; max-width: none; flex: 0 1 auto; min-width: 0; zoom: 1; }
  #paneCards .handbar[hidden] { display: none; }
  .talklog { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #FFF6D8; color: #3A2C1E; border-radius: 8px; padding: 6px 8px; }
  .talklog .tl-h { font-weight: 900; font-size: 12px; color: #8A6A2A; }
  .talklog ul { list-style: none; margin: 4px 0 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
  .talklog li { display: flex; gap: 6px; align-items: center; }
  .talklog li .portrait { width: 24px; height: 24px; flex: none; }
  .talklog li b { margin-right: 4px; }
  .talklog li.empty { color: #9A8A70; }
  .mini-h { font-size: 12px; font-weight: 900; padding: 4px 8px 0; display: flex; gap: 8px; align-items: baseline; }
  .mini-h span { font-weight: 400; font-size: 10px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #mini { flex: 1; min-height: 0; width: 100%; display: block; cursor: pointer; }
  #mini use { --lbl: hidden; }
  .stn-label, #gTalk { visibility: var(--lbl, visible); }
  .mini-view { fill: none; stroke-width: 8; opacity: .55; }
  .mini-me { fill: rgba(255, 230, 120, .15); stroke: #F2C230; stroke-width: 16; }
  .view-shade { fill: rgba(20, 16, 30, .38); pointer-events: none; }
  .view-frame { fill: none; stroke: #F2C230; stroke-width: 4; stroke-dasharray: 16 10; pointer-events: none; }
  .heli-sprite { image-rendering: pixelated; }
  @media (min-width: 761px) and (min-height: 521px) {
    #app.layout4 { --colR: clamp(330px, 36vw, 580px); --rowB: clamp(170px, 32vh, 330px);
      grid-template-columns: minmax(0, 1fr) var(--colR); grid-template-rows: minmax(0, 1fr) var(--rowB); }
    #app.mini-big #paneMini { width: min(calc(2 * var(--colR)), calc(100% - 12px)) !important; height: min(calc(2 * var(--rowB)), calc(100% - 12px)) !important; }
    #paneCards { transition: padding-right .3s ease; }
    #app.mini-big #paneCards { padding-right: calc(min(2 * var(--colR), 100vw - 24px) - var(--colR) + 6px); }
  }
  .mini-dest { fill: rgba(242, 194, 48, .35); stroke: #F2C230; stroke-width: 14; }
  .mini-dest.tgt { fill: rgba(229, 72, 77, .3); stroke: #E5484D; }
  /* 左下：手札を大きなカードで並べ、無線は右端に小さく */
  #paneCards .handbar { flex: 1 1 auto; display: flex; flex-direction: column; padding: 6px 8px; overflow: hidden; }
  #paneCards .hb-cards { flex: 1; min-height: 0; gap: 10px; align-items: stretch; overflow-x: auto; overflow-y: hidden; }
  #paneCards .hb-card { width: auto; height: 100%; aspect-ratio: 5 / 7; padding: 6px; gap: 4px; justify-content: flex-start; background: #FBF7EA; color: #4F6475;
    border: 3px solid #2F5FB8; border-radius: 10px; box-shadow: inset 0 0 0 2px #FBF7EA, inset 0 0 0 3px rgba(47,95,184,.35), 0 3px 0 rgba(0,0,0,.35); }
  #paneCards .hb-card.x { border-color: #C2464F; }
  #paneCards .hb-card.heli { border-color: #7C3AED; }
  #paneCards .hb-card img { width: 100%; image-rendering: pixelated; border: 2px solid #4F6475; border-radius: 3px; }
  #paneCards .hb-card.heli .hb-heli { background: #CFE3F5; border: 2px solid #4F6475; border-radius: 3px; position: relative; }
  #paneCards .hb-card.heli .hb-heli img { width: 100%; border: 0; }
  #paneCards .hb-card.heli .hb-heli b { position: absolute; right: 4px; bottom: 2px; font-size: 16px; color: #fff; text-shadow: 1px 1px 0 #3B2C6E, -1px -1px 0 #3B2C6E; }
  #paneCards .hb-card span { font-family: "DotGothic16", sans-serif; font-weight: 400; font-size: clamp(12px, 1.6vh, 17px); color: #4F6475; white-space: normal; }
  #paneCards .hb-card small { font-size: clamp(9px, 1.25vh, 12px); line-height: 1.35; color: #5A4A40; text-align: left; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; }
  #paneCards .hb-card.heli.off { opacity: .75; }
  #paneCards .talklog { flex: 0 0 clamp(150px, 22%, 250px); }
  #paneCards .talklog ul { font-size: 11px; }
  #paneCards .hb-empty { align-self: center; }
  /* 全体図の拡大：右下から左上へ約2倍に広げる */
  .mini-zoom { margin-left: auto; flex: none; font: inherit; font-size: 11px; font-weight: 900; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--rule); background: #E3B341; color: #1A140C; cursor: pointer; }
  .mini-h { align-items: center; }
  #app.mini-big #paneMini { grid-area: auto; position: absolute; right: 6px; bottom: 6px; z-index: 19 !important; box-shadow: 0 10px 40px rgba(0,0,0,.6);
    width: min(calc(2 * clamp(290px, 31vw, 470px)), calc(100% - 12px)); height: min(calc(2 * clamp(150px, 29vh, 270px)), calc(100% - 12px)); }
  @media (max-width: 760px) and (orientation: portrait) {
    #app.mini-big #paneMini { width: calc(100% - 8px); height: 55%; right: 4px; bottom: 4px; }
    #paneCards .hb-card { height: auto; width: 88px; aspect-ratio: auto; }
    #paneCards .talklog { flex: 1 1 auto; }
  }
  @media (max-height: 520px) and (orientation: landscape) { #app.mini-big #paneMini { height: calc(100% - 12px); } }
  @media (max-width: 760px) and (orientation: portrait) {
    #app.layout4 { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 46fr) minmax(0, 24fr) minmax(0, 30fr);
      grid-template-areas: "map map" "mini info" "cards info"; gap: 4px; padding: 4px; }
    .pane.cards { flex-direction: column; }
    #paneInfo .dets { zoom: .8; }
  }
  @media (max-height: 520px) and (orientation: landscape) {
    #app.layout4 { grid-template-rows: minmax(0, 1fr) 118px; grid-template-columns: minmax(0, 1fr) clamp(240px, 30vw, 360px); }
    #paneInfo .hud.top, #paneCards .handbar { zoom: .7; }
  }

  /* ---------------- 盤面 ---------------- */
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: #B9B9B4; cursor: grab; }
  #bgimg { image-rendering: pixelated; image-rendering: crisp-edges; }
  .ln { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .gap { stroke: #C6C6C1; }
  .taxi-ln { stroke: #D9A11A; }
  .bus-ln { stroke: var(--bus); }
  .bus-dash { stroke: #DDF3E4; stroke-width: 2.5; stroke-dasharray: 10 10; }
  .tube-ln { stroke: var(--tube); }
  .tube-dash { stroke: #F6D2D0; stroke-width: 4; stroke-dasharray: 12 8; }
  .deck { fill: #C6C6C1; stroke: none; }
  .deck-rail { fill: none; stroke: #4A4A46; stroke-width: 5; stroke-linecap: square; }
  .hport { fill: #2E2E2E; stroke: #FFFFFF; stroke-width: 4; }
  .hport-ring { fill: none; stroke: #F2C230; stroke-width: 3; }
  .hport-h { font-family: "DotGothic16", sans-serif; font-size: 20px; fill: #FFFFFF; text-anchor: middle; pointer-events: none; }
  .st-shadow { fill: rgba(0, 0, 0, 0.28); }
  .st-side { fill: #9A9A96; stroke: #2E2E2E; stroke-width: 2.5; }
  .st-side.sub { fill: #6E1520; }
  .st-top { fill: #FAFAF7; stroke: #2E2E2E; stroke-width: 2.5; }
  .st-top.sub { fill: #C3242F; }
  .st-hi { fill: rgba(255, 255, 255, 0.7); }
  .st-tag { stroke: #1C1C1C; stroke-width: 1.5; }
  .st-tag.bus { fill: #1F8A4C; }
  .st-tag.boat { fill: #2F7FB0; }
  .stn-num.on-sub { fill: #FFFFFF; }
  #map.dragging { cursor: grabbing; }
  .edge { fill: none; stroke-linecap: round; }
  .edge.taxi { stroke: var(--taxi); stroke-width: 6; }
  .edge.taxi.casing { stroke: #7A5A0E; stroke-width: 9; opacity: 0.55; }
  .edge.bus { stroke: var(--bus); stroke-width: 10; }
  .edge.bus.casing { stroke: #0B4F31; stroke-width: 13; opacity: 0.5; }
  .edge.tube { stroke: var(--tube); stroke-width: 13; }
  .edge.tube.casing { stroke: #6E1510; stroke-width: 16; opacity: 0.55; }
  .edge.tube.dash { stroke: #FFE9E3; stroke-width: 3.5; stroke-dasharray: 12 12; stroke-linecap: butt; }
  .edge.boat { stroke: var(--ferry); stroke-width: 7; stroke-dasharray: 18 10; }
  .edge.boat.casing { stroke: #FBF5E4; stroke-width: 11; stroke-dasharray: none; opacity: 0.8; }
  .wedge.boat { fill: var(--ferry); }
  .helipad { fill: rgba(124, 58, 237, 0.16); stroke: var(--heli); stroke-width: 4; stroke-dasharray: 10 6; }
  .heli-h { font-family: Georgia, serif; font-weight: 700; font-size: 26px; fill: #fff; paint-order: stroke; stroke: var(--heli); stroke-width: 9px; stroke-linejoin: round; text-anchor: middle; pointer-events: none; }
  .bridge-pt { fill: #CDB98C; stroke: #3B2C1E; stroke-width: 3; }
  .dud-x { stroke: #E5484D; stroke-width: 7; stroke-linecap: round; }
  .dud-label { font-weight: 900; font-size: 19px; fill: #fff; paint-order: stroke; stroke: #E5484D; stroke-width: 7px; stroke-linejoin: round; text-anchor: middle; }
  .pawn-num { font-weight: 900; font-size: 15px; fill: #fff; text-anchor: middle; paint-order: stroke; stroke: rgba(0,0,0,0.55); stroke-width: 3px; }
  .tok .ring { fill: none; stroke: #FFF6D8; stroke-width: 5; }
  .stn-base { fill: var(--paper); }
  .stn-rim { fill: none; stroke: var(--map-ink); stroke-width: 3; }
  .wedge.taxi { fill: var(--taxi); }
  .wedge.bus { fill: var(--bus); }
  .wedge.tube { fill: var(--tube); }
  .stn-num { font-family: "DotGothic16", "Zen Kaku Gothic New", sans-serif; font-weight: 400; font-size: 16px; fill: #1C1C1C; text-anchor: middle; pointer-events: none; }
  .stn-label {
    font-family: "DotGothic16", "Zen Kaku Gothic New", sans-serif; font-weight: 400; font-size: 21px; fill: #141414;
    paint-order: stroke; stroke: #F4F4F0; stroke-width: 6px; stroke-linejoin: miter;
    text-anchor: middle; pointer-events: none;
  }
  #map.z0 .stn-label { display: none; }
  #map.z1 .stn-label:not(.hot) { display: inline; }
  #map.z0 .stn-label.hot { display: inline; font-size: 24px; stroke-width: 8px; }
  .dest { fill: rgba(255, 244, 200, 0.35); stroke: #FFF6D8; stroke-width: 5; }
  .dest-outer { fill: none; stroke: var(--map-ink); stroke-width: 3; }
  .dest.pulse, .dest-outer.pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .sel { fill: none; stroke: var(--xrim); stroke-width: 6; }
  .poss { fill: var(--xrim); opacity: 0.28; }
  .sight { fill: rgba(80, 140, 255, 0.07); stroke: rgba(60, 110, 230, 0.55); stroke-width: 4; stroke-dasharray: 16 12; }
  .lastseen { fill: none; stroke: var(--xrim); stroke-width: 4; stroke-dasharray: 8 6; }
  .lastseen-label { font-weight: 900; font-size: 20px; fill: var(--xrim); paint-order: stroke; stroke: var(--paper); stroke-width: 6px; text-anchor: middle; }
  .trail { fill: none; stroke: var(--xrim); stroke-width: 6; stroke-dasharray: 14 9; opacity: 0.9; }
  .tok { transition: transform 0.55s cubic-bezier(.3,.7,.2,1); pointer-events: none; }

  @media (prefers-reduced-motion: reduce) { .tok { transition: none; } .dest.pulse, .dest-outer.pulse { animation: none; } }

  /* ---------------- HUD ---------------- */
  .hud { position: absolute; z-index: 5; }
  .panel {
    background: var(--hud);
    border: 1px solid var(--rule);
    border-radius: var(--r);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
  }
  .top { top: 10px; left: 10px; right: 10px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; transition: transform .3s ease; }
  /* 携帯：画面上部のUIをプルタブで隠せる */
  .pulltab { display: none; }
  @media (max-width: 760px) {
    .pulltab { display: flex; align-items: center; gap: 6px; position: absolute; left: 50%; bottom: -30px; transform: translateX(-50%); pointer-events: auto;
      height: 26px; padding: 0 14px; border-radius: 0 0 12px 12px; border: 1px solid var(--rule); border-top: none; background: var(--hud-solid); color: #F4ECDC; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 14px rgba(0,0,0,.35); }
    .pt-arrow { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 7px solid currentColor; }
    .pt-t { display: none; max-width: 52vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    body.hud-hidden .top { transform: translateY(calc(-100% - 12px)); }
    body.hud-hidden .pt-arrow { border-bottom: none; border-top: 7px solid currentColor; }
    body.hud-hidden .pt-t { display: inline; }
    body.hud-hidden .pulltab { bottom: -34px; height: 30px; }
  }
  @media (prefers-reduced-motion: reduce) { .top { transition: none; } }
  @media (max-height: 520px) and (orientation: landscape) { .hud.top, .hud.side, .handbar { zoom: 0.62; } }
  /* 携帯：画面の端の駒アイコンを小さく・半透明にして、下の駅を見やすく */
  @media (max-width: 760px), (max-height: 520px) { .edge-arrow { opacity: 0.82; } .edge-arrow:active { opacity: 1; } .edge-arrow svg.dir { transform: scale(0.72); } .edge-arrow .portrait, .edge-arrow .portrait img { width: 27px !important; height: 27px !important; } .edge-arrow .ea-d { font-size: 9px; bottom: -6px; padding: 0 4px; } }
  @media (max-width: 760px) { .hud.side, .handbar { zoom: 0.8; } }
  .toprow { display: flex; gap: 8px; align-items: stretch; }
  .toprow > * { pointer-events: auto; }
  .toprow.second .xlog { flex: 1; min-width: 0; }
  .toprow.first .dets { margin-left: auto; }
  .toprow.first .prompt { max-width: none; }
  .tk { white-space: nowrap; }
  @media (max-width: 760px) { .toprow.first .prompt { flex: none; max-width: 40%; } .toprow.first .prompt .portrait { display: none; } .toprow.first .xcard { min-width: 0; } .xcard .nx { display: none; } }
  @media (max-height: 520px) and (orientation: landscape) { .side { top: auto; bottom: 8px; transform: none; gap: 2px; padding: 4px; } }
  .iconbtn {
    width: 46px; min-height: 46px; display: grid; place-items: center; border-radius: 12px;
  }
  .iconbtn svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .xcard { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; min-width: 0; }
  .xcard .who { display: flex; flex-direction: column; min-width: 0; }
  .xcard b { font-size: 15px; line-height: 1.2; }
  .xcard small { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .expo { display: inline-flex; align-items: center; gap: 5px; margin-top: 3px; padding: 2px 8px 2px 6px; border-radius: 999px; font-size: 11px; font-weight: 900; white-space: nowrap; }
  .expo i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .expo.found { background: rgba(229, 72, 77, 0.2); color: #FF6B6B; animation: blink 1s ease-in-out infinite; }
  .expo.near { background: rgba(242, 153, 58, 0.2); color: #F5A524; }
  .expo.lost { background: rgba(95, 191, 122, 0.18); color: #6FD08C; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .bubble { pointer-events: none; transform-box: fill-box; transform-origin: 50% 100%; }
  .bubble.pop { animation: pop 0.35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .bubble .bb { stroke: #3B2C1E; stroke-width: 2.5; }
  .bubble.q .bb { fill: #FBF5E4; }
  .bubble.ex .bb { fill: #E5484D; }
  .bubble text { font-family: Georgia, serif; font-weight: 900; font-size: 30px; text-anchor: middle; }
  .bubble.q text { fill: #3B2C1E; }
  .bubble.ex text { fill: #fff; }
  @media (prefers-reduced-motion: reduce) { .bubble.pop, .expo.found { animation: none; } }
  .xcard .chipsx { display: flex; gap: 4px; margin-top: 2px; }
  .portrait { width: 46px; height: 46px; border-radius: 50%; flex: none; display: block; overflow: visible; }
  .portrait.sm { width: 36px; height: 36px; }
  .portrait.lg { width: 84px; height: 84px; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; background: rgba(192,39,31,0.28); }
  .portrait.p-d img { background: rgba(255,255,255,0.12); }
  .thief-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .thief-pick button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: inherit; font: inherit; cursor: pointer; }
  .thief-pick button[aria-pressed="true"] { border-color: #E3B341; background: rgba(227,179,65,0.16); }

  const DET_TICKETS = { heli: 0 };
  const X_TICKETS = { taxi: 22, bus: 15, tube: 7, boat: 5, mono: 6 };
  const dHas = (d, type) => type === "boat" ? false : type === "heli" ? d.t.heli > 0 : true;
  const xHas = (G, type) => type === "black" ? G.black > 0 : type === "heli" ? G.heli > 0 : !G.xt || G.xt[type] > 0;
  const X_DOUBLE = 5;
  const X_BLACK = 10;    // 黒チケットの枚数（水上バスにもこれで乗る）
  // 相棒：怪盗Xが相棒と同じ駅に着いたら逃走成功。相棒は誰からも見え、刑事が踏むと確保される
  const MATE_MIN = 9;     // 怪盗Xとの最初の距離（手数）
  const MATE_FROM = 5;    // 相棒はこの手目の移動のあとに現れる
  const MATE_EVERY = 1;   // 相棒は何手ごとに1駅動くか
  const X_HELI = 99;   // 怪盗Xはヘリをいつでも使える
  const DEFAULT_DETS = 4;

  // 区間ごとの交通手段
  const edgeTypes = new Map(); // "a-b" -> Map(type -> 路線名[])
  function addEdge(a, b, type, line) {
    if (a === b) return;
    const key = a < b ? a + "-" + b : b + "-" + a;
    if (!edgeTypes.has(key)) edgeTypes.set(key, new Map());
    const m = edgeTypes.get(key);
    if (!m.has(type)) m.set(type, []);
    if (line && !m.get(type).includes(line)) m.get(type).push(line);
  }
  for (const [a, b] of TAXI) addEdge(a, b, "taxi", "タクシー");
  for (const [line, seq] of TUBE) for (let k = 0; k < seq.length - 1; k++) addEdge(seq[k], seq[k + 1], "tube", line);
  BUS.forEach((seq, r) => { for (let k = 0; k < seq.length - 1; k++) addEdge(seq[k], seq[k + 1], "bus", `バス ${r + 1}番`); });
  for (const [line, seq] of BOATS) for (let k = 0; k < seq.length - 1; k++) addEdge(seq[k], seq[k + 1], "boat", line);
  for (const [a, b] of MONO) addEdge(a, b, "mono", "モノレール");

  const ADJ = Array.from({ length: N }, () => []);
  for (const [key, types] of edgeTypes) {
    const [a, b] = key.split("-").map(Number);
    for (const t of types.keys()) { ADJ[a].push({ to: b, type: t }); ADJ[b].push({ to: a, type: t }); }
  }
  // ヘリを除いた最短手数
  const D = Array.from({ length: N }, (_, s) => {
    const d = new Array(N).fill(Infinity);
    d[s] = 0;
    const q = [s];
    while (q.length) {
      const u = q.shift();
      for (const e of ADJ[u]) if (d[e.to] === Infinity) { d[e.to] = d[u] + 1; q.push(e.to); }
    }
    return d;
  });
  const dd = (a, b) => Math.min(D[a][b], 9);

  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  const clone = o => JSON.parse(JSON.stringify(o));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function newGame(detCount, withMate = true) {
    const ids = shuffle([...Array(N).keys()]).filter(p => !ISLAND_ST.has(p));
    const det = [];
    for (const p of ids) {
      if (det.length >= detCount) break;
      if (det.every(d => D[p][d.pos] >= 3)) det.push({ pos: p, t: { ...DET_TICKETS } });
    }
    const startable = ids.filter(p => det.every(d => D[p][d.pos] >= 2));
    const xStart = startable[0];
    // 相棒は MATE_FROM 手目に現れる（それまでは G.mate は null）
    const mate = null;
    const G = {
      seq: 1, turn: "x", det, xLog: [], xt: { ...X_TICKETS }, black: X_BLACK, dbl: X_DOUBLE, heli: X_HELI, doubling: false,
      // ガス欠のヘリポート（誰にも知らされない）。飛ぼうとして初めてわかる
      dud: pick(HELI), dudFound: false, mate, withMate,
      possible: startable.slice().sort((a, b) => a - b), lastSeen: null,
      over: false, winner: null, reason: "",
    };
    return { G, sec: { pos: xStart, path: [xStart], dudKnown: false } };
  }

  // 怪盗Xの手：{to, type}。ヘリは to = -1（着陸地点はランダム）
  // 封鎖・破壊された駅（until 手目になるまで入れない）
  // 破壊された駅（G.ruin）は最後まで誰も通れない。封鎖は期限つき
  const isRuin = (G, st) => !!G.ruin && G.ruin.includes(st);
  const heliBanned = G => G.heliBan !== undefined && G.xLog.length < G.heliBan;
  const isClosed = (map, st, G) => isRuin(G, st) || (!!map && map[st] !== undefined && G.xLog.length < map[st]);

  function xMoves(G, sec) {
    const occ = new Set(G.det.map(d => d.pos));
    const out = [], blackTo = new Set();
    for (const e of ADJ[sec.pos]) {
      if (occ.has(e.to) || isClosed(G.closedX, e.to, G)) continue;
      if (xHas(G, e.type)) out.push({ to: e.to, type: e.type });
      if (G.black > 0 && !blackTo.has(e.to)) { blackTo.add(e.to); out.push({ to: e.to, type: "black" }); }
    }
    const xKnowsDud = (sec.dudKnown || G.dudFound) && sec.pos === G.dud;
    if (G.heli > 0 && HELI_SET.has(sec.pos) && !xKnowsDud && !heliBanned(G) && heliTargets(G, sec.pos, true).length) out.push({ to: -1, type: "heli" });
    return out;
  }
  function heliTargets(G, from, forX, k = -1) {
    // 怪盗Xは刑事のいるヘリポートには降りない。刑事どうしは重なってよい
    const occ = new Set(forX ? G.det.map(d => d.pos) : []);
    return HELI.filter(h => h !== from && !occ.has(h) && !isClosed(forX ? G.closedX : G.closedD, h, G));
  }
  const canDouble = G => G.dbl > 0 && !G.doubling && G.xLog.length <= MAX_MOVES - 2;

  function nextPossible(G, type) {
    const occ = new Set(G.det.map(d => d.pos));
    if (type === "heli") return HELI.filter(h => !occ.has(h) && !isClosed(G.closedX, h, G) && !inSight(G, h));
    if (type === "pass") return G.possible.filter(p => !occ.has(p) && !inSight(G, p));
    const nx = new Set();
    for (const s of G.possible) for (const e of ADJ[s]) {
      if ((type === "black" || e.type === type) && !occ.has(e.to) && !isClosed(G.closedX, e.to, G) && !inSight(G, e.to)) nx.add(e.to);
    }
    return [...nx].sort((a, b) => a - b);
  }

  function applyX(G, sec, to, type, useDouble) {
    if (type === "pass") to = sec.pos;   // パス：その場にとどまる（切符は使わない）
    if (type === "heli") {
      G.heli--;
      if (sec.pos === G.dud) { to = sec.pos; sec.dudKnown = true; }   // ガス欠：その場から動けない
      else to = pick(heliTargets(G, sec.pos, true));
    }
    const from = sec.pos;
    sec.pos = to;
    sec.path.push(to);
    const n = G.xLog.length + 1;
    const mateOut = !!G.mate && !!G.mate.out;   // 相棒を確保されたら、もう隠れられない
    let rev = REVEAL.includes(n) || inSight(G, to) || mateOut, vanished = false;
    if (rev && G.skipReveal > 0) { G.skipReveal--; rev = false; vanished = true; }   // 雲隠れ
    if (rev && G.disguise >= n && !REVEAL.includes(n)) rev = false;   // 変装
    const wit = G.det.findIndex(d => inView(d, from) || inView(d, to));
    const known = type === "pass" || wit >= 0 || mateOut;
    G.xLog.push({ t: type, p: rev ? to : null, d: useDouble ? 1 : (G.doubling ? 2 : 0), v: vanished ? 1 : 0, k: known ? 1 : 0, w: wit });
    if (type === "black") G.black--;
    else if (G.xt && G.xt[type] !== undefined) G.xt[type]--;
    G.possible = rev ? [to] : nextPossible(G, known ? type : "black");
    // 雲隠れで視界の中に隠れたときなどに候補が空になったら、視界の外のどこか、に戻す
    if (!G.possible.length) G.possible = [...Array(N).keys()].filter(p => !inSight(G, p) && !G.det.some(d => d.pos === p) && !isRuin(G, p));
    if (rev) G.lastSeen = { pos: to, n };
    // 警察犬の駒は、怪盗Xが1手動くたびに足跡を1駅たどる（2手遅れでついていく）
    if (G.dog && !G.dog.gone) {
      if (n > G.dog.until) G.dog.gone = true;
      else {
        G.dog.i = Math.min(G.dog.i + 1, sec.path.length - 1);
        G.dog.pos = sec.path[G.dog.i];
        if (!(G.seen || []).some(e => e.n === G.dog.i)) G.seen = [...(G.seen || []), { n: G.dog.i, pos: G.dog.pos, dog: true }].sort((a, b) => a.n - b.n);
        if (!rev) G.possible = dogReplay(G, sec, G.dog.i);
      }
    }
    if (mateActive(G) && to === G.mate.pos) { finish(G, "x", "meet"); return to; }
    if (G.withMate !== false && !G.mate && G.xLog.length >= MATE_FROM) spawnMate(G, sec);
    if (useDouble) { G.dbl--; G.doubling = true; }
    else { G.doubling = false; mateStep(G, sec); if (!G.over) G.turn = 0; }
    G.seq++;
    return to;
  }
  const mateActive = G => !!G.mate && !G.mate.out;
  // 相棒の登場：怪盗Xから MATE_MIN 手以上、刑事から3手以上離れた駅（島・破壊駅は除く）
  function spawnMate(G, sec) {
    const occ = G.det.map(d => d.pos);
    const ok = p => p !== sec.pos && !ISLAND_ST.has(p) && !isRuin(G, p) && occ.every(o => o !== p);
    let cands = shuffle([...Array(N).keys()]).filter(p => ok(p) && D[sec.pos][p] >= MATE_MIN && occ.every(o => D[p][o] >= 5));
    if (!cands.length) cands = [...Array(N).keys()].filter(ok).sort((a, b) => D[sec.pos][b] - D[sec.pos][a]).slice(0, 5);
    const pos = cands[0];
    G.mate = { pos, path: [pos], out: false, since: G.xLog.length };
  }
  // 相棒の移動：怪盗Xの本当の居場所へ向かう（刑事の隣はなるべく避ける）
  function mateStep(G, sec) {
    if (!mateActive(G) || G.over || G.xLog.length === G.mate.since || G.xLog.length % MATE_EVERY !== 0) return;
    const m = G.mate, occ = new Set(G.det.map(d => d.pos));
    const risk = q => G.det.some(d => D[d.pos][q] <= 1) ? 3 : 0;
    const opts = [...new Set(ADJ[m.pos].map(e => e.to))].filter(q => !occ.has(q) && !isClosed(G.closedX, q, G));
    let best = m.pos, bs = D[m.pos][sec.pos] * 2 + risk(m.pos);
    for (const q of opts) { const v = D[q][sec.pos] * 2 + risk(q); if (v < bs) { bs = v; best = q; } }
    if (best === m.pos) return;
    m.pos = best;
    m.path.push(best);
    if (best === sec.pos) finish(G, "x", "meet");
  }

  function detMoves(G, k) {
    const d = G.det[k];
    // 刑事どうしは同じ駅に重なってもよい
    const out = ADJ[d.pos].filter(e => dHas(d, e.type) && !isClosed(G.closedD, e.to, G));
    if (d.t.heli > 0 && HELI_SET.has(d.pos) && !heliBanned(G) && !(G.dudFound && d.pos === G.dud) && heliTargets(G, d.pos, false, k).length) out.push({ to: -1, type: "heli" });
    return out;
  }
  const allStuck = G => G.det.every((_, k) => detMoves(G, k).length === 0);

  // ---------------- カード（5・10・17手目に両陣営が1枚引く。ハズレなし） ----------------
  const CARD_TURNS = [5, 12, 20];
  const CARD_LAST = 28;   // 手札のカードは28手目まで好きな時に使える
  const CARD = {
    bridge:    { side: "d", name: "橋封鎖", desc: "橋を1つ選んで封鎖する。4手のあいだ怪盗Xは通れない。" },
    rcheck:    { side: "d", name: "ランダム検問", desc: "引いたその場で発動。ヘリポート以外のどこかの駅に検問所が敷かれ、6手のあいだ怪盗Xはその駅を通れない。" },
    checkpoint:{ side: "d", name: "検問", desc: "いま自分がいる駅に検問所を置く。6手のあいだ怪盗Xはその駅を通れない。" },
    dash:      { side: "d", name: "ダッシュ", desc: "使った刑事は、この番に2回続けて動ける（1駅進んだあと、もう1駅）。" },
    heliban:   { side: "d", name: "ヘリ封鎖", desc: "引いたその場で発動。すべてのヘリポートを5手のあいだ閉鎖し、誰もヘリで飛べない。" },
    dog:       { side: "d", name: "警察犬", desc: "怪盗Xの足跡をかぎ分ける。2手前と3手前にいた駅がわかり、今いそうな駅を絞り込む。警察犬の駒はその後3手のあいだ足跡を追い続ける。" },
    reinforce: { side: "d", name: "ヘリ出動", desc: "刑事全員にヘリの切符が1枚ずつ追加される。ヘリポートの駅から、ほかのヘリポートのどこかへ飛べる。" },
    smoke:     { side: "x", name: "煙幕", desc: "煙幕をはる。刑事全員が1回休みになる。" },
    disguise:  { side: "x", name: "変装", desc: "これから3手のあいだ、刑事の視界に入っても見つからない。" },
    xheli:     { side: "x", name: "ヘリ", desc: "ヘリの切符を1枚得る。ヘリポートの駅から、ほかのヘリポートのどこかへ飛べる。" },
    trap:      { side: "x", name: "罠", desc: "いまいる駅に罠を仕掛ける。踏んだ刑事は1回休み。刑事には見えない。" },
    vanish:    { side: "x", name: "雲隠れ", desc: "次に刑事の視界に入っても、1回だけ見つからない。" },
    destroy:   { side: "x", name: "駅破壊", desc: "2手以内の駅を1つ壊す。壊れた駅は最後まで誰も通れない（怪盗Xも）。" },
    miss:      { side: "", name: "ハズレ", desc: "何も起こらなかった。" },
  };
  const DECK = {
    d: [["bridge", 22], ["checkpoint", 33], ["dash", 10], ["heliban", 18], ["rcheck", 17], ["dog", 16], ["reinforce", 22]],
    x: [["trap", 34], ["vanish", 33], ["destroy", 33], ["smoke", 24], ["disguise", 24]],
  };
  // ヘリ封鎖は1ゲームに1回だけ（一度引いたら山札から外す）
  function drawCard(side, G = null) {
    const deck = DECK[side].filter(([c]) => !(c === "heliban" && G && G.helibanDrawn));
    let r = Math.random() * deck.reduce((s, c) => s + c[1], 0);
    for (const [c, w] of deck) if ((r -= w) < 0) return c;
    return "miss";
  }
  function cardTargets(G, sec, card) {
    if (card === "bridge") return BRIDGE_ST.filter(b => !isClosed(G.closedX, b, G));
    if (card === "destroy") {
      const occ = new Set(G.det.map(d => d.pos));
      const exitsLeft = i => ADJ[sec.pos].some(e => e.to !== i && !occ.has(e.to) && !isRuin(G, e.to) && !isClosed(G.closedX, e.to, G));
      return [...Array(N).keys()].filter(i => i !== sec.pos && D[sec.pos][i] <= 2 && !occ.has(i) && !isRuin(G, i) && exitsLeft(i));
    }
    return null;
  }
  // 足跡の駅 path[i0] から、その後の手（見えた乗り物、見えなければ何でも）でたどれる駅に候補を絞る
  function dogReplay(G, sec, i0) {
    const L = G.xLog.length;
    let ps = [sec.path[i0]];
    for (let i = i0; i < L; i++) {
      const e = G.xLog[i], t = e.t === "pass" ? "pass" : e.t === "heli" ? "heli" : (e.k ? e.t : "black");
      if (t === "heli") { ps = HELI.slice(); continue; }
      if (t === "pass") continue;
      const nx = new Set();
      for (const s of ps) for (const ed of ADJ[s]) if (t === "black" || ed.type === t) nx.add(ed.to);
      ps = [...nx];
    }
    const cur = new Set(G.possible);
    let np = ps.filter(p => cur.has(p));
    if (!np.includes(sec.pos)) np = ps.includes(sec.pos) ? ps : G.possible;   // 念のため（本当の駅は必ず残す）
    return np.sort((a, b) => a - b);
  }
  function applyCard(G, sec, card, target) {
    const n = G.xLog.length;
    if (card === "bridge") G.closedX = { ...(G.closedX || {}), [target]: n + 4 };
    else if (card === "heliban") G.heliBan = n + 5;
    else if (card === "dog") {
      // 警察犬の駒：2手前の駅（足跡）に現れ、そこから今いそうな駅を絞る。その後3手のあいだ、足跡を1駅ずつたどる
      const L = G.xLog.length;
      if (L >= 1) {
        const i0 = Math.max(0, L - 2), iOld = Math.max(0, L - 3);
        const trail = [...new Set([iOld, i0])].map(i => ({ n: i, pos: sec.path[i], dog: true }));
        G.possible = dogReplay(G, sec, i0);
        G.seen = [...(G.seen || []), ...trail].sort((a, b) => a.n - b.n);
        G.dogUsed = { n, trail: trail.map(t => t.pos) };
        G.dog = { i: i0, pos: sec.path[i0], until: n + 3 };
      }
    }
    else if (card === "dash") G.dash = target;   // target＝使った刑事の番号
    else if (card === "rcheck") {
      // ランダム検問：ヘリポート・怪盗Xの駅・破壊された駅・刑事の駅以外からランダム
      const occ = new Set(G.det.map(d => d.pos));
      const opts = [...Array(N).keys()].filter(i => !HELI_SET.has(i) && i !== sec.pos && !isRuin(G, i) && !occ.has(i) && !(G.checkpoints && G.checkpoints[i] !== undefined && G.xLog.length < G.checkpoints[i]));
      target = pick(opts);
      G.closedX = { ...(G.closedX || {}), [target]: n + 6 };
      G.checkpoints = { ...(G.checkpoints || {}), [target]: n + 6 };
    }
    else if (card === "checkpoint") {
      // 検問所：怪盗Xは6手のあいだその駅を通れない
      G.closedX = { ...(G.closedX || {}), [target]: n + 6 };
      G.checkpoints = { ...(G.checkpoints || {}), [target]: n + 6 };
    }
    else if (card === "inquiry") {
      const others = shuffle(G.possible.filter(s => s !== sec.pos));
      G.possible = [sec.pos, ...others.slice(0, Math.floor(others.length / 2))].sort((a, b) => a - b);
    } else if (card === "reinforce") G.det.forEach(d => { d.t.heli += 1; });
    else if (card === "trap") sec.trap = sec.pos;
    else if (card === "xheli") G.heli += 1;
    else if (card === "smoke") { G.stun = { ...(G.stun || {}) }; G.det.forEach((_, k) => { G.stun[k] = Math.max(1, G.stun[k] || 0); }); }
    else if (card === "disguise") G.disguise = n + 3;
    else if (card === "vanish") G.skipReveal = (G.skipReveal || 0) + 1;
    else if (card === "destroy") {
      G.ruin = [...(G.ruin || []), target];
      G.possible = G.possible.filter(p => p !== target);
    }
    G.cards = [...(G.cards || []), { card, n, target: card === "trap" ? null : (target ?? null) }];
    return target;
  }
  // CPU が選ぶ対象
  function aiCardTarget(G, sec, card) {
    const opts = cardTargets(G, sec, card);
    if (!opts || !opts.length) return null;
    if (card === "bridge") {
      const P = G.possible;
      return opts.reduce((best, b) => { const v = P.reduce((s, p) => s + dd(b, p), 0) / P.length; return v < best[1] ? [b, v] : best; }, [opts[0], Infinity])[0];
    }
    // 駅破壊：いちばん近い刑事の通り道になっている駅を壊す（自分の逃げ道は3つ以上残す）
    let near = G.det[0].pos;
    for (const d of G.det) if (D[sec.pos][d.pos] < D[sec.pos][near]) near = d.pos;
    const exits = o => new Set(ADJ[sec.pos].map(e => e.to).filter(t => t !== o && !isRuin(G, t) && !G.det.some(d => d.pos === t) && !isClosed(G.closedX, t, G))).size;
    const safe = opts.filter(o => exits(o) >= 3);
    if (!safe.length) return null;
    return safe.reduce((best, o) => { const v = D[o][near] + D[o][sec.pos] * 0.5; return v < best[1] ? [o, v] : best; }, [safe[0], Infinity])[0];
  }
  // 手札：いまが何手目か（怪盗Xはこれから動く手、刑事はいまの手）
  const cardMove = (G, side) => side === "x" ? G.xLog.length + 1 : G.xLog.length;
  const handOf = (G, side) => ((G.hand = G.hand || { x: [], d: [] })[side]);
  // CPU がいま使うカードを選ぶ（使うものは手札から取り除いて返す）
  function aiUseCards(G, sec, side) {
    const hand = handOf(G, side), used = [];
    if (!hand.length || cardMove(G, side) > CARD_LAST) return used;
    const last = cardMove(G, side) === CARD_LAST;

  // 生成画像を使うときはここにファイル名を入れる（例: map: "art/map.jpg"）

      }

      }

      }

        say(nearestDet([e.p]), pick(FOUND_LINES), "hot");

    }
    G.det.forEach((d, k) => {

    if (G.mate && !prev.mate) {
      // 相棒の登場

    }
    if (G.mate && prev.mate) {
      if (!prev.mate.out && G.mate.out) {

        say(k, "相棒を捕まえた！", "hot", 3000);
        banner("相棒確保！", "怪盗Xはもう隠れられない。これから居場所が常に見える", "blue", 2);
      } else if (!G.mate.out && prev.mate.pos !== G.mate.pos && !G.over) {
        pushFeed(G.xLog.length, `相棒 → ${NO(G.mate.pos)} ${NAME(G.mate.pos)}`);

    }
    if (!prev.over && G.over && G.reason === "meet") {

      G.det.forEach((_, k) => say(k, pick(["しまった、仲間がいたか！", "逃げられた…", "くそっ…"]), "sad", 4000));

    } else if (!prev.over && G.over) {

      if (G.winner === "d") {

        banner("逮捕！", G.reason === "trapped" ? "怪盗Xは追い詰められて動けない" : `${dName(Math.max(0, kc))}が怪盗Xを確保した`, "blue", 3);
      } else {

  }

  // 刑事側から見た怪盗Xの見つかり具合（公開情報だけで決まる）
  function exposure(G) {
    const n = G.possible.length;
    if (n === 1) return { level: "found", n, label: "発見されている", help: "刑事に居場所がばれています" };
    if (n <= 4) return { level: "near", n, label: `追われている・候補${n}駅`, help: "刑事は候補をかなり絞り込んでいます" };
    return { level: "lost", n, label: `見失われている・候補${n}駅`, help: "刑事はまだ居場所をつかめていません" };
  }
  // 刑事ごとの吹き出し："!" は怪盗Xを捕捉している、"?" は見失っている
  function detBubble(G, k) {
    const e = exposure(G);
    if (e.level === "found") return "!";
    const near = Math.min(...G.possible.map(p => D[G.det[k].pos][p]));
    return e.level === "near" && near <= 2 ? "!" : "?";
  }
  // ---------------- 刑事のリアクション（セリフの吹き出しと中央の見出し） ----------------
  const SPEECH = new Map();   // 刑事番号 -> { text, kind, until }
  // 吹き出しのセリフを、句読点や空白の近くで1行12文字くらいに折り返す
  function wrapTalk(text) {
    const out = [];
    let rest = text;
    while (rest.length > 13) {
      let cut = -1;
      for (let i = 12; i >= 6; i--) if ("、。！？ ）".includes(rest[i - 1])) { cut = i; break; }
      if (cut < 0) cut = 12;
      out.push(rest.slice(0, cut).trim()); rest = rest.slice(cut).trim();
    }
    if (rest) out.push(rest);
    return out.slice(0, 3);
  }
  function say(k, text, kind = "", ms = 2400) {
    if (k < 0 || !A.G || !A.G.det[k]) return;
    SPEECH.set(k, { text, kind, until: Date.now() + ms });
    updateTalk();
    renderEdge();
    setTimeout(() => { updateTalk(); renderEdge(); }, ms + 40);
  }
  function nearestDet(targets) {
    const G = A.G;
    let best = 0, bd = Infinity;
    G.det.forEach((d, k) => { const x = Math.min(...targets.map(p => D[d.pos][p])); if (x < bd) { bd = x; best = k; } });
    return best;
  }
  function updateTalk() {
    if (!A.G) return;
    A.G.det.forEach((_, k) => {
      const t = $("tokD" + k);
      if (!t) return;
      const s = SPEECH.get(k), on = s && s.until > Date.now();
      const tp = $("talkD" + k), tk = tp.querySelector(".talk"), b = t.querySelector(".bubble");
      tp.style.transform = t.style.transform;
      if (!on) { tk.style.display = "none"; tk.dataset.text = ""; if (b) b.style.visibility = ""; return; }
      if (b) b.style.visibility = "hidden";
      if (tk.dataset.text !== s.text) {
        tk.dataset.text = s.text;
        const lines = wrapTalk(s.text);
        const w = Math.max(...lines.map(l => l.length)) * 26 + 30, hgt = lines.length * 32 + 18;
        tk.querySelector(".tb").setAttribute("d", `M${-w / 2},${-4 - hgt} h${w} a10,10 0 0 1 10,10 v${hgt - 20} a10,10 0 0 1 -10,10 h${-w / 2 + 14} l-14,14 l-4,-14 h${-w / 2 + 4} a10,10 0 0 1 -10,-10 v${-(hgt - 20)} a10,10 0 0 1 10,-10 Z`);
        const tx = tk.querySelector("text");
        tx.textContent = "";
        tx.setAttribute("y", String(-4 - hgt + 34));
        lines.forEach((l, i) => { const ts = el("tspan", { x: 0, dy: i ? 32 : 0 }, tx); ts.textContent = l; });
        tk.setAttribute("class", "talk pop " + s.kind);
      }
      tk.style.display = "";
    });
  }
  // ヘリのガス欠：ふわっと浮いて、プスンと落ちる
  function dudAction(pos, sub) {
    toast("ガス欠！ ヘリが飛べない");
    banner("ガス欠！", sub, "gray", 2);
    const [x, y] = P(pos);
    const host = el("g", { transform: `translate(${x + 78} ${y - 14})` }, $("gTalk"));
    const heli = el("g", { class: "dud-heli" }, host);
    el("path", { d: "M-26,-6 q0,-20 24,-20 h8 q20,0 20,18 q0,12 -18,12 h-18 q-16,0 -16,-10 Z", class: "dh-body" }, heli);
    el("path", { d: "M26,-10 L58,-16 L60,-4 L26,-2 Z", class: "dh-body" }, heli);
    el("path", { d: "M-10,-6 h12 v-12 h-4 q-8,0 -8,8 Z", class: "dh-glass" }, heli);
    el("path", { d: "M-20,8 v6 M18,8 v6 M-28,14 h56", class: "dh-skid" }, heli);
    el("path", { d: "M0,-26 v-8 M-44,-34 h88", class: "dh-rotor" }, heli);
    for (let i = 0; i < 3; i++) el("circle", { cx: 40 + i * 12, cy: -18 - i * 6, r: 10 + i * 4, class: "dh-smoke s" + i }, host);
    const t = el("text", { x: 0, y: -60, class: "dh-text" }, host);
    t.textContent = "プスン…";

  }
  let bannerPri = 0, bannerUntil = 0;
  function banner(title, sub = "", color = "", pri = 1) {
    if (Date.now() < bannerUntil && pri < bannerPri) return;
    if (Date.now() < bannerUntil && pri === bannerPri) { setTimeout(() => banner(title, sub, color, pri), bannerUntil - Date.now() + 80); return; }
    bannerPri = pri; bannerUntil = Date.now() + 1900;
    const d = document.createElement("div");
    d.className = "bn " + color;
    d.innerHTML = `<b></b><small></small>`;
    d.querySelector("b").textContent = title;
    d.querySelector("small").textContent = sub;
    $("banner").replaceChildren(d);
    setTimeout(() => { if (d.parentNode) d.remove(); }, 1950);
  }
  const FOUND_LINES = ["見つけた！", "いたぞ！", "そこか！", "逃がさん！"];
  const LOST_LINES = ["見失った…", "どこへ消えた…", "くそっ、撒かれた", "手がかりが…"];
  const NEAR_LINES = ["近いぞ…", "この辺りだ", "匂うな…"];

  let lastExpo = null;
  function noteExposure() {
    const G = A.G;
    if (!G || G.over) { lastExpo = null; return; }
    const lv = exposure(G).level;
    if (lv === "found") {
      G.seen = G.seen || [];
      const last = G.seen[G.seen.length - 1], pos = G.possible[0], n = G.xLog.length;
      if (!last || last.pos !== pos) G.seen.push({ n, pos });
    }
    if (lastExpo && lv !== lastExpo) {
      if (lv === "found") {
        toast("刑事が怪盗Xを発見！");
        say(nearestDet(G.possible), pick(FOUND_LINES), "hot");
        banner("発見！", `刑事が怪盗Xの居場所をつかんだ（${NAME(G.possible[0])}）`, "", 1);
        if (A.role !== "x") radio(nearestDet(G.possible), `${NO(G.possible[0])} ${NAME(G.possible[0])} にいる！`, "");
      } else if (lv === "lost") {
        toast("刑事は怪盗Xを見失った");
        say(Math.floor(Math.random() * G.det.length), pick(LOST_LINES), "sad");
        banner("見失った…", `候補は${G.possible.length}駅に広がった`, "gray", 0);
      } else if (lastExpo === "lost") {
        toast("刑事が怪盗Xに迫っている");
        say(nearestDet(G.possible), pick(NEAR_LINES));
      }
    }
    lastExpo = lv;
  }

  function save() {
    try {
      if (!A.G || A.G.over) localStorage.removeItem(SAVE_KEY);
      else localStorage.setItem(SAVE_KEY, JSON.stringify({ role: A.role, detCount: A.detCount, thief: A.thief, detPick: A.detPick, G: A.G, sec: A.sec, feed: A.feed.slice(0, 60), cover: A.cover === "x-open" ? "x" : A.cover }));
    } catch (e) {}
  }
  function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { return null; } }

  // ======================================================================
  // 進行
  // ======================================================================
  function startGame(role) {
    clearTimeout(timer);
    lastSight = null;
    SPEECH.clear();
    const { G, sec } = newGame(A.detCount);
    Object.assign(A, { role, G, sec, feed: [], radio: [], sel: null, useDouble: false, screen: "game", busy: false });
    A.cover = role === "pass" ? "x" : null;
    pushFeed(0, role === "x" ? `あなたは怪盗X。${MAX_MOVES}手逃げ切るか、相棒と合流すれば勝ち！` : role === "d" ? `あなたは刑事1。ほかの刑事${A.detCount - 1}人はCPUの仲間です。怪盗Xを逮捕せよ！` : "パス&プレイ。怪盗X役の人から始めます。", true);
    buildTokens();
    fitView(false);
    step();
    if (role !== "pass") setTimeout(() => focusTurn(), 50);
  }

  function resume(s) {
    clearTimeout(timer);
    SPEECH.clear();
    lastSight = null;
    Object.assign(A, { role: s.role, detCount: s.detCount, thief: s.thief || 0, detPick: s.detPick || 0, G: s.G, sec: s.sec, feed: s.feed || [], sel: null, useDouble: false, screen: "game", busy: false, cover: s.cover || null });
    buildTokens();
    fitView(false);
    step();
  }

  function apply(fn) {
    const prev = clone(A.G);
    fn();
    if (!A.G.over && A.G.det.some(d => d.pos === A.sec.pos)) finish(A.G, "d", "caught");
    describe(prev, A.G);
    const tk = A.G.over ? -1 : checkTrap(A.G, A.sec);
    if (tk >= 0) { say(tk, "しまった！罠だ！", "hot"); toast(`${dName(tk)} が罠にかかった！ 1回休み`); pushFeed(A.G.xLog.length, `${dName(tk)} が ${NAME(A.G.det[tk].pos)} で怪盗Xの罠にかかった（1回休み）`, true); }
  }

  function step() {
    clearTimeout(timer);
    const G = A.G;
    while (!G.over) {
      if (G.turn === "x") {
        if (!xMoves(G, A.sec).length) { apply(() => finish(G, "d", "trapped")); continue; }
        if (A.role === "pass" && A.cover === null) A.cover = "x";
        if (A.role === "pass" && A.cover !== "x-open") { save(); render(); return; }
        if (!G.doubling) {
          const n = G.xLog.length + 1;
          G.drawn = G.drawn || { x: [], d: [] };
          if (CARD_TURNS.includes(n) && !G.drawn.x.includes(n)) {
            G.drawn.x.push(n);
            const card = drawCard("x");
            gainCard("x", card);
            if (A.role === "x" || A.role === "pass") { A.pendingCard = { side: "x", card, stage: "reveal" }; save(); render(); return; }
          }
          expireHand("x");
        }
        if (A.role === "x" || A.role === "pass") { save(); render(); return; }
        for (const [c, t] of aiUseCards(G, A.sec, "x")) useCardNow("x", c, t);
        if (!xMoves(G, A.sec).length) { apply(() => finish(G, "d", "trapped")); continue; }
        render();
        timer = setTimeout(() => {
          const m = aiX(G, A.sec);
          apply(() => applyX(G, A.sec, m.to, m.type, m.useDouble));
          step();
        }, AI_DELAY);
        return;
      }
      const k = G.turn;
      if (k === 0) {
        const n = G.xLog.length;
        G.drawn = G.drawn || { x: [], d: [] };
        if (CARD_TURNS.includes(n) && !G.drawn.d.includes(n)) {
          if (A.role === "pass" && A.cover !== null) { save(); render(); return; }
          G.drawn.d.push(n);
          const card = drawCard("d", G);
          gainCard("d", card);
          if (A.role === "d" || A.role === "pass") { A.pendingCard = { side: "d", card, stage: "reveal" }; save(); render(); return; }
        }
        expireHand("d");
      }
      if (G.stun && G.stun[k] > 0) {
        G.stun[k]--;
        pushFeed(G.xLog.length, `${dName(k)} は罠で足止め（1回休み）`, true);
        apply(() => skipD(G, k));
        continue;
      }
      if (allStuck(G)) { apply(() => finish(G, "x", "stuck")); continue; }
      if (!detMoves(G, k).length) {
        pushFeed(G.xLog.length, `${dName(k)} は使える切符がないので待機`);
        apply(() => skipD(G, k));
        continue;
      }
      if (A.role === "pass" || (A.role === "d" && k === ME_DET)) { save(); render(); ensureVisible(G.det[k].pos); return; }
      // 刑事がすべてCPUのとき（怪盗Xモード）だけ、CPUの刑事がチームのカードを使う。
      // 刑事モードの手札はあなたのもの（仲間のCPUは勝手に使わない）
      if (A.role === "x") for (const [c, t] of aiUseCards(G, A.sec, "d")) {
        say(k, `「${CARD[c].name}」だ！`, "", 2200);
        pushFeed(G.xLog.length, `${dName(k)} がカードを使った`);
        useCardNow("d", c, t);
      }
      render();
      timer = setTimeout(() => {
        const m = aiD(G, k, A.role === "d");
        const from = G.det[k].pos;
        let landed = m.to;
        apply(() => { landed = applyD(G, k, m.to, m.type, A.sec); });
        if (m.type === "heli") heliNote(k, from, landed);
                step();
      }, AI_DELAY);
      return;
    }
    save();
    A.cover = null;
    render();
    const endedG = G;
    setTimeout(() => { if (A.G === endedG && A.screen === "game") { A.screen = "result"; renderScreen(); } }, 900);
  }

  // ---------------- カードの処理 ----------------
  const needsTarget = card => card === "bridge" || card === "destroy";
  function announceCard(side, card, target) {
    const G = A.G, c = CARD[card];
    if (side === "d") {
      let detail = "";
      if (card === "bridge") detail = `${NO(target)} ${NAME(target)} を封鎖（4手）`;
      else if (card === "dash") { detail = `${dName(target)} がダッシュ！ この番は2回続けて動ける`; say(target, "走るぞ！", "hot", 2200); }
      else if (card === "rcheck") detail = `${NO(target)} ${NAME(target)} に検問所が敷かれた（6手のあいだ怪盗Xは通れない）`;
      else if (card === "checkpoint") detail = `${NO(target)} ${NAME(target)} に検問所を設置（6手のあいだ怪盗Xは通れない）`;
      else if (card === "reinforce") detail = "刑事全員にヘリの切符を1枚追加";
      else if (card === "heliban") detail = `すべてのヘリポートを閉鎖（${G.heliBan - G.xLog.length}手）`;
      else if (card === "dog") {
        if (G.dogUsed && G.dogUsed.n === G.xLog.length) {
          detail = `足跡を発見：${G.dogUsed.trail.map(p => `${NO(p)} ${NAME(p)}`).join(" → ")}。いそうな駅は${G.possible.length}駅`;
          banner("警察犬！", `足跡をたどった。いそうな駅は${G.possible.length}駅`, "blue", 2);
          say(nearestDet(G.dogUsed.trail), "ワン！ 足跡があった", "hot", 2600);
        } else detail = "まだ足跡がない";
      }
      else detail = "何も起こらなかった";
      toast(`刑事チームのカード「${c.name}」`);
      pushFeed(G.xLog.length, `刑事チームのカード「${c.name}」：${detail}`, card !== "miss");
      return;
    }
    const mine = A.role === "x" || (A.role === "pass" && A.cover === "x-open");
    if (card === "smoke") {
      toast("煙幕！ 刑事全員が1回休み");
      banner("煙幕！", "刑事全員が1回休み", "gray", 2);
      pushFeed(G.xLog.length, "怪盗Xのカード「煙幕」：刑事全員が1回休み", true);
      G.det.forEach((_, k) => say(k, "ゴホッ、前が見えない！", "sad", 2600));
      return;
    }
    if (card === "destroy") {
      toast(`怪盗Xが ${NAME(target)} を破壊！`);
      pushFeed(G.xLog.length, `怪盗Xのカード「駅破壊」：${NO(target)} ${NAME(target)} は壊れて最後まで誰も通れない`, true);
    } else if (mine) {
      toast(`カード「${c.name}」を使った`);
      pushFeed(G.xLog.length, `怪盗Xのカード「${c.name}」${card === "trap" ? `：${NAME(A.sec.pos)} に罠を仕掛けた` : card === "vanish" ? "：次の目撃情報を消す" : card === "disguise" ? "：3手のあいだ見つからない" : card === "xheli" ? "：ヘリの切符を1枚得た" : "：何も起こらなかった"}`, card !== "miss");
    } else {
      toast("怪盗Xがカードを使った…");
      pushFeed(G.xLog.length, "怪盗Xが何かのカードを使った（効果はわからない）", true);
    }
  }
  // 引いたカードを手札に加える（ハズレは捨てる）
  function gainCard(side, card) {
    const G = A.G;
    const mine = side === "x" ? (A.role === "x" || (A.role === "pass" && A.cover === "x-open")) : A.role !== "x";
    if (card === "heliban") {
      G.helibanDrawn = true;
      // ヘリ封鎖は引いたその場で自動発動
      applyCard(G, A.sec, card, null);
      announceCard(side, card, null);
      banner("ヘリ封鎖！", `すべてのヘリポートが${G.heliBan - G.xLog.length}手のあいだ閉鎖`, "blue", 2);
      return;
    }
    if (card === "rcheck") {
      // ランダム検問も引いたその場で自動発動

    o.push(`<polygon points="${bay}" fill="#A9C9D6" stroke="#6E98AE" stroke-width="5"/><polygon points="${bay}" fill="url(#waves)"/>`);
    // 大川
    o.push(`<polyline points="${pts(RIVER)}" fill="none" stroke="#6E98AE" stroke-width="122" stroke-linejoin="round" stroke-linecap="round"/>`);
    o.push(`<polyline points="${pts(RIVER)}" fill="none" stroke="#A9C9D6" stroke-width="110" stroke-linejoin="round" stroke-linecap="round"/>`);
    o.push(`<polyline points="${pts(RIVER)}" fill="none" stroke="url(#waves)" stroke-width="100" stroke-linejoin="round"/>`);
    // 島
    for (const i of ISLAND_LIST) o.push(`<ellipse cx="${STATIONS[i][1]}" cy="${STATIONS[i][2]}" rx="120" ry="80" fill="#E3D9BD" stroke="#6E98AE" stroke-width="5"/><ellipse cx="${STATIONS[i][1]}" cy="${STATIONS[i][2]}" rx="92" ry="56" fill="url(#trees)" opacity="0.5"/>`);
    // 橋（両岸の駅を結ぶ向き）
    for (const bi of BRIDGE_ST) {
      const nb = TAXI.filter(e => e.includes(bi)).map(e => e[0] === bi ? e[1] : e[0]);
      if (nb.length < 2) continue;
      const [p, q] = [STATIONS[nb[0]], STATIONS[nb[1]]];
      const ang = Math.atan2(q[2] - p[2], q[1] - p[1]) * 180 / Math.PI;
      o.push(`<g transform="translate(${STATIONS[bi][1]} ${STATIONS[bi][2]}) rotate(${ang.toFixed(1)})"><rect x="-95" y="-16" width="190" height="32" rx="4" fill="#CFC3A2" stroke="#3B2C1E" stroke-width="3"/></g>`);
    }
    // 川と湾の名前
    const m = RIVER[Math.floor(RIVER.length * 0.55)];
    o.push(`<text x="${m[0] + 90}" y="${m[1]}" font-family="Zen Old Mincho, serif" font-size="44" font-weight="700" fill="#4E7890" opacity="0.8">${RIVER_NAME}</text>`);
    o.push(`<text x="${W - 700}" y="${H - 260}" font-family="Zen Old Mincho, serif" font-size="64" font-weight="700" letter-spacing="30" fill="#4E7890" opacity="0.6">東京湾</text>`);
    // 方位記号と表題
    o.push(`<g transform="translate(${W - 120} 150)"><circle r="64" fill="#F2EBD8" stroke="#3B2C1E" stroke-width="3"/><path d="M0,-72 L12,0 L0,72 L-12,0 Z M-72,0 L0,-12 L72,0 L0,12 Z" fill="#D9CDAE" stroke="#3B2C1E" stroke-width="2"/><path d="M0,-72 L12,0 L-12,0 Z" fill="#3B2C1E"/><text y="-80" font-family="Georgia, serif" font-size="26" fill="#3B2C1E" text-anchor="middle">N</text></g>`);
    o.push(`<rect width="${W}" height="${H}" fill="url(#vig)"/>`);
    o.push(`</svg>`);
    return o.join("");
  }

  // ======================================================================
  // ドット絵風の盤面：灰色の街に、斜め見下ろしのビル・木・公園・水面をコードで描く
  // 道路・バス・地下鉄は、縦横と45度の線でつなぎ、角を丸める（地下鉄の路線図風）
  // ======================================================================
  const PX = 3;   // 背景の1ドットが盤面の何単位か（大きいほどドットが粗い）
  const PLAIN_BG = true;   // 背景は地面と水だけ（ビル・木・公園は描かない）

  // 駅 a→b を、縦横の直線と45度の斜めで結ぶ折れ線（端は縦横、真ん中が斜め）
  function octPts(a, b, off = 0) {
    const [x1, y1] = P(a), [x2, y2] = P(b);
    const dx = x2 - x1, dy = y2 - y1, ax = Math.abs(dx), ay = Math.abs(dy);
    const sx = Math.sign(dx) || 1, sy = Math.sign(dy) || 1;
    let pts;
    if (ax >= ay) { const run = (ax - ay) / 2; pts = [[x1, y1], [x1 + sx * run, y1], [x2 - sx * run, y2], [x2, y2]]; }
    else { const run = (ay - ax) / 2; pts = [[x1, y1], [x1, y1 + sy * run], [x2, y2 - sy * run], [x2, y2]]; }
    if (off) {
      const L = Math.hypot(dx, dy) || 1, nx = -dy / L * off, ny = dx / L * off;
      pts = pts.map(([x, y]) => [x + nx, y + ny]);
    }
    return pts.filter((p, i) => i === 0 || Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]) > 0.5);
  }
  // 折れ線の角を丸めた SVG の path
  function roundPath(pts, r = 34) {
    let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const [px, py] = pts[i - 1], [cx, cy] = pts[i], [nx, ny] = pts[i + 1];
      const l1 = Math.hypot(cx - px, cy - py), l2 = Math.hypot(nx - cx, ny - cy);
      const k = Math.min(r, l1 / 2, l2 / 2);
      const ax = cx - (cx - px) / l1 * k, ay = cy - (cy - py) / l1 * k;
      const bx = cx + (nx - cx) / l2 * k, by = cy + (ny - cy) / l2 * k;
      d += ` L${ax.toFixed(1)},${ay.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${bx.toFixed(1)},${by.toFixed(1)}`;
    }
    const e = pts[pts.length - 1];
    return d + ` L${e[0].toFixed(1)},${e[1].toFixed(1)}`;
  }

  async function renderBackground() {
    const img = $("bgimg");
    const cw = Math.ceil(W / PX), ch = Math.ceil(H / PX);
    const c = document.createElement("canvas");
    c.width = cw; c.height = ch;
    const g = c.getContext("2d");
    g.imageSmoothingEnabled = false;
    let seed = 20260929;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const px = v => Math.round(v / PX);
    // 地面と歩道のタイル
    g.fillStyle = "#C6C6C1"; g.fillRect(0, 0, cw, ch);
    for (let y = 0; y < ch; y += 6) for (let x = (y / 6) % 2 * 3; x < cw; x += 6) { g.fillStyle = "#CDCDC8"; g.fillRect(x, y, 3, 3); }
    // 水：湾と大川
    const bay = new Path2D();
    const last = COAST[COAST.length - 1];
    [...COAST, [W + 400, last[1]], [W + 400, H + 400], [COAST[0][0], H + 400]].forEach(([x, y], i) => i ? bay.lineTo(px(x), px(y)) : bay.moveTo(px(x), px(y)));
    bay.closePath();
    const river = new Path2D();
    RIVER.forEach(([x, y], i) => i ? river.lineTo(px(x), px(y)) : river.moveTo(px(x), px(y)));
    g.lineJoin = "round"; g.lineCap = "round";
    g.fillStyle = "#E4DCC2"; g.strokeStyle = "#E4DCC2"; g.lineWidth = px(196); g.stroke(river);
    g.save(); g.translate(0, -2); g.fill(bay); g.restore();
    g.fillStyle = "#4E86C8"; g.strokeStyle = "#4E86C8"; g.lineWidth = px(176); g.stroke(river); g.fill(bay);
    g.lineWidth = px(176);
    const wet = (x, y) => g.isPointInPath(bay, x, y) || g.isPointInStroke(river, x, y);
    for (let y = 2; y < ch; y += 5) for (let x = (y * 7) % 11; x < cw; x += 11) {
      if (wet(x, y) && wet(x + 4, y)) { g.fillStyle = rnd() < 0.5 ? "#7FB0E6" : "#6A9FDA"; g.fillRect(x, y, 3, 1); }
    }
    // 島（お台場＝夢見島は大きめ）
    ISLAND_LIST.forEach((i, k) => {
      const [x, y] = P(i), [rx, ry] = ISLAND_SIZE[k];
      g.fillStyle = "#E4DCC2"; g.beginPath(); g.ellipse(px(x), px(y), px(rx), px(ry), 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#C6C6C1"; g.beginPath(); g.ellipse(px(x), px(y) - 2, px(rx - 22), px(ry - 20), 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#7DBB5E"; g.beginPath(); g.ellipse(px(x - rx * 0.45), px(y + ry * 0.3), px(rx * 0.3), px(ry * 0.3), 0, 0, Math.PI * 2); g.fill();
    });
    if (PLAIN_BG) { img.setAttribute("href", c.toDataURL("image/png")); return; }
    // 道・線路の通り道（ビルを置かない）
    const segs = [];
    for (const key of edgeTypes.keys()) {
      const [a, b] = key.split("-").map(Number);
      const pts = octPts(a, b).map(([x, y]) => [x / PX, y / PX]);
      for (let k = 0; k < pts.length - 1; k++) segs.push([pts[k], pts[k + 1]]);
    }
    const segD = (x, y, a, b) => {
      const vx = b[0] - a[0], vy = b[1] - a[1], L = vx * vx + vy * vy || 1;
      const t = Math.max(0, Math.min(1, ((x - a[0]) * vx + (y - a[1]) * vy) / L));
      return Math.hypot(x - a[0] - vx * t, y - a[1] - vy * t);
    };
    const nearRoad = (x, y, d) => segs.some(([a, b]) => segD(x, y, a, b) < d);
    const nearSt = (x, y, d) => STATIONS.some(s => Math.hypot(s[1] / PX - x, s[2] / PX - y) < d);
    // 公園（木の多い緑地）
    const parks = [];
    for (let t = 0; t < 800 && parks.length < 9; t++) {
      const x = 30 + rnd() * (cw - 60), y = 30 + rnd() * (ch - 60), rw = 16 + rnd() * 14, rh = 10 + rnd() * 8;
      if (wet(x, y) || nearRoad(x, y, Math.max(rw, rh) + 4) || nearSt(x, y, Math.max(rw, rh) + 16)) continue;
      parks.push([x, y, rw, rh]);
      g.fillStyle = "#5E9E4A"; g.fillRect(Math.round(x - rw - 1), Math.round(y - rh - 1), Math.round(rw * 2 + 2), Math.round(rh * 2 + 2));
      g.fillStyle = "#79B862"; g.fillRect(Math.round(x - rw), Math.round(y - rh), Math.round(rw * 2), Math.round(rh * 2));
      if (rnd() < 0.5) { g.fillStyle = "#4E86C8"; g.fillRect(Math.round(x - rw / 2), Math.round(y - rh / 3), Math.round(rw * 0.8), Math.round(rh * 0.6)); }
    }
    const inPark = (x, y) => parks.some(([cx, cy, rw, rh]) => Math.abs(x - cx) < rw + 2 && Math.abs(y - cy) < rh + 2);
    // 木
    const tree = (x, y) => {
      g.fillStyle = "#6B4A2E"; g.fillRect(x, y + 2, 1, 2);
      g.fillStyle = "#2F6B34"; g.fillRect(x - 2, y - 2, 5, 4); g.fillRect(x - 1, y - 3, 3, 6);
      g.fillStyle = "#4F9A4A"; g.fillRect(x - 1, y - 2, 3, 3);
      g.fillStyle = "#79C466"; g.fillRect(x - 1, y - 2, 1, 1);
    };
    // 斜め見下ろしのビル（正面・右の側面・屋根）
    const PAL = [
      ["#E9E9E4", "#C3C3BE", "#9C9C97", "#8FB4D8"],   // 白いビル・青い窓
      ["#BFD4EA", "#8FB2D6", "#6B8FB8", "#E6F2FF"],   // ガラス張り
      ["#D9CDB4", "#B9AB8E", "#948768", "#6E6252"],   // ベージュ
      ["#C8C8C4", "#A2A29D", "#7E7E79", "#5B5B57"],   // 灰色
      ["#D99A7A", "#B87658", "#935A40", "#F2D2A8"],   // レンガ
    ];
    const building = (x, y) => {
      const p = PAL[Math.floor(rnd() * PAL.length)];
      const w = 5 + Math.floor(rnd() * 6), d = 3 + Math.floor(rnd() * 3), h = 4 + Math.floor(rnd() * (rnd() < 0.2 ? 20 : 9));
      const bx = Math.round(x - w / 2), by = Math.round(y);
      g.fillStyle = "rgba(0,0,0,0.18)"; g.fillRect(bx + 1, by, w + d, 2);                       // 影
      g.fillStyle = p[1]; g.fillRect(bx, by - h, w, h);                                           // 正面
      for (let k = 0; k < d; k++) { g.fillStyle = p[2]; g.fillRect(bx + w + k, by - h - k - 1, 1, h + 1); }   // 側面
      for (let k = 0; k < d; k++) { g.fillStyle = p[0]; g.fillRect(bx + k + 1, by - h - k - 1, w, 1); }       // 屋根
      g.fillStyle = p[3];
      for (let wy = by - h + 2; wy < by - 1; wy += 2) for (let wx = bx + 1; wx < bx + w - 1; wx += 2) if (rnd() < 0.8) g.fillRect(wx, wy, 1, 1);
    };
    // 街区にビルと木を並べる（下の段から描くと重なりが自然）
    const spots = [];
    for (let y = 8; y < ch - 2; y += 8) for (let x = 6; x < cw - 4; x += 9) {
      const jx = x + (rnd() - 0.5) * 4, jy = y + (rnd() - 0.5) * 3;
      if (wet(jx, jy) || wet(jx + 8, jy - 8) || inPark(jx, jy) || nearRoad(jx, jy, 10) || nearRoad(jx + 4, jy - 8, 10) || nearSt(jx, jy, 20)) continue;
      spots.push([jx, jy]);
    }
    spots.sort((p, q) => p[1] - q[1]);
    for (const [x, y] of spots) { const r = rnd(); if (r < 0.62) building(x, y); else if (r < 0.85) tree(Math.round(x), Math.round(y)); }
    for (const [cx, cy, rw, rh] of parks) for (let k = 0; k < rw * rh / 18; k++) tree(Math.round(cx + (rnd() - 0.5) * rw * 1.7), Math.round(cy + (rnd() - 0.5) * rh * 1.6));
    img.setAttribute("href", c.toDataURL("image/png"));
  }

  // 線の太さ：タクシー（細い1本線）＜バス＜地下鉄。上に重ねるほど太い線で、交差する所は下の線が途切れて見える（立体交差）
  const LINE_W = { taxi: 5, bus: 11, tube: 17, mono: 15 };
  const GAP = 5;   // 線のまわりの地面色のすき間（交差や並走を見分けやすく）
  function buildBoard() {
    const gE = $("gEdges"), gS = $("gStations"), gL = $("gLabels");
    const layer = () => ({ gap: el("g", {}, gE), ln: el("g", {}, gE) });
    const boatL = el("g", {}, gE), deckL = el("g", {}, gE);
    const layers = { taxi: layer(), bus: layer(), tube: layer(), mono: layer() };
    const title = (g, key, t) => { el("title", {}, g).textContent = t; };
    for (const [key, types] of edgeTypes) {
      const [a, b] = key.split("-").map(Number);
      // 同じ区間を走る線は、地下鉄・タクシー・バスの順に横へ並べる
      const here = ["tube", "taxi", "bus", "mono"].filter(t => types.has(t));
      const total = here.reduce((s_, t) => s_ + LINE_W[t], 0) + GAP * 2 * (here.length - 1);
      let at = -total / 2;
      for (const t of here) {
        const off = at + LINE_W[t] / 2; at += LINE_W[t] + GAP * 2;
        const d = roundPath(octPts(a, b, off));
        const w = LINE_W[t];
        el("path", { d, class: "ln gap", "stroke-width": w + GAP * 2 }, layers[t].gap);
        const g = el("g", {}, layers[t].ln);
        title(g, key, types.get(t).join("・"));
        el("path", { d, class: `ln ${t}-ln`, "stroke-width": w }, g);
        if (t !== "taxi") el("path", { d, class: `ln ${t}-dash` }, g);
      }
      if (types.has("boat")) {
        const pts = BOAT_PATH.has(key) ? BOAT_PATH.get(key) : [P(a), P(b)];
        const d = "M" + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L"), g = el("g", {}, boatL);
        title(g, key, types.get("boat").join("・"));
        el("path", { d, class: "edge boat casing", "stroke-linejoin": "round" }, g);
        el("path", { d, class: "edge boat", "stroke-linejoin": "round" }, g);
      }
    }
    // 橋の駅：川をまたぐ橋げたを水上バスの上にかける（水上バスは橋の下をくぐり、ここには止まらない）
    for (const i of BRIDGE_ST) {
      const [x, y] = P(i);
      // 川の流れの向き（いちばん近い区間）に直角な向きへ、川幅より少し長い橋げたをかける
      let k = 0, best = Infinity;
      for (let j = 0; j < RIVER.length - 1; j++) { const d_ = Math.hypot((RIVER[j][0] + RIVER[j + 1][0]) / 2 - x, (RIVER[j][1] + RIVER[j + 1][1]) / 2 - y); if (d_ < best) { best = d_; k = j; } }
      const j2 = Math.min(RIVER.length - 1, k + 3), j1 = Math.max(0, k - 2);
      let tx = RIVER[j2][0] - RIVER[j1][0], ty = RIVER[j2][1] - RIVER[j1][1];
      const L = Math.hypot(tx, ty) || 1; tx /= L; ty /= L;
      const ux = -ty, uy = tx, len = 112, half = 34;
      const c = [[+len, +half], [-len, +half], [-len, -half], [+len, -half]].map(([u, v]) => [x + ux * u + tx * v, y + uy * u + ty * v]);
      el("path", { d: "M" + c.map(q => q.map(v => v.toFixed(1)).join(",")).join(" L") + " Z", class: "deck" }, deckL);
      for (const v of [-half, half]) el("path", { d: `M${(x + ux * len + tx * v).toFixed(1)},${(y + uy * len + ty * v).toFixed(1)} L${(x - ux * len + tx * v).toFixed(1)},${(y - uy * len + ty * v).toFixed(1)}`, class: "deck-rail" }, deckL);
    }
    // 重ねる順：水上バス → 橋げた → タクシー → バス → 地下鉄（あとのほど上）
    gE.append(boatL, deckL, layers.taxi.gap, layers.taxi.ln, layers.bus.gap, layers.bus.ln, layers.tube.gap, layers.tube.ln, layers.mono.gap, layers.mono.ln);
    // 駅：以前の複合マーク。上半分をその駅で乗れる乗り物の色で塗り分け、下半分に番号。橋の駅はひし形、ヘリポートは H のマーク
    const R = 22;
    STATIONS.forEach(([name, x, y], i) => {
      const g = el("g", {}, gS);
      if (BRIDGE_ST.includes(i)) el("rect", { x: x - R - 7, y: y - R - 7, width: 2 * R + 14, height: 2 * R + 14, rx: 6, class: "bridge-pt", transform: `rotate(45 ${x} ${y})` }, g);
      el("circle", { cx: x, cy: y, r: R, class: "stn-base" }, g);
      const ts = MOVE_TYPES.filter(t => ADJ[i].some(e => e.type === t));
      ts.forEach((t, k) => {
        const a0 = Math.PI + Math.PI * k / ts.length, a1 = Math.PI + Math.PI * (k + 1) / ts.length;
        el("path", { d: `M${x},${y} L${(x + R * Math.cos(a0)).toFixed(2)},${(y + R * Math.sin(a0)).toFixed(2)} A${R},${R} 0 0 1 ${(x + R * Math.cos(a1)).toFixed(2)},${(y + R * Math.sin(a1)).toFixed(2)} Z`, class: "wedge " + t }, g);
      });
      el("path", { d: `M${x - R},${y} H${x + R}`, stroke: "#3B2C1E", "stroke-width": 1.5 }, g);
      el("circle", { cx: x, cy: y, r: R, class: "stn-rim" }, g);
      if (HELI_SET.has(i)) {
        // ヘリポート：駅の左上にヘリのドット絵
        el("ellipse", { cx: x - R - 22, cy: y - R + 6, rx: 26, ry: 6, fill: "rgba(0,0,0,0.25)" }, g);
        el("image", { href: pxHeliSprite(), x: x - R - 52, y: y - R - 34, width: 60, height: 36, class: "heli-sprite" }, g);
      }
      el("text", { x, y: y + 16, class: "stn-num" }, g).textContent = NO(i);
      el("text", { x, y: y + R + 24, class: "stn-label", id: "lbl" + i }, gL).textContent = name;
    });
  }
  // ======================================================================
  // 切符カード（ドット絵）：クリーム色の台紙に赤い枠。上に走る人と枚数、真ん中に乗り物の絵、下に「○○ TICKETS」
  // 絵は小さなキャンバスに四角を並べて描き、拡大表示でドットを見せる（画像ファイルは使わない）
  // ======================================================================
  const PXC = { W: 48, H: 32 };
  const pxCache = new Map();
  const CARD_INFO = {
    taxi:  { no: "01", en: "TAXI",      ja: "タクシー", mark: "タ" },
    bus:   { no: "02", en: "BUS",       ja: "バス",     mark: "バ" },
    tube:  { no: "03", en: "SUBWAY",    ja: "地下鉄",   mark: "地" },
    mono:  { no: "07", en: "MONORAIL", ja: "モノレール（湾岸と島を結ぶ高架の路線）", mark: "モ" },
    boat:  { no: "04", en: "WATER BUS", ja: "水上バス（怪盗Xだけが乗れる）", mark: "船" },
    black: { no: "05", en: "BLACK",     ja: "黒チケット（乗り物を隠す）", mark: "黒" },
    heli:  { no: "06", en: "HELI",      ja: "ヘリ（ほかのヘリポートのどこかへ着陸）", mark: "H" },
  };
  function pxScene(kind) {
    if (pxCache.has(kind)) return pxCache.get(kind);
    const c = document.createElement("canvas");
    c.width = PXC.W; c.height = PXC.H;
    const g = c.getContext("2d");
    const r = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
    // 枠線つきの四角（1ドット外側に濃い色）

  function layoutEdge() {

    const left = 40;
    const cx = (left + right) / 2, cy = (top + bottom) / 2;
    for (const b of host.children) {
      const pos = Number(b.dataset.pos);
      const [wx, wy] = P(pos);
      const sx = wx * V.s + V.tx, sy = (wy - 40) * V.s + V.ty;

      const ky = dy ? Math.abs((dy > 0 ? bottom - cy : cy - top) / dy) : Infinity;

      let ax = cx + dx * k, ay = cy + dy * k;

    if (G.dud !== undefined && (G.dudFound || G.over || (showX && A.sec.dudKnown))) {

  }

  function renderLog() {
    const G = A.G;
    if (!G) { $("xlog").innerHTML = ""; return; }
    const showX = xVisible();
    let html = "";
    for (let i = 0; i < MAX_MOVES; i++) {
      const e = G.xLog[i];
      const cls = ["slot"];
      if (e) cls.push(seenT(e));
      if (REVEAL.includes(i + 1)) cls.push("reveal");
      if (CARD_TURNS.includes(i + 1)) cls.push("cardturn");
      if (e && e.d) cls.push("dx");
      if (!G.over && i === G.xLog.length) cls.push("now");
      let st = "";
      if (e && e.p !== null) st = NO(e.p);
      else if (e && showX) st = NO(A.sec.path[i + 1]);
      const title = `${i + 1}手目${CARD_TURNS.includes(i + 1) ? "（カードを引く）" : ""}${e ? "：" + TYPE[seenT(e)].name : ""}${st ? "（" + NAME(st - 1) + "）" : ""}`;
      html += `<div class="${cls.join(" ")}" title="${esc(title)}"><span class="n">${i + 1}</span>${e ? TYPE[seenT(e)].short : ""}${st ? `<span class="st">${st}</span>` : ""}${e?.d ? `<span class="dbl">2回</span>` : ""}</div>`;
    }
    const xl = $("xlog");
    xl.innerHTML = html;
    const now = xl.children[Math.min(G.xLog.length, MAX_MOVES - 1)];
    if (now) xl.scrollLeft = Math.max(0, now.offsetLeft - xl.clientWidth / 2);
    $("feed").innerHTML = A.feed.map(l => `<li class="${l.hot ? "hot" : ""}"><span class="r">${String(l.n).padStart(2, "0")}手</span><span>${esc(l.text)}</span></li>`).join("");
  }
