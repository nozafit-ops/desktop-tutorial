<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ARTIFACT-START -->
<title>ロンドン・チェイス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Zen+Old+Mincho:wght@700;900&display=swap">
<style>
  /* ボードゲームアプリ風の単一テーマ：夜のテーブルに広げた古地図 */
  :root {
    color-scheme: dark;
    --ground: #120E0A;
    --hud: rgba(22, 17, 12, 0.86);
    --hud-solid: #1C1610;
    --hud-2: #2A2118;
    --ink: #F4EAD6;
    --muted: #B9A98E;
    --rule: rgba(227, 179, 65, 0.28);
    --gold: #E3B341;
    --gold-deep: #A87A18;
    --map-ink: #3B2C1E;
    --paper: #FBF5E4;
    --taxi: #F2B51D;
    --bus: #16935B;
    --tube: #D2362C;
    --ferry: #2F7FB0;
    --heli: #7C3AED;
    --black: #0B0906;
    --xrim: #C0271F;
    --good: #5FBF7A;
    --r: 14px;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  button:disabled { cursor: not-allowed; opacity: 0.4; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  #app { position: relative; height: 100%; overflow: hidden; }

  /* ---------------- 盤面 ---------------- */
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: #2A2016; cursor: grab; }
  #map.dragging { cursor: grabbing; }
  .edge { fill: none; stroke-linecap: round; }
  .edge.taxi { stroke: var(--taxi); stroke-width: 6; }
  .edge.taxi.casing { stroke: #7A5A0E; stroke-width: 9; opacity: 0.55; }
  .edge.bus { stroke: var(--bus); stroke-width: 10; }
  .edge.bus.casing { stroke: #0B4F31; stroke-width: 13; opacity: 0.5; }
  .edge.tube { stroke: var(--tube); stroke-width: 13; }
  .edge.tube.casing { stroke: #6E1510; stroke-width: 16; opacity: 0.55; }
  .edge.tube.dash { stroke: #FFE9E3; stroke-width: 3.5; stroke-dasharray: 12 12; stroke-linecap: butt; }
  .edge.boat { stroke: var(--ferry); stroke-width: 7; stroke-dasharray: 18 10; }
  .edge.boat.casing { stroke: #FBF5E4; stroke-width: 11; stroke-dasharray: none; opacity: 0.8; }
  .wedge.boat { fill: var(--ferry); }
  .helipad { fill: rgba(124, 58, 237, 0.16); stroke: var(--heli); stroke-width: 4; stroke-dasharray: 10 6; }
  .heli-h { font-family: Georgia, serif; font-weight: 700; font-size: 26px; fill: #fff; paint-order: stroke; stroke: var(--heli); stroke-width: 9px; stroke-linejoin: round; text-anchor: middle; pointer-events: none; }
  .pawn-num { font-weight: 900; font-size: 15px; fill: #fff; text-anchor: middle; paint-order: stroke; stroke: rgba(0,0,0,0.55); stroke-width: 3px; }
  .tok .ring { fill: none; stroke: #FFF6D8; stroke-width: 5; }
  .stn-base { fill: var(--paper); }
  .stn-rim { fill: none; stroke: var(--map-ink); stroke-width: 3; }
  .wedge.taxi { fill: var(--taxi); }
  .wedge.bus { fill: var(--bus); }
  .wedge.tube { fill: var(--tube); }
  .stn-num { font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 900; font-size: 15px; fill: var(--map-ink); text-anchor: middle; pointer-events: none; }
  .stn-label {
    font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 900; font-size: 17px; fill: var(--map-ink);
    paint-order: stroke; stroke: var(--paper); stroke-width: 6px; stroke-linejoin: round;
    text-anchor: middle; pointer-events: none;
  }
  #map.z0 .stn-label { display: none; }
  #map.z1 .stn-label:not(.hot) { display: none; }
  #map.z0 .stn-label.hot { display: inline; font-size: 24px; stroke-width: 8px; }
  .dest { fill: rgba(255, 244, 200, 0.35); stroke: #FFF6D8; stroke-width: 5; }
  .dest-outer { fill: none; stroke: var(--map-ink); stroke-width: 3; }
  .dest.pulse, .dest-outer.pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .sel { fill: none; stroke: var(--xrim); stroke-width: 6; }
  .poss { fill: var(--xrim); opacity: 0.28; }
  .lastseen { fill: none; stroke: var(--xrim); stroke-width: 4; stroke-dasharray: 8 6; }
  .lastseen-label { font-weight: 900; font-size: 20px; fill: var(--xrim); paint-order: stroke; stroke: var(--paper); stroke-width: 6px; text-anchor: middle; }
  .trail { fill: none; stroke: var(--xrim); stroke-width: 6; stroke-dasharray: 14 9; opacity: 0.9; }
  .tok { transition: transform 0.55s cubic-bezier(.3,.7,.2,1); pointer-events: none; }

  @media (prefers-reduced-motion: reduce) { .tok { transition: none; } .dest.pulse, .dest-outer.pulse { animation: none; } }

  /* ---------------- HUD ---------------- */
  .hud { position: absolute; z-index: 5; }
  .panel {
    background: var(--hud);
    border: 1px solid var(--rule);
    border-radius: var(--r);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
  }
  .top { top: 10px; left: 10px; right: 10px; display: flex; gap: 8px; align-items: stretch; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .iconbtn {
    width: 46px; min-height: 46px; display: grid; place-items: center; border-radius: 12px;
  }
  .iconbtn svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .xcard { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; min-width: 0; }
  .xcard .who { display: flex; flex-direction: column; min-width: 0; }
  .xcard b { font-size: 15px; line-height: 1.2; }
  .xcard small { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .expo { display: inline-flex; align-items: center; gap: 5px; margin-top: 3px; padding: 2px 8px 2px 6px; border-radius: 999px; font-size: 11px; font-weight: 900; white-space: nowrap; }
  .expo i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .expo.found { background: rgba(229, 72, 77, 0.2); color: #FF6B6B; animation: blink 1s ease-in-out infinite; }
  .expo.near { background: rgba(242, 153, 58, 0.2); color: #F5A524; }
  .expo.lost { background: rgba(95, 191, 122, 0.18); color: #6FD08C; }
  @keyframes blink { 50% { opacity: 0.55; } }
  .bubble { pointer-events: none; transform-box: fill-box; transform-origin: 50% 100%; }
  .bubble.pop { animation: pop 0.35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .bubble .bb { stroke: #3B2C1E; stroke-width: 2.5; }
  .bubble.q .bb { fill: #FBF5E4; }
  .bubble.ex .bb { fill: #E5484D; }
  .bubble text { font-family: Georgia, serif; font-weight: 900; font-size: 30px; text-anchor: middle; }
  .bubble.q text { fill: #3B2C1E; }
  .bubble.ex text { fill: #fff; }
  @media (prefers-reduced-motion: reduce) { .bubble.pop, .expo.found { animation: none; } }
  .xcard .chipsx { display: flex; gap: 4px; margin-top: 2px; }
  .portrait { width: 46px; height: 46px; border-radius: 50%; flex: none; display: block; overflow: visible; }
  .portrait.sm { width: 36px; height: 36px; }
  .portrait.lg { width: 84px; height: 84px; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; }
  .dets { display: flex; gap: 6px; padding: 6px; overflow-x: auto; scrollbar-width: none; margin-left: auto; }
  .dets::-webkit-scrollbar { display: none; }
  .det {
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 4px 3px; border-radius: 10px;
    border: 2px solid transparent; min-width: 58px;
  }
  .det.active { border-color: var(--gold); background: rgba(227,179,65,0.12); }
  .det .tks { display: flex; gap: 2px; }
  .tk { font-size: 10px; font-weight: 900; min-width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; padding: 0 3px; color: #1A140C; font-variant-numeric: tabular-nums; }
  .tk.taxi { background: var(--taxi); }
  .tk.bus { background: var(--bus); color: #fff; }
  .tk.tube { background: var(--tube); color: #fff; }
  .tk.boat { background: var(--ferry); color: #fff; }
  .tk.heli { background: var(--heli); color: #fff; }
  .tk.black { background: var(--black); color: #fff; border: 1px solid #8A7A60; }
  .tk.double { background: var(--paper); color: #1A140C; }
  .tk.zero { opacity: 0.3; }

  .side { right: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; padding: 6px; }
  .side .iconbtn:active, .top .iconbtn:active { background: rgba(255,255,255,0.08); }
  .side .iconbtn[aria-pressed="true"] { background: var(--gold); }
  .side .iconbtn[aria-pressed="true"] svg { stroke: #1A140C; }

  .bottom { left: 10px; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .bottom > * { pointer-events: auto; }
  .prompt { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; min-height: 60px; }
  .prompt .txt { flex: 1; min-width: 0; }
  .prompt .t1 { font-weight: 900; font-size: 16px; line-height: 1.3; }
  .prompt .t2 { color: var(--muted); font-size: 12px; line-height: 1.4; }
  .pill { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--hud-2); color: var(--muted); white-space: nowrap; }
  .pill.gold { background: var(--gold); color: #1A140C; }
  .btn.heli-btn { background: var(--heli); color: #fff; }
  .btn {
    min-height: 44px; padding: 0 16px; border-radius: 12px; font-weight: 900; font-size: 15px;
    background: var(--gold); color: #1A140C; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn.ghost { background: var(--hud-2); color: var(--ink); border: 1px solid var(--rule); }
  .btn.wide { width: 100%; }

  .xlog { display: flex; gap: 4px; padding: 6px; overflow-x: auto; scroll-behavior: smooth; scrollbar-width: none; }
  .xlog::-webkit-scrollbar { display: none; }
  .slot {
    position: relative; flex: none; width: 44px; height: 50px; border-radius: 8px;
    background: var(--hud-2); border: 1px solid rgba(255,255,255,0.06);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 900; font-size: 13px;
  }
  .slot .n { position: absolute; top: 2px; left: 5px; font-size: 9px; color: var(--muted); font-weight: 700; }
  .slot.reveal { border: 2px solid var(--xrim); }
  .slot.reveal::after { content: ""; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--xrim); }
  .slot.now { box-shadow: 0 0 0 2px var(--gold); }
  .slot.taxi { background: var(--taxi); color: #1A140C; }
  .slot.bus { background: var(--bus); }
  .slot.tube { background: var(--tube); }
  .slot.black { background: var(--black); }
  .slot.boat { background: var(--ferry); }
  .slot.heli { background: var(--heli); }
  .slot.taxi .n { color: rgba(0,0,0,0.55); }
  .slot.bus .n, .slot.tube .n, .slot.black .n, .slot.boat .n, .slot.heli .n { color: rgba(255,255,255,0.7); }
  .slot .st { font-size: 10px; line-height: 1; margin-top: 2px; }
  .slot .dbl { position: absolute; bottom: 2px; right: 3px; font-size: 8px; }

  /* 切符を選ぶシート */
  .sheet-wrap { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,0.35); }
  .sheet {
    width: min(560px, calc(100% - 20px)); margin-bottom: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
    background: var(--hud-solid); border: 1px solid var(--rule); border-radius: 20px; box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
    animation: up 0.2s ease-out;
  }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet h3 { margin: 0; font-size: 18px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
  .sheet h3 .no { background: var(--paper); color: var(--map-ink); border-radius: 999px; padding: 1px 10px; font-size: 14px; }
  .tickets { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .ticket {
    position: relative; min-height: 92px; border-radius: 12px; padding: 10px 12px; text-align: left;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25), 0 4px 0 rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .ticket::before { content: ""; position: absolute; left: -8px; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: var(--hud-solid); transform: translateY(-50%); }
  .ticket::after { content: ""; position: absolute; right: -8px; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: var(--hud-solid); transform: translateY(-50%); }
  .ticket .en { font-family: "IM Fell English SC", Georgia, serif; font-size: 20px; letter-spacing: 0.06em; line-height: 1; }
  .ticket .ja { font-size: 12px; font-weight: 700; opacity: 0.85; }
  .ticket .cnt { position: absolute; right: 12px; bottom: 8px; font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .ticket.taxi { background: var(--taxi); color: #1A140C; }
  .ticket.bus { background: var(--bus); color: #fff; }
  .ticket.tube { background: var(--tube); color: #fff; }
  .ticket.boat { background: var(--ferry); color: #fff; }
  .ticket.heli { background: var(--heli); color: #fff; }
  .ticket.black { background: var(--black); color: #fff; box-shadow: inset 0 0 0 2px #8A7A60, 0 4px 0 rgba(0,0,0,0.35); }
  .ticket:active:not(:disabled) { transform: translateY(2px); }
  .opt-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--hud-2); border-radius: 12px; padding: 8px 12px; }
  .switch { width: 52px; height: 32px; border-radius: 999px; background: #4A3D2E; position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: left 0.15s; }
  .switch[aria-checked="true"] { background: var(--gold); }
  .switch[aria-checked="true"]::after { left: 23px; }

  /* 全面スクリーン（タイトル・受け渡し・結果） */
  .screen { position: absolute; inset: 0; z-index: 30; overflow-y: auto; display: flex; align-items: center; justify-content: center; padding: 20px 16px; }
  .screen.title { background: radial-gradient(120% 90% at 50% 20%, #2B3A55 0%, #141B29 55%, #0A0D14 100%); }
  .screen.cover { background: rgba(10, 8, 6, 0.96); }
  .screen.dim { background: rgba(10, 8, 6, 0.72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .skyline { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 42%; pointer-events: none; }
  .fog { position: absolute; inset: 0; background: radial-gradient(60% 30% at 30% 80%, rgba(200,210,230,0.12), transparent), radial-gradient(50% 25% at 75% 70%, rgba(200,210,230,0.1), transparent); pointer-events: none; }
  .card {
    position: relative; width: min(520px, 100%); padding: 22px 20px; display: flex; flex-direction: column; gap: 14px;
    background: rgba(20, 16, 12, 0.88); border: 1px solid var(--rule); border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .logo { text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .logo .en { font-family: "IM Fell English SC", Georgia, serif; letter-spacing: 0.35em; color: var(--gold); font-size: 13px; }
  .logo h1 { margin: 0; font-family: "Zen Old Mincho", serif; font-weight: 900; font-size: clamp(30px, 8vw, 44px); letter-spacing: 0.06em; line-height: 1.15; }
  .logo p { margin: 0; color: var(--muted); font-size: 13px; }
  .faces { display: flex; justify-content: center; }
  .faces .portrait { width: 56px; height: 56px; border: 3px solid var(--hud-solid); }
  .faces .portrait + .portrait { margin-left: -12px; }
  .menu { display: flex; flex-direction: column; gap: 10px; }
  .menu .btn { min-height: 54px; font-size: 16px; justify-content: flex-start; padding: 0 14px; }
  .menu .btn .portrait { width: 36px; height: 36px; }
  .menu .btn span.s { font-weight: 400; font-size: 12px; opacity: 0.8; margin-left: auto; }
  .seg { display: flex; background: var(--hud-2); border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; min-height: 38px; border-radius: 9px; font-weight: 700; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--gold); color: #1A140C; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .field label { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .field .seg { flex: 1; max-width: 260px; }
  .rules { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .rules b { color: var(--gold); }
  .card h2 { margin: 0; font-family: "Zen Old Mincho", serif; font-weight: 900; font-size: 26px; text-align: center; text-wrap: balance; }
  .card p.c { margin: 0; text-align: center; color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row .btn { flex: 1; }

  .toast {
    position: absolute; left: 50%; top: 84px; transform: translateX(-50%); z-index: 25;
    padding: 8px 14px; border-radius: 999px; background: var(--hud-solid); border: 1px solid var(--rule);
    font-weight: 700; font-size: 13px; white-space: nowrap; pointer-events: none; animation: fade 2.4s forwards;
  }
  @keyframes fade { 0% { opacity: 0; transform: translate(-50%, -6px); } 10%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
  .drawer { position: absolute; z-index: 22; left: 10px; bottom: 10px; width: min(380px, calc(100% - 20px)); max-height: 60%; display: flex; flex-direction: column; padding: 12px; gap: 8px; }
  .drawer ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 13px; user-select: text; -webkit-user-select: text; }
  .drawer li { display: flex; gap: 8px; }
  .drawer li .r { color: var(--muted); min-width: 34px; font-variant-numeric: tabular-nums; }
  .drawer li.hot { color: var(--gold); font-weight: 700; }

  @media (max-width: 640px) {
    .top { flex-wrap: wrap; }
    .top .xcard { flex: 1; }
    .dets { order: 3; width: 100%; margin-left: 0; justify-content: space-between; padding: 4px; }
    .det { min-width: 0; flex: 1; padding: 3px 2px; }
    .tk { min-width: 14px; font-size: 9px; padding: 0 2px; }
    .side { top: auto; bottom: 150px; transform: none; padding: 4px; gap: 2px; }
    .side .iconbtn { width: 40px; min-height: 40px; }
    .menu .btn span.s { display: none; }
    .portrait { width: 40px; height: 40px; }
    .portrait.sm { width: 30px; height: 30px; }
    .prompt { min-height: 54px; }
    .slot { width: 38px; height: 44px; }
  }
</style>
<!-- ARTIFACT-HEAD-END -->
</head>
<body>
<!-- ARTIFACT-BODY-START -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="pawnShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"></stop>
      <stop offset="0.28" stop-color="#fff" stop-opacity="0.45"></stop>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.08"></stop>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"></stop>
    </linearGradient>
    <radialGradient id="pawnHead" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"></stop>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.1"></stop>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"></stop>
    </radialGradient>
    <!-- ボードゲームの駒（色は color で指定） -->
    <symbol id="pawn" viewBox="-30 -70 60 80">
      <ellipse cy="3" rx="25" ry="7" fill="#000" opacity="0.35"></ellipse>

  }
  const canDouble = G => G.dbl > 0 && !G.doubling && G.xLog.length <= MAX_MOVES - 2;

  function nextPossible(G, type) {
    const occ = new Set(G.det.map(d => d.pos));
    if (type === "heli") return HELI.filter(h => !occ.has(h));
    const nx = new Set();
    for (const s of G.possible) for (const e of ADJ[s]) {
      if ((type === "black" || e.type === type) && !occ.has(e.to)) nx.add(e.to);
    }
    return [...nx].sort((a, b) => a - b);
  }

  function applyX(G, sec, to, type, useDouble) {
    if (type === "heli") { to = pick(heliTargets(G, sec.pos, true)); G.heli--; }
    sec.pos = to;
    sec.path.push(to);
    const n = G.xLog.length + 1;
    const rev = REVEAL.includes(n);
    G.xLog.push({ t: type, p: rev ? to : null, d: useDouble ? 1 : (G.doubling ? 2 : 0) });
    if (type === "black") G.black--;
    G.possible = rev ? [to] : nextPossible(G, type);
    if (rev) G.lastSeen = { pos: to, n };
    if (useDouble) { G.dbl--; G.doubling = true; }
    else { G.doubling = false; G.turn = 0; }
    G.seq++;
    return to;
  }

  function detMoves(G, k) {
    const d = G.det[k];
    const occ = G.det.filter((_, j) => j !== k).map(x => x.pos);
    const out = ADJ[d.pos].filter(e => d.t[e.type] > 0 && !occ.includes(e.to));
    if (d.t.heli > 0 && HELI_SET.has(d.pos) && heliTargets(G, d.pos, false, k).length) out.push({ to: -1, type: "heli" });
    return out;
  }
  const allStuck = G => G.det.every((_, k) => detMoves(G, k).length === 0);

  function advance(G, k) {
    if (k + 1 < G.det.length) G.turn = k + 1;
    else if (G.xLog.length >= MAX_MOVES) { G.over = true; G.winner = "x"; G.reason = "escape"; }
    else G.turn = "x";
  }
  function applyD(G, k, to, type) {
    const d = G.det[k];
    if (type === "heli") to = pick(heliTargets(G, d.pos, false, k));
    d.pos = to;
    d.t[type]--;
    G.possible = G.possible.filter(p => p !== to);
    advance(G, k);
    G.seq++;
    return to;
  }
  function skipD(G, k) { advance(G, k); G.seq++; }
  function finish(G, winner, reason) { G.over = true; G.winner = winner; G.reason = reason; G.seq++; }

  // ---------------- CPU ----------------
  function xSafety(G, to) {
    const cpos = G.det.map(d => d.pos);
    const dmin = Math.min(...cpos.map(c => D[to][c]));
    const dsum = cpos.reduce((s, c) => s + Math.min(D[to][c], 5), 0);
    const exits = ADJ[to].filter(e => !cpos.some(c => D[e.to][c] <= 1)).length;
    let s = Math.min(dmin, 4) * 10 + dsum + exits * 1.5;
    if (dmin <= 1) s -= 40;
    return { s, dmin };
  }
  function aiX(G, sec) {
    const moves = xMoves(G, sec);
    let best = null, bs = -Infinity, bestD = 0;
    for (const to of new Set(moves.filter(m => m.to >= 0).map(m => m.to))) {
      const r = xSafety(G, to);
      const s = r.s + Math.random() * 3;
      if (s > bs) { bs = s; best = to; bestD = r.dmin; }
    }
    // 追い詰められたらヘリでランダムに逃げる
    if (moves.some(m => m.type === "heli")) {
      const lands = heliTargets(G, sec.pos, true);
      const hs = lands.reduce((s, h) => s + xSafety(G, h).s, 0) / lands.length;
      if (best === null || (bestD <= 1 && hs > bs - 5) || hs > bs + 12) return { to: -1, type: "heli", useDouble: false };
    }
    const n = G.xLog.length + 1;
    const nowD = Math.min(...G.det.map(d => D[sec.pos][d.pos]));
    const useDouble = canDouble(G) && bestD <= 1;
    const opts = moves.filter(m => m.to === best && m.type !== "black").map(m => m.type);
    let type = opts[0], size = -1;
    for (const ty of opts) { const k = nextPossible(G, ty).length; if (k > size) { size = k; type = ty; } }
    const wantBlack = G.black > 0 && !REVEAL.includes(n) && (
      (REVEAL.includes(n - 1) && Math.random() < 0.6) ||
      (nowD <= 2 && Math.random() < 0.35));
    if (wantBlack || !type) type = "black";
    return { to: best, type, useDouble };
  }

  function aiD(G, k) {
    const moves = detMoves(G, k);
    const P = G.possible;
    const w = 1 / Math.max(1, P.length);
    const scoreAt = to => {
      let ed = 0;
      for (const p of P) ed += dd(to, p) * w;
      const prob = P.includes(to) ? w : 0;
      let spread = 0;
      G.det.forEach((o, j) => { if (j !== k && D[to][o.pos] <= 1) spread -= 1.2; });
      return prob * 30 - ed * 4 + spread;
    };
    let best = null, bs = -Infinity;
    for (const to of new Set(moves.filter(m => m.to >= 0).map(m => m.to))) {
      const types = moves.filter(m => m.to === to).map(m => m.type);
      const spare = Math.max(...types.map(t => G.det[k].t[t]));
      const s = scoreAt(to) - (spare <= 1 ? 1.5 : 0) + Math.random() * 0.8;
      if (s > bs) { bs = s; best = to; }
    }
    if (moves.some(m => m.type === "heli")) {
      const lands = heliTargets(G, G.det[k].pos, false, k);
      const hs = lands.reduce((s, h) => s + scoreAt(h), 0) / lands.length;
      if (best === null || hs > bs + 6) return { to: -1, type: "heli" };
    }
    const types = moves.filter(m => m.to === best).map(m => m.type);
    types.sort((a, b) => G.det[k].t[b] - G.det[k].t[a]);
    return { to: best, type: types[0] };
  }
  // ======================================================================
  // CORE-END
  // ======================================================================

  // 生成画像を使うときはここにファイル名を入れる（例: map: "art/map.jpg"）
  const ART = { map: null, x: null, d: [null, null, null, null, null], title: null };

  const DCOL = ["#3B82F6", "#F97316", "#A855F7", "#14B8A6", "#E879F9"];
  const AI_DELAY = 650;
  const SAVE_KEY = "london-chase-save-v1";
  const $ = id => document.getElementById(id);
  const SVGNS = "http://www.w3.org/2000/svg";
  function el(tag, attrs = {}, parent) {
    const e = document.createElementNS(SVGNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const dName = k => "刑事" + (k + 1);

  function portrait(kind, k = 0, cls = "") {
    const src = kind === "x" ? ART.x : ART.d[k];
    if (src) return `<span class="portrait ${cls}"><img src="${src}" alt=""></span>`;
    const color = kind === "x" ? "#2A2530" : DCOL[k];
    const bg = kind === "x" ? "rgba(192,39,31,0.28)" : "rgba(255,255,255,0.08)";
    return `<svg class="portrait ${cls}" viewBox="-34 -72 68 80" aria-hidden="true"><circle cx="0" cy="-32" r="33" fill="${bg}"></circle><use href="${kind === "x" ? "#pawn-x" : "#pawn"}" x="-30" y="-70" width="60" height="80" style="color:${color}"></use>${kind === "d" ? `<text x="0" y="-18" class="pawn-num">${k + 1}</text>` : ""}</svg>`;
  }

  // ======================================================================
  // 状態
  // ======================================================================
  const A = {
    role: null,        // "x" | "d" | "pass"
    detCount: DEFAULT_DETS,
    G: null,
    sec: null,
    feed: [],
    sel: null,         // 選択中の移動先
    useDouble: false,
    hints: true,
    cover: null,       // パス&プレイの目隠し："x"（Xへ渡す）| "x-open" | "d"（刑事へ渡す）
    screen: "title",   // title | rules | game | result
    busy: false,
  };
  let timer = null;

  const humanTurn = () => {
    const G = A.G;
    if (!G || G.over) return false;
    if (A.role === "pass") return G.turn === "x" ? A.cover === "x-open" : A.cover === null;
    return A.role === "x" ? G.turn === "x" : G.turn !== "x";
  };
  const xVisible = () => {
    const G = A.G;
    if (!G) return false;
    if (G.over || A.role === "x") return true;
    return A.role === "pass" && A.cover === "x-open";
  };
  const sideName = () => A.role === "x" ? "x" : A.role === "d" ? "d" : null;

  function pushFeed(n, text, hot = false) {
    A.feed.unshift({ n, text, hot });
    if (A.feed.length > 200) A.feed.length = 200;
  }
  function describe(prev, G) {
    for (let i = prev.xLog.length; i < G.xLog.length; i++) {
      const e = G.xLog[i];
      let s = `怪盗Xが ${TYPE[e.t].name} で移動`;
      if (e.d === 1) s = "怪盗Xが2倍移動！ " + s;
      if (xVisible()) s += `（→ ${NO(A.sec.path[i + 1])} ${NAME(A.sec.path[i + 1])}）`;
      pushFeed(i + 1, s);
      if (e.p !== null) { pushFeed(i + 1, `目撃情報！ 怪盗Xは ${NO(e.p)} ${NAME(e.p)} にいる`, true); toast(`目撃情報！ 怪盗Xは ${NAME(e.p)} に`); }
    }
    G.det.forEach((d, k) => {
      const p = prev.det[k];
      if (p && p.pos !== d.pos) {
        const used = DET_TYPES.find(t => p.t[t] !== d.t[t]);
        pushFeed(G.xLog.length, `${dName(k)} → ${NO(d.pos)} ${NAME(d.pos)}（${used ? TYPE[used].name : ""}）`);
      }
    });
    if (!prev.over && G.over) pushFeed(G.xLog.length, G.winner === "x" ? "怪盗Xの勝ち！" : "怪盗Xを逮捕！ 刑事の勝ち！", true);
  }

  // 刑事側から見た怪盗Xの見つかり具合（公開情報だけで決まる）
  function exposure(G) {
    const n = G.possible.length;
    if (n <= 1) return { level: "found", n, label: "発見されている", help: "刑事に居場所がばれています" };
    if (n <= 4) return { level: "near", n, label: `追われている・候補${n}駅`, help: "刑事は候補をかなり絞り込んでいます" };
    return { level: "lost", n, label: `見失われている・候補${n}駅`, help: "刑事はまだ居場所をつかめていません" };
  }
  // 刑事ごとの吹き出し："!" は怪盗Xを捕捉している、"?" は見失っている
  function detBubble(G, k) {
    const e = exposure(G);
    if (e.level === "found") return "!";
    const near = Math.min(...G.possible.map(p => D[G.det[k].pos][p]));
    return e.level === "near" && near <= 2 ? "!" : "?";
  }
  let lastExpo = null;
  function noteExposure() {
    const G = A.G;
    if (!G || G.over) { lastExpo = null; return; }
    const lv = exposure(G).level;
    if (lastExpo && lv !== lastExpo) {
      if (lv === "found") toast("刑事が怪盗Xを発見！");
      else if (lv === "lost") toast("刑事は怪盗Xを見失った");
      else if (lastExpo === "lost") toast("刑事が怪盗Xに迫っている");
    }
    lastExpo = lv;
  }

  function save() {
    try {
      if (!A.G || A.G.over) localStorage.removeItem(SAVE_KEY);
      else localStorage.setItem(SAVE_KEY, JSON.stringify({ role: A.role, detCount: A.detCount, G: A.G, sec: A.sec, feed: A.feed.slice(0, 60), cover: A.cover === "x-open" ? "x" : A.cover }));
    } catch (e) {}
  }
  function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { return null; } }

  // ======================================================================
  // 進行
  // ======================================================================
  function startGame(role) {
    clearTimeout(timer);
    const { G, sec } = newGame(A.detCount);
    Object.assign(A, { role, G, sec, feed: [], sel: null, useDouble: false, screen: "game", busy: false });
    A.cover = role === "pass" ? "x" : null;
    pushFeed(0, role === "x" ? `あなたは怪盗X。${MAX_MOVES}手逃げ切れば勝ち！` : role === "d" ? `あなたは刑事${A.detCount}人を指揮する。怪盗Xを逮捕せよ！` : "パス&プレイ。怪盗X役の人から始めます。", true);
    buildTokens();
    fitView(false);
    step();
    if (role !== "pass") setTimeout(() => focusTurn(), 50);
  }

  function resume(s) {
    clearTimeout(timer);
    Object.assign(A, { role: s.role, detCount: s.detCount, G: s.G, sec: s.sec, feed: s.feed || [], sel: null, useDouble: false, screen: "game", busy: false, cover: s.cover || null });
    buildTokens();
    fitView(false);
    step();
  }

  function apply(fn) {
    const prev = clone(A.G);
    fn();
    if (!A.G.over && A.G.det.some(d => d.pos === A.sec.pos)) finish(A.G, "d", "caught");
    describe(prev, A.G);
  }

  function step() {
    clearTimeout(timer);
    const G = A.G;
    while (!G.over) {
      if (G.turn === "x") {
        if (!xMoves(G, A.sec).length) { apply(() => finish(G, "d", "trapped")); continue; }
        if (A.role === "pass" && A.cover === null) A.cover = "x";
        if (A.role === "x" || A.role === "pass") { save(); render(); return; }
        render();
        timer = setTimeout(() => {
          const m = aiX(G, A.sec);
          apply(() => applyX(G, A.sec, m.to, m.type, m.useDouble));
          step();
        }, AI_DELAY);
        return;
      }
      const k = G.turn;
      if (allStuck(G)) { apply(() => finish(G, "x", "stuck")); continue; }
      if (!detMoves(G, k).length) {
        pushFeed(G.xLog.length, `${dName(k)} は使える切符がないので待機`);
        apply(() => skipD(G, k));
        continue;
      }
      if (A.role !== "x") { save(); render(); ensureVisible(G.det[k].pos); return; }
      render();
      timer = setTimeout(() => {
        const m = aiD(G, k);
        apply(() => applyD(G, k, m.to, m.type));
        step();
      }, AI_DELAY);
      return;
    }
    save();
    A.cover = null;
    render();
    setTimeout(() => { A.screen = "result"; renderScreen(); }, 900);
  }

  function commitX(to, type) {
    const dbl = A.useDouble && canDouble(A.G);
    A.sel = null; A.useDouble = false;
    let landed = to;
    apply(() => { landed = applyX(A.G, A.sec, to, type, dbl); });
    if (type === "heli") toast(`ヘリで ${NO(landed)} ${NAME(landed)} に着陸`);
    if (A.role === "pass" && !A.G.over && A.G.turn !== "x") A.cover = "d";
    step();
  }
  function commitD(k, to, type) {
    A.sel = null;
    let landed = to;
    apply(() => { landed = applyD(A.G, k, to, type); });
    if (type === "heli") toast(`${dName(k)} はヘリで ${NO(landed)} ${NAME(landed)} に着陸`);
    step();
  }

  // 駅をタップ
  function onStationTap(i) {
    const G = A.G;
    if (!G || A.screen !== "game") return;
    if (!humanTurn()) { toast(`${NO(i)} ${NAME(i)}`); return; }
    const opts = G.turn === "x" ? xMoves(G, A.sec).filter(m => m.to === i) : detMoves(G, G.turn).filter(m => m.to === i);
    if (!opts.length) { toast(`${NO(i)} ${NAME(i)} へは行けません`); return; }
    A.sel = i;
    render();
    openSheet();
  }

  // ======================================================================
  // 盤面（パン・ズーム）
  // ======================================================================
  const V = { s: 1, tx: 0, ty: 0, fit: 1 };
  const mapEl = $("map"), world = $("world");
  let anim = null;

  function vpSize() { const r = mapEl.getBoundingClientRect(); return { w: r.width, h: r.height, r }; }
  function clampView() {
    const { w, h } = vpSize();
    V.s = Math.min(3, Math.max(V.fit * 0.85, V.s));
    const mw = W * V.s, mh = H * V.s, pad = 80;
    V.tx = mw + pad * 2 <= w ? (w - mw) / 2 : Math.min(pad, Math.max(w - mw - pad, V.tx));
    V.ty = mh + pad * 2 <= h ? (h - mh) / 2 : Math.min(pad + 60, Math.max(h - mh - pad - 110, V.ty));
  }
  function applyView() {
    world.setAttribute("transform", `translate(${V.tx.toFixed(1)} ${V.ty.toFixed(1)}) scale(${V.s.toFixed(4)})`);
    mapEl.classList.toggle("z0", V.s < 0.62);
    mapEl.classList.toggle("z1", V.s >= 0.62 && V.s < 1.15);
  }
  function setView(s, tx, ty) { V.s = s; V.tx = tx; V.ty = ty; clampView(); applyView(); }
  function animateView(s, tx, ty, ms = 380) {
    cancelAnimationFrame(anim);
    const from = { ...V }, to = { s, tx, ty };
    const tmp = { ...V }; Object.assign(V, to); clampView(); Object.assign(to, { s: V.s, tx: V.tx, ty: V.ty }); Object.assign(V, tmp);
    const t0 = performance.now();
    const tick = now => {
      const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      V.s = from.s + (to.s - from.s) * e; V.tx = from.tx + (to.tx - from.tx) * e; V.ty = from.ty + (to.ty - from.ty) * e;
      applyView();
      if (k < 1) anim = requestAnimationFrame(tick);
    };
    anim = requestAnimationFrame(tick);
  }
  function fitView(animate = true) {
    const { w, h } = vpSize();
    V.fit = Math.min(w / W, (h - 120) / H);
    const s = V.fit * 1.02, tx = (w - W * s) / 2, ty = (h - H * s) / 2 + 10;
    animate ? animateView(s, tx, ty) : setView(s, tx, ty);
  }
  function zoomAt(factor, cx, cy, animate = true) {
    const s = Math.min(3, Math.max(V.fit * 0.85, V.s * factor));
    const k = s / V.s;
    const tx = cx - (cx - V.tx) * k, ty = cy - (cy - V.ty) * k;
    animate ? animateView(s, tx, ty, 220) : setView(s, tx, ty);
  }
  function centerOn(i, s = Math.max(V.s, 0.95)) {
    const { w, h } = vpSize();
    const [, x, y] = STATIONS[i];
    animateView(s, w / 2 - x * s, h / 2 - y * s - 20);
  }
  function ensureVisible(i) {
    const { w, h } = vpSize();
    const [, x, y] = STATIONS[i];
    const sx = x * V.s + V.tx, sy = y * V.s + V.ty;
    if (sx < 70 || sx > w - 70 || sy < 110 || sy > h - 170) centerOn(i, V.s);
  }
  function focusTurn() {
    const G = A.G;
    if (!G) return;
    if (G.turn === "x") { if (xVisible()) centerOn(A.sec.pos); else if (G.lastSeen) centerOn(G.lastSeen.pos); else fitView(); }
    else centerOn(G.det[G.turn].pos);
  }

  // ポインター操作：1本指でパン、2本指でピンチ、タップで駅を選ぶ
  const ptrs = new Map();
  let gesture = null;
  mapEl.addEventListener("pointerdown", e => {
    mapEl.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    cancelAnimationFrame(anim);
    if (ptrs.size === 1) gesture = { type: "pan", sx: e.clientX, sy: e.clientY, tx: V.tx, ty: V.ty, moved: 0, t: performance.now() };
    else if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      gesture = { type: "pinch", d: Math.hypot(a.x - b.x, a.y - b.y), s: V.s, tx: V.tx, ty: V.ty, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, moved: 99 };
    }
  });
  mapEl.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!gesture) return;
    const { r } = vpSize();
    if (gesture.type === "pan" && ptrs.size === 1) {
      const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;
      gesture.moved = Math.max(gesture.moved, Math.hypot(dx, dy));
      if (gesture.moved > 6) { mapEl.classList.add("dragging"); setView(V.s, gesture.tx + dx, gesture.ty + dy); }
    } else if (gesture.type === "pinch" && ptrs.size >= 2) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
      const s = Math.min(3, Math.max(V.fit * 0.85, gesture.s * d / gesture.d));
      const k = s / gesture.s;
      const gx = gesture.mx - r.left, gy = gesture.my - r.top;
      setView(s, mx - (gx - gesture.tx) * k, my - (gy - gesture.ty) * k);
    }
  });
  const endPtr = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    mapEl.classList.remove("dragging");
    if (gesture && gesture.type === "pan" && gesture.moved <= 6 && e.type === "pointerup" && performance.now() - gesture.t < 600) {
      const { r } = vpSize();
      const wx = (e.clientX - r.left - V.tx) / V.s, wy = (e.clientY - r.top - V.ty) / V.s;
      let best = -1, bd = Math.max(34, 26 / V.s);
      STATIONS.forEach(([, x, y], i) => { const d = Math.hypot(x - wx, y - wy); if (d < bd) { bd = d; best = i; } });
      if (best >= 0) onStationTap(best);
    }
    if (ptrs.size === 1) {
      const [p] = [...ptrs.values()];
      gesture = { type: "pan", sx: p.x, sy: p.y, tx: V.tx, ty: V.ty, moved: 99, t: 0 };
    } else if (!ptrs.size) gesture = null;
  };
  mapEl.addEventListener("pointerup", endPtr);
  mapEl.addEventListener("pointercancel", endPtr);

  // 盤面の描画
  // ======================================================================
  function smoothPath(pts) {
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
    }
    return d;
  }
  const P = i => STATIONS[i].slice(1, 3);

  // 背景（古地図）を SVG で組み立て、ビットマップにして敷く
  function riverPolygon() {
    const L = [], R = [];
    for (let i = 0; i < RIVER.length; i++) {
      const [x, y, w] = RIVER[i];
      const a = RIVER[Math.max(0, i - 1)], b = RIVER[Math.min(RIVER.length - 1, i + 1)];
      const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      L.push([x + nx * w / 2, y + ny * w / 2]);
      R.push([x - nx * w / 2, y - ny * w / 2]);
    }
    return smoothPath(L) + " L" + smoothPath(R.reverse()).slice(1) + " Z";
  }
  function backgroundSVG() {

    const SP = 30, cols = Math.ceil(W / SP) + 3, rows = Math.ceil(H / SP) + 3, G = [];
    for (let r = 0; r < rows; r++) { G.push([]); for (let c = 0; c < cols; c++) G[r].push([(c - 1) * SP + (rnd() - 0.5) * 18, (r - 1) * SP + (rnd() - 0.5) * 18]); }
    const pt = q => q[0].toFixed(0) + "," + q[1].toFixed(0);
    let d = "", blocks = "";
    for (let r = 0; r < rows - 1; r++) for (let c = 0; c < cols - 1; c++) {

      if (rnd() > 0.18) d += `M${pt(G[r][c])}L${pt(G[r + 1][c])}`;
      if (rnd() < 0.55) {

      ward(2600, 1000, "TOWER HAMLETS"), ward(400, 900, "BATTERSEA"), ward(1450, 250, "CAMDEN"), ward(1700, 1500, "GREENWICH"));
    const mid = RIVER[18];

    o.push(lm(near("ウォータールー", -80, -10), 1.4, `<circle cy="-26" r="22" fill="none" ${ink}/>` + Array.from({ length: 12 }, (_, a) => `<path d="M0,-26 L${(22 * Math.cos(a * Math.PI / 6)).toFixed(1)},${(-26 + 22 * Math.sin(a * Math.PI / 6)).toFixed(1)}" ${ink}/>`).join("") + `<path d="M0,-26 L-10,0 M0,-26 L10,0" ${ink}/>`));
    o.push(lm(near("グリーン・パーク", 60, 50), 1.5, `<rect x="-22" y="-12" width="44" height="12" ${fill} ${ink}/><path d="M-7,-12 L0,-18 L7,-12 Z" ${fill} ${ink}/><path d="M0,-18 L0,-28 L7,-26 L0,-23" fill="#C0271F" ${ink}/>`));

  async function renderBackground() {
    const img = $("bgimg");
    if (ART.map) { img.setAttribute("href", ART.map); return; }
    const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(backgroundSVG());
    try {
      const im = new Image();
      im.src = url;
      await im.decode();
      const k = 1.25;
      const c = document.createElement("canvas");
      c.width = Math.round(W * k); c.height = Math.round(H * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.9));
      if (!blob) throw new Error("no blob");
      img.setAttribute("href", URL.createObjectURL(blob));
    } catch (e) {
      img.setAttribute("href", url);
    }
  }

  function buildBoard() {
    const gE = $("gEdges"), gS = $("gStations"), gL = $("gLabels");
    // 路線：水上バス → 地下鉄 → バス → タクシーの順に重ねる
    const layers = { boat: el("g", {}, gE), tube: el("g", {}, gE), bus: el("g", {}, gE), taxi: el("g", {}, gE) };
    for (const [key, types] of edgeTypes) {
      const [a, b] = key.split("-").map(Number);
      const [x1, y1] = P(a), [x2, y2] = P(b);
      const len = Math.hypot(x2 - x1, y2 - y1);
      const nx = -(y2 - y1) / len, ny = (x2 - x1) / len;
      const list = ["boat", "tube", "bus", "taxi"].filter(t => types.has(t));
      list.forEach((t, k) => {
        const off = (k - (list.length - 1) / 2) * 14;
        const pts = { x1: x1 + nx * off, y1: y1 + ny * off, x2: x2 + nx * off, y2: y2 + ny * off };
        const g = el("g", {}, layers[t]);
        el("title", {}, g).textContent = types.get(t).join("・");
        el("line", { ...pts, class: `edge ${t} casing` }, g);
        el("line", { ...pts, class: `edge ${t}` }, g);
        if (t === "tube") el("line", { ...pts, class: "edge tube dash" }, g);
      });
    }
    // 駅：上半分を使える交通手段で塗り分け、下半分に番号。ヘリポートは H マーク
    const R = 22;
    STATIONS.forEach(([name, x, y], i) => {
      const g = el("g", {}, gS);
      if (HELI_SET.has(i)) {
        el("circle", { cx: x, cy: y, r: R + 16, class: "helipad" }, g);
        el("text", { x: x + R + 10, y: y - R - 4, class: "heli-h" }, g).textContent = "H";
      }
      el("circle", { cx: x, cy: y, r: R, class: "stn-base" }, g);
      const ts = MOVE_TYPES.filter(t => ADJ[i].some(e => e.type === t));
      ts.forEach((t, k) => {
        const a0 = Math.PI + Math.PI * k / ts.length, a1 = Math.PI + Math.PI * (k + 1) / ts.length;
        el("path", { d: `M${x},${y} L${(x + R * Math.cos(a0)).toFixed(2)},${(y + R * Math.sin(a0)).toFixed(2)} A${R},${R} 0 0 1 ${(x + R * Math.cos(a1)).toFixed(2)},${(y + R * Math.sin(a1)).toFixed(2)} Z`, class: "wedge " + t }, g);
      });
      el("path", { d: `M${x - R},${y} H${x + R}`, stroke: "#3B2C1E", "stroke-width": 1.5 }, g);
      el("circle", { cx: x, cy: y, r: R, class: "stn-rim" }, g);
      el("text", { x, y: y + 16, class: "stn-num" }, g).textContent = NO(i);
      el("text", { x, y: y + R + 24, class: "stn-label", id: "lbl" + i }, gL).textContent = name;
    });
  }

      u.style.color = kind === "x" ? "#2A2530" : DCOL[k];
      if (kind === "d") {
        el("text", { x: 0, y: -18, class: "pawn-num" }, g).textContent = k + 1;
        const b = el("g", { class: "bubble q", transform: "translate(22 -78)" }, g);
        el("path", { class: "bb", d: "M-20,-44 h40 a8,8 0 0 1 8,8 v28 a8,8 0 0 1 -8,8 h-12 l-12,12 l2,-12 h-18 a8,8 0 0 1 -8,-8 v-28 a8,8 0 0 1 8,-8 Z" }, b);
        el("text", { x: 0, y: -13 }, b).textContent = "?";

  function renderMap() {
    const G = A.G;
    const gP = $("gPoss"), gD = $("gDest"), gM = $("gMarks"), gTr = $("gTrail");
    gP.replaceChildren(); gD.replaceChildren(); gM.replaceChildren(); gTr.replaceChildren();
    document.querySelectorAll(".stn-label.hot").forEach(l => l.classList.remove("hot"));
    if (!G) return;
    const hot = i => $("lbl" + i)?.classList.add("hot");
    const showX = xVisible();

    if (!showX && A.hints && !G.over) for (const p of G.possible) { const [x, y] = P(p); el("circle", { cx: x, cy: y, r: 32, class: "poss" }, gP); }
    const path = G.over || showX ? A.sec.path : null;
    if (path && path.length > 1) el("path", { d: "M" + path.map(p => P(p).join(",")).join(" L"), class: "trail", opacity: G.over ? 0.95 : 0.45 }, gTr);

    if (humanTurn()) {
      const moves = G.turn === "x" ? xMoves(G, A.sec) : detMoves(G, G.turn);
      for (const to of new Set(moves.filter(m => m.to >= 0).map(m => m.to))) {
        const [x, y] = P(to);
        el("circle", { cx: x, cy: y, r: 31, class: "dest pulse" }, gD);
        el("circle", { cx: x, cy: y, r: 35, class: "dest-outer pulse" }, gD);
        hot(to);
      }
    }
    if (A.sel !== null && A.sel >= 0) { const [x, y] = P(A.sel); el("circle", { cx: x, cy: y, r: 36, class: "sel" }, gM); hot(A.sel); }
    if (!showX && G.lastSeen && !G.over) {
      const [x, y] = P(G.lastSeen.pos);
      el("circle", { cx: x, cy: y, r: 40, class: "lastseen" }, gM);
      el("text", { x, y: y - 48, class: "lastseen-label" }, gM).textContent = `X? ${G.lastSeen.n}手目`;
    }

    // コマ（同じ駅に重なったら少しずらす）
    const stack = {};
    const off = p => { const k = stack[p] = (stack[p] || 0) + 1; return [[0, 0], [30, -8], [-30, -8], [22, 22], [-22, 22], [0, 28]][k - 1] || [0, 0]; };
    const tx = $("tokX");
    if (tx) {
      tx.style.display = showX ? "" : "none";
      if (showX) { const [dx, dy] = off(A.sec.pos); placeToken(tx, A.sec.pos, dx, dy); hot(A.sec.pos); }
      tx.querySelector(".ring").setAttribute("visibility", G.turn === "x" && !G.over ? "visible" : "hidden");
    }
    G.det.forEach((d, k) => {
      const t = $("tokD" + k);
      if (!t) return;
      const [dx, dy] = off(d.pos);
      placeToken(t, d.pos, dx, dy);
      t.querySelector(".ring").setAttribute("visibility", G.turn === k && !G.over ? "visible" : "hidden");
      const b = t.querySelector(".bubble");
      if (b) {
        const mark = G.over ? "" : detBubble(G, k);
        b.style.display = mark ? "" : "none";
        const tx_ = b.querySelector("text");
        if (tx_.textContent !== mark) {
          tx_.textContent = mark;
          b.setAttribute("class", "bubble pop " + (mark === "!" ? "ex" : "q"));
        }
      }
      hot(d.pos);
    });
  }

  function renderTop() {
    const G = A.G;
    if (!G) { $("xcard").innerHTML = ""; $("dets").innerHTML = ""; return; }
    const nx = REVEAL.find(r => r > G.xLog.length);
    const ex = exposure(G);
    $("xcard").innerHTML = `${portrait("x")}<span class="who"><b>怪盗X</b>
      <small class="nx">${G.over ? "ゲーム終了" : nx ? `次の出現 ${nx}手目` : "出現なし"}</small>
      ${G.over ? "" : `<span class="expo ${ex.level}" title="${ex.help}"><i></i>${ex.label}</span>`}
      <span class="chipsx"><span class="tk black ${G.black ? "" : "zero"}">黒${G.black}</span><span class="tk double ${G.dbl ? "" : "zero"}">2×${G.dbl}</span><span class="tk heli ${G.heli ? "" : "zero"}">H${G.heli}</span></span></span>`;
    $("xcard").classList.toggle("active", G.turn === "x");
    $("dets").innerHTML = G.det.map((d, k) => `
      <button class="det ${!G.over && G.turn === k ? "active" : ""}" data-act="focusD" data-k="${k}" aria-label="${dName(k)}：${DET_TYPES.map(t => TYPE[t].name + d.t[t]).join("・")}">
        ${portrait("d", k, "sm")}
        <span class="tks">${DET_TYPES.map(t => `<span class="tk ${t} ${d.t[t] ? "" : "zero"}">${t === "heli" ? "H" + d.t[t] : d.t[t]}</span>`).join("")}</span>
      </button>`).join("");
  }

  function renderPrompt() {
    const G = A.G, el_ = $("prompt");
    if (!G) { el_.innerHTML = ""; return; }
    const move = `<span class="pill gold">${G.xLog.length}/${MAX_MOVES}手</span>`;
    if (G.over) {
      el_.innerHTML = `${portrait(G.winner === "x" ? "x" : "d", 0)}<div class="txt"><div class="t1">${G.winner === "x" ? "怪盗Xの勝ち" : "刑事チームの勝ち"}</div><div class="t2">赤い点線が怪盗Xの逃走経路です</div></div><button class="btn" data-act="result">結果</button>`;
      return;
    }
    const who = G.turn === "x" ? portrait("x") : portrait("d", G.turn);
    const name = G.turn === "x" ? "怪盗X" : dName(G.turn);
    let t1, t2;
    if (humanTurn()) {
      t1 = `${name} の番`;
      t2 = G.turn === "x"
        ? (G.doubling ? "2倍移動の2手目。もう1駅進んでください" : `${exposure(G).help}。光っている駅をタップして逃げる`)
        : "光っている駅をタップ。怪盗Xのいる駅に入れば逮捕";
    } else {
      t1 = `${name} が考え中…`;
      t2 = G.turn === "x" ? "怪盗Xの切符は下の記録に残ります" : "CPUの刑事が動いています";
    }
    let heliBtn = "";
    if (humanTurn()) {
      const moves = G.turn === "x" ? xMoves(G, A.sec) : detMoves(G, G.turn);
      if (moves.some(m => m.type === "heli")) heliBtn = `<button class="btn heli-btn" data-act="heli">ヘリで飛ぶ</button>`;
    }
    el_.innerHTML = `${who}<div class="txt"><div class="t1">${t1}</div><div class="t2">${t2}</div></div>${heliBtn || move}`;
  }

  function renderLog() {
    const G = A.G;
    if (!G) { $("xlog").innerHTML = ""; return; }
    const showX = xVisible();
    let html = "";
    for (let i = 0; i < MAX_MOVES; i++) {
      const e = G.xLog[i];
      const cls = ["slot"];
      if (e) cls.push(e.t);
      if (REVEAL.includes(i + 1)) cls.push("reveal");
      if (!G.over && i === G.xLog.length) cls.push("now");
      let st = "";
      if (e && e.p !== null) st = NO(e.p);
      else if (e && showX) st = NO(A.sec.path[i + 1]);
      const title = `${i + 1}手目${e ? "：" + TYPE[e.t].name : ""}${st ? "（" + NAME(st - 1) + "）" : ""}`;
      html += `<div class="${cls.join(" ")}" title="${esc(title)}"><span class="n">${i + 1}</span>${e ? TYPE[e.t].short : ""}${st ? `<span class="st">${st}</span>` : ""}${e?.d ? `<span class="dbl">2×</span>` : ""}</div>`;
    }
    const xl = $("xlog");
    xl.innerHTML = html;
    const now = xl.children[Math.min(G.xLog.length, MAX_MOVES - 1)];
    if (now) xl.scrollLeft = Math.max(0, now.offsetLeft - xl.clientWidth / 2);
    $("feed").innerHTML = A.feed.map(l => `<li class="${l.hot ? "hot" : ""}"><span class="r">${String(l.n).padStart(2, "0")}手</span><span>${esc(l.text)}</span></li>`).join("");
  }

  // 切符を選ぶシート
  function openSheet() { renderSheet(); }
  function renderSheet() {
    const wrap = $("sheet");
    const G = A.G;
    if (A.sel === null || !G || !humanTurn()) { wrap.hidden = true; return; }
    const to = A.sel;
    const isX = G.turn === "x";
    let tickets = "", opt = "", title;
    if (to === -1) {
      const cnt = isX ? G.heli : G.det[G.turn].t.heli;
      title = `<span class="no">H</span>ヘリで飛ぶ`;
      tickets = `<button class="ticket heli" data-act="ticket" data-type="heli"><span class="en">Helicopter</span><span class="ja">ほかのヘリポートのどこかへ着陸（ランダム）</span><span class="cnt">${cnt}</span></button>`;
      opt = `<p style="margin:0;color:var(--muted);font-size:13px">着陸できるヘリポート：${heliTargets(G, isX ? A.sec.pos : G.det[G.turn].pos, isX, isX ? -1 : G.turn).map(h => NO(h)).join("・")}</p>`;
    } else if (isX) {
      title = `<span class="no">${NO(to)}</span>${esc(NAME(to))} へ`;
      const opts = xMoves(G, A.sec).filter(m => m.to === to).map(m => m.type);
      tickets = ["taxi", "bus", "tube", "boat", "black"].filter(t => opts.includes(t)).map(t =>
        `<button class="ticket ${t}" data-act="ticket" data-type="${t}"><span class="en">${TYPE[t].en}</span><span class="ja">${TYPE[t].name}${t === "black" ? "（乗り物を隠す）" : ""}</span>${t === "black" ? `<span class="cnt">${G.black}</span>` : ""}</button>`).join("");
      if (canDouble(G)) opt = `<div class="opt-row"><div><b>2倍移動</b><div style="font-size:12px;color:var(--muted)">この後もう1駅続けて動く（残り${G.dbl}）</div></div><button class="switch" role="switch" aria-checked="${A.useDouble}" data-act="double" aria-label="2倍移動"></button></div>`;
    } else {
      title = `<span class="no">${NO(to)}</span>${esc(NAME(to))} へ`;
      const k = G.turn, d = G.det[k];
      const opts = detMoves(G, k).filter(m => m.to === to).map(m => m.type);
      tickets = MOVE_TYPES.filter(t => opts.includes(t)).map(t =>
        `<button class="ticket ${t}" data-act="ticket" data-type="${t}"><span class="en">${TYPE[t].en}</span><span class="ja">${TYPE[t].name}</span><span class="cnt">${d.t[t]}</span></button>`).join("");
    }
    wrap.hidden = false;
    wrap.innerHTML = `<div class="sheet" role="dialog" aria-label="切符を選ぶ">
      <h3>${title}</h3>
      <div class="tickets">${tickets}</div>
      ${opt}
      <button class="btn ghost wide" data-act="cancel">キャンセル</button></div>`;
  }

  // 全面スクリーン
  function renderScreen() {
    const sc = $("screen");
    const G = A.G;
    sc.className = "screen";
    if (A.screen === "title") {
      const sv = loadSave();
      sc.hidden = false;
      sc.classList.add("title");
      sc.innerHTML = `${skylineSVG()}<div class="fog"></div>
        <div class="card">
          <div class="logo"><div class="faces">${portrait("x", 0, "lg")}${[0, 1, 2].map(k => portrait("d", k, "lg")).join("")}</div>
            <div class="en">LONDON · MDCCCXCV</div><h1>ロンドン・チェイス</h1><p>霧の街に消えた怪盗Xを、刑事たちが追う</p></div>
          <div class="menu">
            ${sv ? `<button class="btn" data-act="resume">つづきから<span class="s">${sv.G.xLog.length}/${MAX_MOVES}手・${sv.role === "x" ? "怪盗X" : sv.role === "d" ? "刑事" : "パス&プレイ"}</span></button>` : ""}
            <button class="btn ${sv ? "ghost" : ""}" data-act="start" data-role="x">${portrait("x")}怪盗Xで遊ぶ<span class="s">CPUの刑事から逃げる</span></button>
            <button class="btn ghost" data-act="start" data-role="d">${portrait("d", 0)}刑事で遊ぶ<span class="s">CPUの怪盗Xを追う</span></button>
            <button class="btn ghost" data-act="start" data-role="pass">${portrait("d", 1)}みんなで遊ぶ<span class="s">1台を回すパス&プレイ</span></button>
          </div>
          <div class="field"><label>刑事の人数</label><div class="seg">${[3, 4, 5].map(n => `<button data-act="dets" data-n="${n}" aria-pressed="${A.detCount === n}">${n}人</button>`).join("")}</div></div>
          <p class="c" style="font-size:12px;margin-top:-6px">3人が標準。刑事を増やすほど怪盗Xは苦しくなります</p>
          <button class="btn ghost wide" data-act="rules">遊び方</button>
          <div class="row"><button class="btn ghost" data-act="exportBg" data-fmt="png">背景画像を保存（PNG）</button><button class="btn ghost" data-act="exportBg" data-fmt="svg">元データ（SVG）</button></div>
        </div>`;
      return;
    }
    if (A.screen === "rules") {
      sc.hidden = false;
      sc.classList.add("title");
      sc.innerHTML = `<div class="card"><h2>遊び方</h2><ol class="rules">
        <li><b>怪盗X</b> 1人と <b>刑事</b> 3〜5人の追いかけっこ。駅から駅へ、1手に1駅ずつ動きます。</li>
        <li>乗り物は4種類。<b>タクシー</b>（黄）は近くの駅へ。<b>バス</b>（緑）と <b>地下鉄</b>（赤）は遠くまで一気に進めます。地下鉄は外周を一周する環状線と、中央を貫く3路線です。<b>水上バス</b>（青）はテムズ川沿いと川に浮かぶ2つの島を結びます。駅マークの上半分の色が、その駅で使える乗り物です。</li>
        <li><b>ヘリポート</b>（H）からはヘリで飛べます。行き先は選べず、ほかのヘリポートのどこかにランダムで着陸します。島へは水上バスかヘリでしか行けません。</li>
        <li>怪盗Xの居場所は秘密。刑事にわかるのは下の記録に残る <b>切符の種類</b> だけ。${REVEAL.join("・")}手目の後だけ姿を現します。</li>
        <li>刑事の切符は有限（タクシー${DET_TICKETS.taxi}・バス${DET_TICKETS.bus}・地下鉄${DET_TICKETS.tube}・水上バス${DET_TICKETS.boat}・ヘリ${DET_TICKETS.heli}）。</li>
        <li>怪盗Xは <b>黒チケット</b>（乗り物を隠す。刑事の人数と同じ枚数）、<b>2倍移動</b> ${X_DOUBLE}枚、<b>ヘリ</b> ${X_HELI}枚を持っています。</li>
        <li>刑事の駒の吹き出しは、刑事がどこまで怪盗Xをつかんでいるかの合図です。<b>？</b>は見失っている、<b>！</b>は捕捉している。怪盗Xの札には「見失われている／追われている／発見されている」が表示されます。</li>
        <li>刑事が怪盗Xのいる駅に入れば <b>逮捕</b>。${MAX_MOVES}手逃げ切れば怪盗Xの勝ち。</li>
        <li>操作：ドラッグで移動、ピンチ・ホイール・ダブルタップで拡大。光る駅をタップすると切符を選べます。ヘリは下の「ヘリで飛ぶ」ボタンから。</li>
      </ol><button class="btn wide" data-act="title">戻る</button></div>`;
      return;
    }
    if (A.screen === "result" && G && G.over) {
      const xWin = G.winner === "x";
      const you = A.role === "x" ? xWin : A.role === "d" ? !xWin : null;
      const reason = { escape: `${MAX_MOVES}手を逃げ切りました。`, stuck: "刑事が全員、使える切符を失いました。", caught: "刑事が怪盗Xのいる駅に踏み込みました。", trapped: "怪盗Xは四方を塞がれて動けなくなりました。" }[G.reason] || "";
      sc.hidden = false;
      sc.classList.add("dim");
      sc.innerHTML = `<div class="card"><div class="faces">${xWin ? portrait("x", 0, "lg") : G.det.map((_, k) => portrait("d", k, "lg")).join("")}</div>
        <h2>${you === null ? (xWin ? "怪盗Xの逃走成功" : "怪盗X、逮捕！") : you ? "あなたの勝ち！" : "あなたの負け…"}</h2>
        <p class="c">${G.xLog.length}手目で決着。${reason}</p>
        <div class="row"><button class="btn" data-act="again">もう一度</button><button class="btn ghost" data-act="title">タイトルへ</button></div>
        <button class="btn ghost wide" data-act="closeResult">盤面と逃走経路を見る</button></div>`;
      return;
    }
    if (G && A.role === "pass" && !G.over && (A.cover === "x" || A.cover === "d")) {
      sc.hidden = false;
      sc.classList.add("cover");
      const toX = A.cover === "x";
      sc.innerHTML = `<div class="card"><div class="faces">${toX ? portrait("x", 0, "lg") : G.det.map((_, k) => portrait("d", k, "lg")).join("")}</div>
        <h2>${toX ? "怪盗Xの番です" : "刑事の番です"}</h2>
        <p class="c">${toX ? "刑事のみなさんは画面を見ないでください。<br>怪盗X役の人に端末を渡してください。" : "怪盗Xは移動しました。<br>刑事のみなさんに端末を渡してください。"}</p>
        <button class="btn wide" data-act="${toX ? "openX" : "openD"}">${toX ? "怪盗Xです。表示する" : "刑事です。はじめる"}</button></div>`;
      return;
    }
    sc.hidden = true;
  }

  function skylineSVG() {
    return `<svg class="skyline" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path d="M0,400 V300 H60 V270 H90 V300 H140 V250 H170 V300 H230 V280 H260 V220 L275,120 L290,220 V300 H320 V285 H380 V300 H420
        V180 H424 V170 L432,150 L440,170 V180 H444 V300 H470 V260 A40,40 0 0 1 550,260 V300 H600 V280 H640 V300
        H700 V200 L716,180 L732,200 V300 H760 V210 L776,190 L792,210 V300 H830 V290 H880 V240 H900 V300 H960 V270 H990 V300 H1040 V230 L1060,140 L1080,230 V300 H1120 V280 H1200 V400 Z" fill="#0A0D14"/>
      <path d="M700,236 H792" stroke="#0A0D14" stroke-width="8"/>
      <circle cx="432" cy="195" r="7" fill="#E3B341" opacity="0.8"/>
      ${Array.from({ length: 26 }, (_, i) => `<rect x="${40 + i * 44}" y="${320 + (i % 3) * 18}" width="6" height="9" fill="#E3B341" opacity="${0.25 + (i % 4) * 0.12}"/>`).join("")}
    </svg>`;
  }

  // 盤面の背景画像（路線・駅なし）を書き出す
  async function exportBackground(fmt) {
    const svg = backgroundSVG();
    let blob;
    try {
      if (fmt === "svg") blob = new Blob([svg], { type: "image/svg+xml" });
      else {
        toast("背景画像を書き出しています…");
        const im = new Image();
        im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
        await im.decode();
        const k = 1.5;
        const c = document.createElement("canvas");
        c.width = W * k; c.height = H * k;
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        blob = await new Promise(r => c.toBlob(r, "image/png"));
      }
    } catch (e) { toast("画像を作れませんでした"); return; }
    const filename = `london-chase-background.${fmt}`;
    let dl = null;
    try { dl = await window.claude?.use?.("downloads"); } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename, data: blob }); toast(`${filename} を保存しました`); }
      catch (e) { if (e?.code !== "declined") toast("保存できませんでした"); }
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }
  window.londonChaseBackgroundSVG = () => backgroundSVG();

  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    $("toastHost").replaceChildren(t);
    setTimeout(() => { if (t.parentNode) t.remove(); }, 2500);
  }

  // ======================================================================
  // イベント
  // ======================================================================
  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    const { w, h } = vpSize();
    switch (act) {
      case "start": return startGame(b.dataset.role);
      case "resume": { const s = loadSave(); if (s) resume(s); return; }
      case "again": return startGame(A.role);
      case "title": clearTimeout(timer); A.screen = "title"; A.sel = null; renderScreen(); renderSheet(); return;
      case "menu": clearTimeout(timer); save(); A.screen = "title"; A.sel = null; renderScreen(); renderSheet(); return;
      case "rules": A.screen = "rules"; renderScreen(); return;
      case "exportBg": exportBackground(b.dataset.fmt); return;
      case "dets": A.detCount = Number(b.dataset.n); renderScreen(); return;
      case "result": A.screen = "result"; renderScreen(); return;
      case "closeResult": A.screen = "game"; renderScreen(); fitView(); return;
      case "openX": A.cover = "x-open"; render(); focusTurn(); return;
      case "openD": A.cover = null; render(); step(); return;
      case "zoomIn": return zoomAt(1.5, w / 2, h / 2);
      case "zoomOut": return zoomAt(1 / 1.5, w / 2, h / 2);
      case "fit": return fitView();
      case "focusTurn": return focusTurn();
      case "focusX": { const G = A.G; if (!G) return; if (xVisible()) centerOn(A.sec.pos); else if (G.lastSeen) centerOn(G.lastSeen.pos); else toast("怪盗Xはまだ姿を見せていません"); return; }
      case "focusD": return A.G && centerOn(A.G.det[Number(b.dataset.k)].pos);
      case "hint": A.hints = !A.hints; render(); return;
      case "log": $("drawer").hidden = !$("drawer").hidden; return;
      case "cancel": A.sel = null; A.useDouble = false; render(); return;
      case "double": A.useDouble = !A.useDouble; renderSheet(); return;
      case "heli": {
        if (!humanTurn()) return;
        const G = A.G, moves = G.turn === "x" ? xMoves(G, A.sec) : detMoves(G, G.turn);
        if (!moves.some(m => m.type === "heli")) return;
        A.sel = -1; A.useDouble = false; render(); return;
      }
      case "ticket": {
        const G = A.G, to = A.sel, type = b.dataset.type;
        if (to === null || !humanTurn()) return;
        if (G.turn === "x") commitX(to, type); else commitD(G.turn, to, type);
        return;
      }
    }
  });
  $("sheet").addEventListener("click", e => { if (e.target === $("sheet")) { A.sel = null; A.useDouble = false; render(); } });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && A.sel !== null) { A.sel = null; render(); }
    if (A.screen !== "game") return;
    const { w, h } = vpSize();
    if (e.key === "+" || e.key === "=") zoomAt(1.4, w / 2, h / 2);
    if (e.key === "-") zoomAt(1 / 1.4, w / 2, h / 2);
  });

  // ======================================================================
  // 起動
  // ======================================================================
  function boot(data) {
    renderBackground();
    buildBoard();
    fitView(false);
    if (data && data.A && data.A.G) {
      Object.assign(A, data.A, { busy: false });
      buildTokens();
      if (A.screen === "game" && !A.G.over) step(); else render();
    } else {
      renderScreen();
    }
  }
  try { window.claude?.hot?.snapshot?.(() => ({ A })); } catch (e) {}
  if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
  else boot(window.claude?.hot?.data ?? {});
})();
</script>
<!-- ARTIFACT-BODY-END -->
</body>
